<style>
  body { min-height: 100dvh; }
  .auth-input { width: 100%; border: 1px solid #c4c6cd; border-radius: 8px; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 14px; color: #181c20; background: #ffffff; transition: border-color .15s ease; }
  .auth-input:focus { outline: 2px solid #775a19; outline-offset: 1px; }
  .auth-label { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: #44474c; display: block; margin-bottom: 5px; }
  .auth-card { background: #ffffff; border: 1px solid #e0e3e8; border-radius: 20px; padding: 32px 28px; box-shadow: 0 4px 24px rgba(4,22,39,0.06); }
  .auth-input-wrap { position: relative; }
  .auth-input-wrap .auth-input { padding-left: 40px; }
  .auth-input-wrap .auth-input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 19px; color: #9aa1ab; pointer-events: none; }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased">

<header class="flex items-center justify-between h-16 border-b border-outline-variant bg-surface-bright px-4">
  <div class="w-10"></div>
  <a href="index.html" class="font-headline-md text-headline-md font-bold text-primary">Darwesh Group</a>
  <div class="relative w-10 flex justify-end">
<button aria-label="Language" class="lang-toggle-btn p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">language</span>
</button>
<div class="lang-menu hidden absolute right-0 top-full mt-1 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg py-1 min-w-[130px] z-50">
<button class="lang-option w-full text-left px-4 py-2 text-[13.5px] hover:bg-surface-container transition-colors" data-lang="en" onclick="setLanguage('en')" type="button">English</button>
<button class="lang-option w-full text-left px-4 py-2 text-[13.5px] hover:bg-surface-container transition-colors" data-lang="ku" onclick="setLanguage('ku')" type="button">کوردی</button>
<button class="lang-option w-full text-left px-4 py-2 text-[13.5px] hover:bg-surface-container transition-colors" data-lang="ar" onclick="setLanguage('ar')" type="button">العربية</button>
</div>
</div>
</header>

<main class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <p class="font-headline-md text-headline-md text-primary mb-1" data-i18n="auth.logInTitle">Log in</p>
      <p class="font-body-md text-[13px] text-on-surface-variant" data-i18n="auth.logInSubtitle">Access your favorites, submissions, and saved searches.</p>
    </div>

    <div class="auth-card">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="auth-label" for="fEmail" data-i18n="auth.email">Email</label>
          <div class="auth-input-wrap">
            <span class="material-symbols-outlined auth-input-icon">mail</span>
            <input id="fEmail" class="auth-input" required type="email" autocomplete="email"/>
          </div>
        </div>
        <div>
          <label class="auth-label" for="fPassword" data-i18n="auth.password">Password</label>
          <div class="auth-input-wrap">
            <span class="material-symbols-outlined auth-input-icon">lock</span>
            <input id="fPassword" class="auth-input" required type="password" autocomplete="current-password"/>
          </div>
        </div>
        <p id="authError" class="hidden text-error text-[13px]"></p>
        <button id="submitBtn" class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-caps text-label-caps hover:bg-primary-container transition-colors" type="submit" data-i18n="auth.logInBtn">Log In</button>
      </form>

      <button id="forgotBtn" class="block mx-auto mt-4 font-label-caps text-label-caps text-on-surface-variant hover:text-primary" type="button" data-i18n="auth.forgotPassword">Forgot password?</button>
    </div>

    <p class="font-body-md text-[13px] text-on-surface-variant text-center mt-6">
      <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="signup.html" class="text-secondary font-medium hover:underline" data-i18n="auth.signUpLink">Sign up</a>
    </p>
    <a href="index.html" class="block text-center mt-4 font-label-caps text-label-caps text-on-surface-variant hover:text-primary" data-i18n="nav.backToSite">Back to site</a>
  </div>
</main>

<!-- Forgot Password Modal -->
<div class="hidden fixed inset-0 z-[70] flex items-end md:items-center justify-center" id="forgotModalOverlay">
<div class="absolute inset-0 bg-primary/60 backdrop-blur-sm" id="forgotModalBackdrop"></div>
<div class="relative bg-surface-container-lowest w-full md:max-w-sm rounded-t-2xl md:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
<button aria-label="Close" class="absolute top-4 right-4 p-2 rounded-full hover:bg-surface-container-high transition-colors" id="forgotModalClose" type="button">
<span class="material-symbols-outlined">close</span>
</button>
<div id="forgotModalFormView">
<h2 class="font-headline-md text-headline-md text-primary mb-1" data-i18n="auth.resetPasswordTitle">Reset your password</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md text-[13px]" data-i18n="auth.resetPasswordSubtitle">Enter the email on your account and we'll send you a link to reset your password.</p>
<form id="forgotForm">
<div class="mb-4">
<label class="auth-label" for="resetEmail" data-i18n="auth.email">Email</label>
<div class="auth-input-wrap">
<span class="material-symbols-outlined auth-input-icon">mail</span>
<input class="auth-input" id="resetEmail" required type="email" autocomplete="email"/>
</div>
</div>
<p id="forgotError" class="text-error text-[13px] mb-3 hidden"></p>
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-caps text-label-caps hover:bg-primary-container transition-colors flex items-center justify-center gap-2" id="forgotSubmitBtn" type="submit">
<span class="material-symbols-outlined text-[18px]">send</span>
<span data-i18n="auth.sendResetLink">Send Reset Link</span>
</button>
</form>
</div>
<div class="hidden text-center py-4" id="forgotModalSuccessView">
<div class="w-14 h-14 rounded-full bg-tertiary-container/40 flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-[28px] text-on-tertiary-container">mark_email_read</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-2" data-i18n="auth.resetLinkSentTitle">Check your inbox</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-[13.5px] mb-6" id="forgotModalSuccessBody"></p>
<button class="w-full border border-outline-variant rounded-lg py-3 font-label-caps text-label-caps text-on-surface hover:bg-surface-container transition-colors" id="forgotModalDoneBtn" type="button" data-i18n="common.close">Close</button>
</div>
</div>
</div>

<script src="./js/i18n.js"></script>
<script type="module">
  import { auth, db } from './js/firebase-init.js';
  import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Already logged in? Skip straight to the right dashboard instead of
  // showing the login form again.
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const snap = await getDoc(doc(db, 'users', user.uid));
    const role = snap.exists() ? snap.data().role : 'customer';
    window.location.href = role === 'agent' ? 'agent-dashboard.html' : 'account.html';
  });

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }

  function tr(key, fallback) { return (window.t && window.t(key)) || fallback; }

  function friendlyLoginError(code) {
    switch (code) {
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found':
        return tr('auth.errIncorrect', 'Incorrect email or password.');
      case 'auth/invalid-email': return tr('auth.errBadEmail', "That email address doesn't look right.");
      case 'auth/too-many-requests': return tr('auth.errTooMany', 'Too many attempts — please wait a moment and try again.');
      default: return tr('auth.errLoginGeneric', 'Something went wrong logging in. Please try again.');
    }
  }

  // Separate from friendlyLoginError: auth/user-not-found here means "no
  // account with that email" — reusing the login flow's "Incorrect email
  // or password" message for this would be a nonsensical, wrong message
  // for a password-reset flow. This is that fix.
  function friendlyResetError(code) {
    switch (code) {
      case 'auth/user-not-found': return tr('auth.errNoAccount', 'No account was found with that email.');
      case 'auth/invalid-email': return tr('auth.errBadEmail', "That email address doesn't look right.");
      case 'auth/too-many-requests': return tr('auth.errTooMany', 'Too many attempts — please wait a moment and try again.');
      default: return tr('auth.errResetGeneric', 'Something went wrong sending the reset email. Please try again.');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = tr('auth.loggingIn', 'Logging in…');

    const email = document.getElementById('fEmail').value.trim();
    const password = document.getElementById('fPassword').value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      const role = snap.exists() ? snap.data().role : 'customer';
      window.location.href = role === 'agent' ? 'agent-dashboard.html' : 'account.html';
    } catch (err) {
      showError(friendlyLoginError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = tr('auth.logInBtn', 'Log In');
    }
  });

  // ---------------------------------------------------------------------
  // Forgot Password modal — a dedicated flow with its own email field and
  // its own error/success messaging, instead of reusing the login form's
  // email input and reusing friendlyLoginError() (which used to show the
  // wrong message — "Incorrect email or password" — for a flow that has
  // no password to check).
  // ---------------------------------------------------------------------
  const forgotOverlay = document.getElementById('forgotModalOverlay');
  const forgotFormView = document.getElementById('forgotModalFormView');
  const forgotSuccessView = document.getElementById('forgotModalSuccessView');
  const forgotForm = document.getElementById('forgotForm');
  const forgotError = document.getElementById('forgotError');
  const forgotSubmitBtn = document.getElementById('forgotSubmitBtn');
  const resetEmailInput = document.getElementById('resetEmail');

  function openForgotModal() {
    forgotFormView.classList.remove('hidden');
    forgotSuccessView.classList.add('hidden');
    forgotError.classList.add('hidden');
    forgotForm.reset();
    resetEmailInput.value = document.getElementById('fEmail').value.trim();
    forgotOverlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    resetEmailInput.focus();
  }
  function closeForgotModal() {
    forgotOverlay.classList.add('hidden');
    document.body.style.overflow = '';
  }

  document.getElementById('forgotBtn').addEventListener('click', openForgotModal);
  document.getElementById('forgotModalClose').addEventListener('click', closeForgotModal);
  document.getElementById('forgotModalBackdrop').addEventListener('click', closeForgotModal);
  document.getElementById('forgotModalDoneBtn').addEventListener('click', closeForgotModal);

  // Point the reset link at our own reset-password.html instead of
  // Firebase's default hosted handler (<project>.firebaseapp.com/__/auth/
  // action) — some networks/DNS resolvers block *.firebaseapp.com
  // outright, which made the emailed link fail to load at all even
  // though the email itself arrived fine. handleCodeInApp: true makes
  // Firebase link straight to our page with the oobCode as a query
  // param; reset-password.html calls verifyPasswordResetCode /
  // confirmPasswordReset itself using the same Firebase Auth SDK.
  const resetActionCodeSettings = {
    url: window.location.origin + '/reset-password.html',
    handleCodeInApp: true
  };

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    forgotError.classList.add('hidden');
    const email = resetEmailInput.value.trim();
    forgotSubmitBtn.disabled = true;
    try {
      await sendPasswordResetEmail(auth, email, resetActionCodeSettings);
      document.getElementById('forgotModalSuccessBody').textContent =
        tr('auth.resetLinkSentBody', 'If an account exists for') + ' ' + email + tr('auth.resetLinkSentBodySuffix', ", we've sent a link to reset your password.");
      forgotFormView.classList.add('hidden');
      forgotSuccessView.classList.remove('hidden');
    } catch (err) {
      forgotError.textContent = friendlyResetError(err.code);
      forgotError.classList.remove('hidden');
    } finally {
      forgotSubmitBtn.disabled = false;
    }
  });
</script>
</body></html>
