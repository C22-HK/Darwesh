<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<script>(function(){var l=localStorage.getItem('darwesh_lang');document.documentElement.lang=l||'en';document.documentElement.dir=(l==='ku'||l==='ar')?'rtl':'ltr';})();</script>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Darwesh Group - Log In</title>
<link href="css/tailwind.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  body { min-height: 100dvh; }
  .auth-input { width: 100%; border: 1px solid #c4c6cd; border-radius: 8px; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 14px; color: #181c20; background: #ffffff; transition: border-color .15s ease; }
  .auth-input:focus { outline: 2px solid #775a19; outline-offset: 1px; }
  .auth-label { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: #44474c; display: block; margin-bottom: 5px; }
  .auth-card { background: #ffffff; border: 1px solid #e0e3e8; border-radius: 20px; padding: 32px 28px; box-shadow: 0 4px 24px rgba(4,22,39,0.06); }
  .auth-input-wrap { position: relative; }
  .auth-input-wrap .auth-input { padding-left: 40px; }
  .auth-input-wrap .auth-input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 19px; color: #9aa1ab; pointer-events: none; }
  .auth-input-wrap .auth-input.has-toggle { padding-right: 40px; }
  .auth-toggle-visibility { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 6px; border-radius: 50%; cursor: pointer; color: #9aa1ab; display: flex; align-items: center; justify-content: center; transition: background-color .15s ease, color .15s ease; }
  .auth-toggle-visibility:hover { background: #f1f4f9; color: #44474c; }
  .auth-spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: auth-spin .7s linear infinite; vertical-align: -3px; margin-inline-end: 8px; }
  @keyframes auth-spin { to { transform: rotate(360deg); } }
  .auth-card { animation: auth-card-in .35s ease both; }
  @keyframes auth-card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased">

<header class="flex items-center justify-between h-16 border-b border-outline-variant bg-surface-bright px-4">
  <div class="w-10"></div>
  <a href="index.html" class="font-headline-md text-headline-md font-bold text-primary">Darwesh Group</a>
  <div class="relative w-10 flex justify-end">
<button aria-label="Language" class="lang-toggle-btn p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">language</span>
</button>
<div class="lang-menu hidden absolute right-0 top-full mt-1 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg py-1 min-w-[130px] z-50">
<button class="lang-option w-full text-left px-4 py-2 text-[13.5px] hover:bg-surface-container transition-colors" data-lang="en" onclick="setLanguage('en')" type="button">English</button>
<button class="lang-option w-full text-left px-4 py-2 text-[13.5px] hover:bg-surface-container transition-colors" data-lang="ku" onclick="setLanguage('ku')" type="button">کوردی</button>
<button class="lang-option w-full text-left px-4 py-2 text-[13.5px] hover:bg-surface-container transition-colors" data-lang="ar" onclick="setLanguage('ar')" type="button">العربية</button>
</div>
</div>
</header>

<main class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <p class="font-headline-md text-headline-md text-primary mb-1" data-i18n="auth.logInTitle">Log in</p>
      <p class="font-body-md text-[13px] text-on-surface-variant" data-i18n="auth.logInSubtitle">Access your favorites, submissions, and saved searches.</p>
    </div>

    <div class="auth-card">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="auth-label" for="fEmail" data-i18n="auth.email">Email</label>
          <div class="auth-input-wrap">
            <span class="material-symbols-outlined auth-input-icon">mail</span>
            <input id="fEmail" class="auth-input" required type="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false"/>
          </div>
        </div>
        <div>
          <label class="auth-label" for="fPassword" data-i18n="auth.password">Password</label>
          <div class="auth-input-wrap">
            <span class="material-symbols-outlined auth-input-icon">lock</span>
            <input id="fPassword" class="auth-input has-toggle" required type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"/>
            <button type="button" class="auth-toggle-visibility" id="toggleFPassword" aria-label="Show password" data-i18n-aria="auth.showPassword" title="Show password">
              <span class="material-symbols-outlined" id="toggleFPasswordIcon" style="font-size:19px;">visibility</span>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between -mt-1">
          <label class="flex items-center gap-2 font-body-md text-[13px] text-on-surface cursor-pointer select-none">
            <input id="rememberMe" type="checkbox" class="rounded" checked/>
            <span data-i18n="auth.rememberMe">Remember me</span>
          </label>
          <a href="reset-password.html" class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors" data-i18n="auth.forgotPassword">Forgot password?</a>
        </div>
        <p id="authError" class="hidden text-error text-[13px]"></p>
        <button id="submitBtn" class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-caps text-label-caps hover:bg-primary-container transition-colors flex items-center justify-center" type="submit">
          <span class="auth-spinner hidden" id="submitSpinner"></span>
          <span id="submitBtnLabel" data-i18n="auth.logInBtn">Log In</span>
        </button>
      </form>
    </div>

    <p class="font-body-md text-[13px] text-on-surface-variant text-center mt-6">
      <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="signup.html" class="text-secondary font-medium hover:underline" data-i18n="auth.signUpLink">Sign up</a>
    </p>
    <a href="index.html" class="block text-center mt-4 font-label-caps text-label-caps text-on-surface-variant hover:text-primary" data-i18n="nav.backToSite">Back to site</a>
  </div>
</main>

<script src="./js/i18n.js"></script>
<script type="module">
  import { auth, db, getDoc } from './js/firebase-init.js';
  import { signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Already logged in? Skip straight to the right dashboard instead of
  // showing the login form again.
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const snap = await getDoc(doc(db, 'users', user.uid));
    const role = snap.exists() ? snap.data().role : 'customer';
    window.location.href = role === 'agent' ? 'agent-dashboard.html' : 'account.html';
  });

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');
  const submitSpinner = document.getElementById('submitSpinner');
  const submitBtnLabel = document.getElementById('submitBtnLabel');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }

  function setSubmitLoading(loading, loadingText, idleText) {
    submitBtn.disabled = loading;
    submitSpinner.classList.toggle('hidden', !loading);
    submitBtnLabel.textContent = loading ? loadingText : idleText;
  }

  // Show/Hide password -- toggles the input type and swaps the eye icon;
  // purely a visibility aid, doesn't change what's submitted.
  function wirePasswordToggle(inputId, btnId, iconId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const icon = document.getElementById(iconId);
    btn.addEventListener('click', () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      icon.textContent = showing ? 'visibility' : 'visibility_off';
      btn.setAttribute('aria-label', showing ? tr('auth.showPassword', 'Show password') : tr('auth.hidePassword', 'Hide password'));
    });
  }
  wirePasswordToggle('fPassword', 'toggleFPassword', 'toggleFPasswordIcon');

  function tr(key, fallback) { return (window.t && window.t(key)) || fallback; }

  function friendlyLoginError(code) {
    switch (code) {
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found':
        return tr('auth.errIncorrect', 'Incorrect email or password.');
      case 'auth/invalid-email': return tr('auth.errBadEmail', "That email address doesn't look right.");
      case 'auth/too-many-requests': return tr('auth.errTooMany', 'Too many attempts — please wait a moment and try again.');
      default: return tr('auth.errLoginGeneric', 'Something went wrong logging in. Please try again.');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.add('hidden');
    setSubmitLoading(true, tr('auth.loggingIn', 'Logging in…'), tr('auth.logInBtn', 'Log In'));

    const email = document.getElementById('fEmail').value.trim().toLowerCase();
    // Trimmed -- a trailing/leading space or newline from autofill or a
    // mobile keyboard quirk is never something a real user intends as
    // part of their password, and Firebase does NOT trim or normalize
    // whitespace itself. Left untrimmed, "the same" password captured
    // slightly differently by two devices' autofill silently stops
    // matching -- this is applied identically here, on signup.html, and
    // on reset-password.html so whatever a user sets their password to
    // always compares the same way everywhere.
    const password = document.getElementById('fPassword').value.trim();
    const rememberMe = document.getElementById('rememberMe').checked;

    // "Remember me" controls whether the signed-in session survives
    // closing the browser (LOCAL) or is cleared with it (SESSION).
    // Deliberately NOT in the same try/catch as the actual sign-in
    // below: Safari Private Browsing and several in-app browsers
    // (Instagram/Facebook/WhatsApp link previews) block IndexedDB,
    // which this call depends on -- when that happens the correct
    // email+password would otherwise never even get submitted, and the
    // visitor sees a generic "something went wrong" that looks
    // identical to a real credentials error. A failure here is now
    // logged for diagnosis and simply skipped; the browser's default
    // persistence still applies, so sign-in can proceed regardless.
    try {
      await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
    } catch (persistErr) {
      console.error('[login] setPersistence failed, continuing with sign-in anyway', persistErr.code || persistErr.name, persistErr.message);
    }

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      const role = snap.exists() ? snap.data().role : 'customer';
      window.location.href = role === 'agent' ? 'agent-dashboard.html' : 'account.html';
    } catch (err) {
      // The real error is always captured here (and, once Sentry is
      // configured via js/error-monitor.js, reported) -- only the safe,
      // generic friendlyLoginError() text ever reaches the visitor.
      console.error('[login] sign-in failed', err.code || err.name, err.message);
      showError(friendlyLoginError(err.code));
      setSubmitLoading(false, '', tr('auth.logInBtn', 'Log In'));
    }
  });
</script>
<script type="module" src="./js/error-monitor.js"></script>
</body></html>
