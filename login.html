<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Darwesh Group - Log In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f7f9ff", "on-secondary-fixed-variant": "#5d4201", "secondary": "#775a19",
                        "on-secondary-fixed": "#261900", "on-primary-fixed": "#0b1d2d", "primary": "#041627",
                        "error": "#ba1a1a", "inverse-primary": "#b7c8de", "surface-container-low": "#f1f4f9",
                        "on-primary-fixed-variant": "#38485a", "tertiary-fixed": "#6bfe9c", "surface-variant": "#e0e3e8",
                        "on-tertiary-fixed": "#00210c", "primary-fixed": "#d2e4fb", "on-primary": "#ffffff",
                        "surface": "#f7f9ff", "surface-container-high": "#e5e8ee", "inverse-surface": "#2d3135",
                        "on-error-container": "#93000a", "on-secondary": "#ffffff", "error-container": "#ffdad6",
                        "inverse-on-surface": "#eef1f6", "on-error": "#ffffff", "outline-variant": "#c4c6cd",
                        "outline": "#74777d", "primary-container": "#1a2b3c", "tertiary-container": "#003115",
                        "tertiary-fixed-dim": "#4ae183", "primary-fixed-dim": "#b7c8de", "secondary-container": "#fed488",
                        "secondary-fixed-dim": "#e9c176", "secondary-fixed": "#ffdea5", "surface-dim": "#d7dadf",
                        "tertiary": "#001a08", "surface-container-lowest": "#ffffff", "on-background": "#181c20",
                        "surface-container-highest": "#e0e3e8", "on-tertiary-container": "#00a656", "on-primary-container": "#8192a7",
                        "on-tertiary": "#ffffff", "on-tertiary-fixed-variant": "#005228", "on-surface-variant": "#44474c",
                        "surface-tint": "#4f6073", "on-secondary-container": "#785a1a", "surface-container": "#ebeef3",
                        "background": "#f7f9ff", "on-surface": "#181c20"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "gutter": "24px", "stack-lg": "32px", "stack-md": "16px", "margin-desktop": "48px", "stack-sm": "8px", "container-max": "1280px", "margin-mobile": "16px", "unit": "8px" },
                    "fontFamily": { "headline-md": ["Plus Jakarta Sans"], "label-caps": ["IBM Plex Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "body-md": ["Inter"], "data-mono": ["Inter"], "display-lg": ["Plus Jakarta Sans"] },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
  body { min-height: 100dvh; }
  .auth-input { width: 100%; border: 1px solid #c4c6cd; border-radius: 8px; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 14px; color: #181c20; background: #ffffff; }
  .auth-input:focus { outline: 2px solid #775a19; outline-offset: 1px; }
  .auth-label { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: #44474c; display: block; margin-bottom: 5px; }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased">

<header class="flex items-center justify-center h-16 border-b border-outline-variant bg-surface-bright">
  <a href="index.html" class="font-headline-md text-headline-md font-bold text-primary">Darwesh Group</a>
</header>

<main class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <p class="font-headline-md text-headline-md text-primary mb-1">Log in</p>
    <p class="font-body-md text-[13px] text-on-surface-variant mb-6">Access your favorites, submissions, and saved searches.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="auth-label" for="fEmail">Email</label>
        <input id="fEmail" class="auth-input" required type="email"/>
      </div>
      <div>
        <label class="auth-label" for="fPassword">Password</label>
        <input id="fPassword" class="auth-input" required type="password"/>
      </div>
      <p id="authError" class="hidden text-error text-[13px]"></p>
      <p id="authInfo" class="hidden text-[13px]" style="color:#006300;"></p>
      <button id="submitBtn" class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-caps text-label-caps hover:bg-primary-container transition-colors" type="submit">Log In</button>
    </form>

    <button id="forgotBtn" class="block mx-auto mt-4 font-label-caps text-label-caps text-on-surface-variant hover:text-primary" type="button">Forgot password?</button>

    <p class="font-body-md text-[13px] text-on-surface-variant text-center mt-6">
      Don't have an account? <a href="signup.html" class="text-secondary font-medium hover:underline">Sign up</a>
    </p>
    <a href="index.html" class="block text-center mt-4 font-label-caps text-label-caps text-on-surface-variant hover:text-primary">Back to site</a>
  </div>
</main>

<script type="module">
  import { auth, db } from './js/firebase-init.js';
  import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Already logged in? Skip straight to the right dashboard instead of
  // showing the login form again.
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const snap = await getDoc(doc(db, 'users', user.uid));
    const role = snap.exists() ? snap.data().role : 'customer';
    window.location.href = role === 'agent' ? 'agent-dashboard.html' : 'account.html';
  });

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('authError');
  const infoEl = document.getElementById('authInfo');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    infoEl.classList.add('hidden');
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }
  function showInfo(msg) {
    errEl.classList.add('hidden');
    infoEl.textContent = msg;
    infoEl.classList.remove('hidden');
  }

  function friendlyError(code) {
    switch (code) {
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found':
        return 'Incorrect email or password.';
      case 'auth/invalid-email': return 'That email address doesn\'t look right.';
      case 'auth/too-many-requests': return 'Too many attempts — please wait a moment and try again.';
      default: return 'Something went wrong logging in. Please try again.';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.add('hidden'); infoEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const email = document.getElementById('fEmail').value.trim();
    const password = document.getElementById('fPassword').value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      const role = snap.exists() ? snap.data().role : 'customer';
      window.location.href = role === 'agent' ? 'agent-dashboard.html' : 'account.html';
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });

  document.getElementById('forgotBtn').addEventListener('click', async () => {
    const email = document.getElementById('fEmail').value.trim();
    if (!email) { showError('Enter your email above first, then click "Forgot password?"'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      showInfo('Password reset email sent — check your inbox.');
    } catch (err) {
      showError(friendlyError(err.code));
    }
  });
</script>
</body></html>
