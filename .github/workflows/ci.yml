name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default (INFRA-09, INFRASTRUCTURE_REMEDIATION.md): neither
# job does anything beyond actions/checkout's own read (no PR comments, no
# releases, no pushes, no third-party action that writes with this token),
# so contents: read is enough -- raise a specific job's permissions only if
# a future step demonstrably needs more.
permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run static checks (JS syntax, i18n coverage, links, duplicate IDs)
        run: node scripts/ci-checks.js

  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify formatting
        run: ruff format --check app tests scripts
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        run: pytest
