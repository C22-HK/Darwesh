<main class="ps-shell py-8">

  <nav class="proj-breadcrumb mb-4" aria-label="Breadcrumb">
    <a href="index.html" data-i18n="proj.breadcrumbHome">Home</a>
    <span aria-hidden="true">&rsaquo;</span>
    <span data-i18n="proj.breadcrumbProjects">Projects</span>
    <span aria-hidden="true">&rsaquo;</span>
    <span id="projCityCrumb" aria-current="page"></span>
  </nav>

  <header class="mb-6">
    <h1 id="projPageTitle" class="font-headline-md text-[26px] md:text-[32px] font-bold text-on-surface"></h1>
  </header>

  <!-- Category tabs: All / Apartments / Residential Projects. "All" is
       selected initially and shows both categories for the selected
       city. These filter category only -- no Buy/Sell/Sell-submission
       controls live on this page. -->
  <div class="proj-tabs mb-6" id="projTabs" role="tablist" aria-label="Project category">
    <button type="button" class="proj-tab is-active" data-category="all" role="tab" aria-selected="true" data-i18n="proj.categoryAll">All</button>
    <button type="button" class="proj-tab" data-category="apartment" role="tab" aria-selected="false" data-i18n="proj.categoryApartment">Apartments</button>
    <button type="button" class="proj-tab" data-category="residential_community" role="tab" aria-selected="false" data-i18n="proj.categoryResidential">Residential Projects</button>
  </div>

  <p id="projCount" class="font-body-md text-[12.5px] text-on-surface-variant mb-4" role="status" aria-live="polite"></p>

  <div id="projLoading" aria-live="polite">
    <div class="proj-grid">
      <div class="ps-skeleton" style="height:280px;border-radius:16px;"></div>
      <div class="ps-skeleton" style="height:280px;border-radius:16px;"></div>
      <div class="ps-skeleton" style="height:280px;border-radius:16px;"></div>
    </div>
  </div>

  <div id="projGrid" class="proj-grid"></div>
  <div id="projEmpty" class="ps-empty hidden"></div>
