still provide: an injected payload (e.g. CLIENT-01/02, both since fixed) can
no longer load a script from an attacker-controlled domain or exfiltrate data
via fetch or img to one. Note: frame-ancestors, report-uri, and sandbox are
silently ignored when CSP is delivered via a meta tag (a browser spec rule,

<style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* Property price pins — color encodes verification status:

    .price-pin {

    /* ---- Property Wheel -------------------------------------------------
     * The listing column reads as a vertical picker, not a scrolling
     * list -- one property centered/focused, its neighbors visible above
     * and below at reduced scale/opacity. Motion reference only: an
     * iPhone-timer-wheel FEEL (centered focus, snap-to-nearest, gentle
     * depth), not Apple's visuals/assets/typography -- every value below
     * is this page's own cinematic dark-luxury palette. Text never
     * rotates; cards stay upright and fully readable at every position.
     * Native CSS scroll-snap does the actual snapping (smooth, free,
     * identical for wheel/trackpad/touch) -- JS only adds the continuous
     * depth (scale/opacity) transform while scrolling and detects when a
     * new card has settled into center (see renderList()/wireWheel()). */
    #cardList {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      outline: none;
    }
    #cardList.wheel-instant-scroll { scroll-behavior: auto; }
    .wheel-spacer { flex: none; scroll-snap-align: none; }
    .listing-card {
      /* A fixed, breakpoint-specific height (not just min-height) is
         what makes the snap-centering math in wireWheel() exact --
         every real card, in every language, must be the same height so
         "distance from the container's vertical center" means the same
         thing for every card. Content inside is deliberately kept to
         fixed single-line rows (truncated, never wrapped) so this holds
         regardless of how long a given language's price/address text is. */
      height: 124px;
      margin-block: 5px;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      flex: none;
      transform-origin: center center;
      /* transform/opacity are driven per-frame by JS while scrolling
         (raw values, no CSS lag fighting a live scroll position) --
         only the discrete "just became active" cues transition, so the
         gold focus border/shadow eases in once a card actually settles
         into center rather than flickering on every intersection tick. */
      transition: border-color 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
    }
    .listing-card.active {
      border-color: #B89A63;
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    @media (min-width: 768px) {
      .listing-card { height: 140px; margin-block: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #cardList { scroll-behavior: auto; }
      .listing-card { transition: none; transform: none !important; opacity: 1 !important; }
    }

    /* ---- MAM AI ---------------------------------------------------------
     * A floating assistant dock layered OVER the live map/results -- an
     * original Darwesh implementation. The interaction shape (a compact
     * search bar that expands into a conversation panel, both staying on
     * top of the real search behind them) is the only thing taken as
     * reference from Zillow's own AI search UX; every asset, string, and

     * palette (see css/cinematic.css), not copied markup/CSS. This is the
     * ONE public map's own AI dock -- MAM has no separate map of its own. */
    #drmAiWrap {
      position: fixed; z-index: 1150; left: 50%; transform: translateX(-50%);
      bottom: 20px; width: min(92vw, 640px);
      display: flex; flex-direction: column; gap: 10px; align-items: stretch;
      pointer-events: none;
    }
    #drmAiWrap > * { pointer-events: auto; }
    .drm-ai-chips {
      display: flex; flex-wrap: nowrap; gap: 6px; justify-content: flex-start;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding: 0 2px; scroll-padding: 0 2px;

    .drm-ai-mark {

    /* #drmAiPanel/.drm-ai-chips set their own `display` above -- both an

       none}` utility and leave the panel visible while "closed." This is
       the one, explicit place that guarantees `hidden` always wins. */
    #drmAiPanel.hidden, .drm-ai-chips.hidden { display: none !important; }
    /* The AI dock floats fixed over the bottom of the list panel (by
       design, matching the layered "assistant over live results" shape
       this is inspired by) -- this reserves enough scroll room that the
       last real card can still be scrolled fully clear of it, rather
       than staying permanently obscured. */
    #listPanel { padding-bottom: 180px; }
    @media (min-width: 768px) { #listPanel { padding-bottom: 96px; } }
    /* css/mam-companion.css deliberately docks to the same PHYSICAL edge
       in both directions (see its own comment) -- the right choice on a
       page with nothing competing for that edge. Here, though, the list
       panel itself moves to the right in RTL (matching reading
       direction), which would put the companion right on top of it.
       This page-scoped override keeps the companion over the map side
       instead, in both directions -- a host page restyling the shared
       module for its own layout, not a change to the module's default. */
    html[dir="rtl"] .mamco-root { right: auto; left: 20px; }
    @media (max-width: 767px) { html[dir="rtl"] .mamco-root { left: 10px; right: auto; } }
  </style>
</head>

// ---------------------------------------------------------------------
// Real listings, loaded live from Firestore's `listings` collection —
// the same collection admin.html and agent-dashboard.html write to.
// firestore.rules only allows an anonymous/public read when the query
// itself is constrained to private==false AND status=='active' (a
// listing-level get() or an unfiltered query is denied) -- so this is
// the only listing set this page can ever fetch for a public visitor.
// Private listings never reach this page's memory at all any more, so
// isPrivateHidden()/revealListing() below naturally never trigger for
// them; they're left in place only because an agent's OWN private
// listings still round-trip through the same `card()`/marker code when
// viewed from agent-dashboard.html's map. A listing with no lat/lng
// can't be placed on this map so it's left out here.
// ---------------------------------------------------------------------
let listingsLoadError = false;
async function loadListings() {
  listingsLoadError = false;
  try {
    const [{ db, getDocs }, storeMod] = await Promise.all([
      import('./js/firebase-init.js'),
      import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
    ]);
    const { collection, query, where, limit } = storeMod;
    const { MAP_LISTINGS_CAP } = await import('./js/data-cache.js');
    // THE MAP IS DELIBERATELY NOT PAGINATED. Perf pass 3/3 moved
    // index.html, buy.html and services.html to cursor pagination and
    // count aggregation; this page is the considered exception.
    //
    // A map plots every matching marker at once, and this one also
    // supports polygon draw and "search this area" across the whole set.
    // Paginating it would mean a property inside the drawn polygon simply
    // not being there because it fell on page 3 -- a correctness and trust
    // failure, and exactly the "valid nearby properties disappear" outcome
    // that must not happen. A read saved is not worth a listing hidden
    // from someone searching the street it is on.
    //
    // The correct fix is a geographic query: store a geohash on each
    // listing and issue geohash RANGE queries for the visible bounds
    // (the standard Firestore pattern, geofire-common). That is a schema
    // field plus a backfill, and it has to be reconciled with LOC-01 --
    // the geohash must be computed from the ROUNDED publicLat/publicLng,
    // never the exact private coordinate, or the hash itself leaks
    // precision that LOC-01 exists to remove. That is a designed change,
    // not a client tweak, so it is documented as the next map step rather
    // than approximated here with something that looks like pagination
    // and quietly loses markers.
    const q = query(collection(db, 'listings'), where('private', '==', false), where('status', '==', 'active'), limit(MAP_LISTINGS_CAP));
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    // Seeds the public listing documents this page already downloaded so
    // opening one paints instantly on listing.html. No extra Firestore
    // read. LOC-01 is unaffected: what gets seeded is exactly the public
    // document, which carries only the rounded publicLat/publicLng --
    // js/data-cache.js structurally cannot seed the private/location
    // subcollection, since it accepts only two-segment paths.
    try {
      const { seedQuerySnapshot } = await import('./js/data-cache.js');
      seedQuerySnapshot('listings', snap);
    } catch { /* seeding is an optimization, never a reason to fail a render */ }
    // LOC-01: the public map plots the ~1.1 km rounded pair the listing
    // document is now allowed to carry. A precise lat/lng is no longer
    // present on a public listing at all (see firestore.rules'
    // hasNoPreciseCoordFields + listings/{id}/private/location); the
    // `d.lat` fallback only keeps legacy, not-yet-backfilled documents
    // visible during the migration window.
    LISTINGS = docs.map(d => ({ ...d, _lat: (typeof d.publicLat === 'number') ? d.publicLat : d.lat, _lng: (typeof d.publicLng === 'number') ? d.publicLng : d.lng }))
      .filter(d => d._lat != null && d._lng != null).map(d => {
      const price = Number(d.price) || 0;
      return {
        id: d.id,
        city: d.city || '',
        address: d.address || d.title || '',
        lat: d._lat, lng: d._lng,
        type: d.dealType === 'rent' ? 'rent' : 'sale',
        price,
        priceLabel: d.dealType === 'rent' ? ('$' + price.toLocaleString() + '/mo') : ('$' + price.toLocaleString()),
        beds: Number(d.beds) || 0,
        baths: Number(d.baths) || 0,
        sqft: Number(d.sqft) || 0,
        propertyType: d.propertyType || '',
        img: d.img || IMAGES[0],
        verified: !!d.verified,
        private: !!d.private,
        // Real Firestore server timestamp when present (Timestamp
        // objects expose toMillis()) -- used only for the "Newest" sort
        // and Recommended's tie-break; falls back to 0 (sorts last) for
        // any older/incomplete doc rather than fabricating a date.
        createdAtMs: (d.createdAt && typeof d.createdAt.toMillis === 'function') ? d.createdAt.toMillis() : 0
      };
    });
  } catch (e) {
    LISTINGS = [];
    listingsLoadError = true;
  }
  listingsLoaded = true;
  refresh();
}

// Favorites & saved searches (Firebase). Loaded via dynamic import so
// this stays a plain classic script — no module-scope isolation issues
// with the rest of this file's functions/variables.
// ---------------------------------------------------------------------
let favAuth = null, favDb = null, favFns = null;
let favoriteIds = new Set();

async function initFavorites() {
  const [{ auth, db, getDocs, addDoc, setDoc, deleteDoc }, authMod, storeMod] = await Promise.all([
    import('./js/firebase-init.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
  ]);
  favAuth = auth; favDb = db;
  favFns = { ...authMod, ...storeMod, getDocs, addDoc, setDoc, deleteDoc };
  favFns.onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await favFns.getDocs(favFns.collection(db, 'users', user.uid, 'favorites'));
      favoriteIds = new Set();
      snap.forEach(d => favoriteIds.add(d.id));
    } else {
      favoriteIds = new Set();
    }
    refresh();
  });
}
initFavorites();

async function toggleFavorite(id) {
  if (!favAuth || !favAuth.currentUser) {
    showToast(tr('listing.loginToSave', 'Log in to save favorites'), 'favorite');
    setTimeout(() => { window.location.href = 'login.html'; }, 900);
    return;
  }
  const uid = favAuth.currentUser.uid;
  // Every other favoriting surface site-wide (buy.html, rent.html, and
  // listing.html -- the shared detail page for both sale and rent) uses
  // the 'buy-' + id doc-id prefix regardless of dealType. This page used
  // to write 'map-' + id instead, a different document for the exact
  // same listing -- so a listing favorited here never showed as already
  // saved on buy.html/rent.html/listing.html and vice versa, and
  // account.html's favorites list (no dedup by underlying listing id)
  // would show it twice. Matched to the site-wide convention.
  const idStr = 'buy-' + id;
  const l = LISTINGS.find(x => x.id === id);
  const ref = favFns.doc(favDb, 'users', uid, 'favorites', idStr);
  if (favoriteIds.has(idStr)) {
    favoriteIds.delete(idStr);
    await favFns.deleteDoc(ref);
    showToast(tr('listing.removedFromFavorites', 'Removed from favorites'), 'favorite');
  } else {
    favoriteIds.add(idStr);
    await favFns.setDoc(ref, {
      listingId: idStr, address: l.address, city: l.city,
      priceLabel: l.priceLabel, img: l.img, savedAt: favFns.serverTimestamp()
    });
    showToast(tr('listing.savedToFavorites', 'Saved to favorites'), 'favorite');
  }
  refresh();
}

let viewingListingId = null;

function openViewingModal(id) {
  viewingListingId = id;
  const l = LISTINGS.find(x => x.id === id);
  document.getElementById('viewingModalListingLine').textContent = l ? `${l.address}, ${l.city}` : '';
  document.getElementById('viewingRequestError').classList.add('hidden');
  document.getElementById('viewingRequestForm').reset();
  if (favAuth && favAuth.currentUser && favAuth.currentUser.email) {
    document.getElementById('viewingEmail').value = favAuth.currentUser.email;
  }
  document.getElementById('viewingModalOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeViewingModal() {
  document.getElementById('viewingModalOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}

document.getElementById('viewingModalClose').addEventListener('click', closeViewingModal);
document.getElementById('viewingModalBackdrop').addEventListener('click', closeViewingModal);

document.getElementById('viewingRequestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('viewingRequestError');
  errEl.classList.add('hidden');
  if (!favFns || !favDb) {
    errEl.textContent = tr('map.viewingRequestError', 'Could not send your request — please try again in a moment.');
    errEl.classList.remove('hidden');
    return;
  }
  const l = LISTINGS.find(x => x.id === viewingListingId);
  const name = document.getElementById('viewingName').value.trim();
  const phone = document.getElementById('viewingPhone').value.trim();
  const email = document.getElementById('viewingEmail').value.trim();
  const submitBtn = document.getElementById('viewingSubmitBtn');
  submitBtn.disabled = true;
  try {
    await favFns.addDoc(favFns.collection(favDb, 'submissions'), {
      type: 'viewing',
      listingId: viewingListingId,
      address: l ? l.address : '', city: l ? l.city : '', priceLabel: l ? l.priceLabel : '',
      lat: l ? l.lat : null, lng: l ? l.lng : null,
      name, phone, email,
      uid: (favAuth && favAuth.currentUser) ? favAuth.currentUser.uid : null,
      status: 'pending', createdAt: favFns.serverTimestamp()
    });
    closeViewingModal();
    showToast(tr('map.viewingRequestSent', 'Viewing request sent — an agent will contact you within 24 hours'), 'event_available');
  } catch (err) {
    errEl.textContent = tr('map.viewingRequestError', 'Could not send your request — please try again in a moment.');
    errEl.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
  }
});

async function saveCurrentSearch() {
  if (!favAuth || !favAuth.currentUser) {
    showToast(tr('map.loginToSaveSearch', 'Log in to save searches'), 'bookmark_add');
    setTimeout(() => { window.location.href = 'login.html'; }, 900);
    return;
  }
  const uid = favAuth.currentUser.uid;
  const cityVal = document.getElementById('citySearch').value.trim();
  const label = `${activeType === 'all' ? 'All types' : (activeType === 'sale' ? 'For Sale' : 'For Rent')}${cityVal ? ' in ' + cityVal : ' — Kurdistan Region'}`;
  // The full current search -- deal type, city, price, beds/baths,
  // property types, verified/area, sort -- travels as URL params (the
  // exact same params updateUrlState()/readUrlStateIntoFilters() already
  // use for shareable links), so reopening a saved search restores
  // everything it captured, not just type+city. `filters` is kept too,
  // for any older reader that still expects the plain {type,city} shape.
  const params = buildStateParams();
  const url = 'map.html' + (params.toString() ? '?' + params.toString() : '');
  await favFns.addDoc(favFns.collection(favDb, 'users', uid, 'savedSearches'), {
    label, url, filters: { type: activeType, city: cityVal }, createdAt: favFns.serverTimestamp()
  });
  showToast(tr('map.searchSavedToAccount', 'Search saved to your account'), 'check_circle');
}

// typically render from z16+) so no one can zoom in far enough to make
// out an individual property, private listing or not. The satellite/
// hybrid basemap below is capped at the exact same zoom for the same
// reason -- imagery reveals individual buildings even sooner than street
// tiles do, so it must never be allowed to exceed this ceiling.
const MAX_MAP_ZOOM = 15;
const map = L.map('map', { zoomControl: false, maxZoom: MAX_MAP_ZOOM }).setView([36.35, 44.3], 8);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// ---------------------------------------------------------------------
// Map type (Roadmap/Satellite/Hybrid) -- Roadmap is the existing OSM
// tile layer (kept as the default, unchanged). Satellite/Hybrid use Esri
// World Imagery, a free, no-API-key tile service (no Darwesh billing
// account, no Zillow assets) -- Hybrid overlays Esri's free reference
// layer (roads/labels) on top of the same imagery. Choice persists for
// the session only (sessionStorage), never requested/changed without an
// explicit click.
// ---------------------------------------------------------------------
const roadmapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: MAX_MAP_ZOOM
});
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri',
  maxZoom: MAX_MAP_ZOOM
});
const hybridLabelsLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: MAX_MAP_ZOOM,
  pane: 'overlayPane'
});
let currentMapType = sessionStorage.getItem('darwesh_map_type') || 'roadmap';
function applyMapType(type) {
  [roadmapLayer, satelliteLayer, hybridLabelsLayer].forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
  if (type === 'satellite') {
    satelliteLayer.addTo(map);
  } else if (type === 'hybrid') {
    satelliteLayer.addTo(map);
    hybridLabelsLayer.addTo(map);
  } else {
    type = 'roadmap';
    roadmapLayer.addTo(map);
  }
  currentMapType = type;
  sessionStorage.setItem('darwesh_map_type', type);
  document.querySelectorAll('.map-type-btn').forEach(b => b.classList.toggle('active', b.dataset.mapType === type));
}
applyMapType(currentMapType);
document.querySelectorAll('.map-type-btn').forEach(btn => {
  btn.addEventListener('click', () => applyMapType(btn.dataset.mapType));
});

// Below this zoom, markers drop their price text and show only the

// doesn't fill up with overlapping price labels; at/above it, the full
// icon+price pin (today's design) is shown. The active/selected marker

const COMPACT_MARKER_MAX_ZOOM = 10;
function priceIcon(listing, active) {
  const statusClass = listing.verified ? 'pin-verified' : 'pin-unverified';
  const glyph = PROPERTY_TYPE_ICONS[listing.propertyType] || PROPERTY_TYPE_ICON_FALLBACK;
  const compact = !active && map.getZoom() <= COMPACT_MARKER_MAX_ZOOM;
  if (compact) {

      className: '',
      html: `<div class="price-pin price-pin-compact ${statusClass}" data-id="${listing.id}"><span class="material-symbols-outlined price-pin-icon">${glyph}</span></div>`,
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

  return L.divIcon({
    className: '',
    html: `<div class="price-pin ${statusClass}${active ? ' active' : ''}" data-id="${listing.id}"><span class="material-symbols-outlined price-pin-icon">${glyph}</span>${listing.priceLabel}</div>`,
    iconSize: null,
    iconAnchor: [30, 15]
  });
}

// Lightweight, hand-rolled pixel-grid clustering -- no external
// clustering library. Buckets visible (non-hidden) listings by their
// on-screen container point at the CURRENT zoom into 56px cells; a cell
// with 2+ listings collapses into one cluster badge instead of an
// unreadable pile of overlapping pins. The active/selected listing is
// always excluded so it stays individually visible. Re-run on every
// buildMarkers() call (filter change, zoom, pan), so clusters always
// reflect what's actually on screen right now.
const CLUSTER_GRID_PX = 56;
function clusterVisibleListings(visible) {
  const cellOf = (l) => {
    const pt = map.latLngToContainerPoint([l.lat, l.lng]);
    return Math.round(pt.x / CLUSTER_GRID_PX) + ':' + Math.round(pt.y / CLUSTER_GRID_PX);
  };
  const cells = {};
  visible.forEach(l => {
    if (l.id === activeId) return; // never cluster the selected listing
    const key = cellOf(l);
    (cells[key] = cells[key] || []).push(l);
  });
  const clusters = [];
  const solo = [];
  Object.values(cells).forEach(group => {
    if (group.length > 1) clusters.push(group);
    else solo.push(group[0]);
  });
  return { clusters, solo };
}
function clusterIcon(count) {
  return L.divIcon({
    className: '',
    html: `<div class="price-cluster">${count}</div>`,
    iconSize: [40, 40],
    iconAnchor: [20, 20]
  });
}

function cityBadgeIcon(count) {

    iconSize: null,

}

// ---------------------------------------------------------------------
// Neighborhood markers — one blue pin per distinct address among this
// city's VISIBLE listings (never derived from a hidden private listing's
// coordinates), placed at the centroid of that address's listings, with
// the neighborhood name always visible as a label. Real data derived
// from real listing addresses, not a separate fabricated dataset.
// ---------------------------------------------------------------------
function buildNeighborhoodMarkers(visibleListings) {
  const groups = {};
  visibleListings.forEach(l => {
    if (!l.address) return;
    const key = l.address + '|' + l.city;
    if (!groups[key]) groups[key] = { name: l.address, lats: [], lngs: [] };
    groups[key].lats.push(l.lat);
    groups[key].lngs.push(l.lng);
  });
  Object.entries(groups).forEach(([key, g]) => {
    const lat = g.lats.reduce((a, b) => a + b, 0) / g.lats.length;
    const lng = g.lngs.reduce((a, b) => a + b, 0) / g.lngs.length;
    const marker = L.marker([lat, lng], { icon: neighborhoodIcon(), zIndexOffset: -500 });
    marker.bindTooltip(g.name, { permanent: true, direction: 'top', offset: [0, -6], className: 'neighborhood-label' });
    marker.addTo(map);
    markers['nbhd-' + key] = marker;
  });
}

function buildMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  // Private listings that haven't been revealed never get an individual
  // pin — no marker, no circle, nothing tied to their real coordinates.
  // Instead they're rolled up into one badge per city, sitting on that
  // city's public center point, so the map never points at a specific
  // building for a hidden listing, only says "some are somewhere in here."
  const hiddenByCity = {};
  const visible = [];
  const currentList = filteredListings();
  const currentIds = new Set(currentList.map(l => l.id));
  LISTINGS.forEach(l => {
    if (!currentIds.has(l.id)) return; // only markers for listings that pass the active filters
    if (isPrivateHidden(l)) {
      hiddenByCity[l.city] = (hiddenByCity[l.city] || 0) + 1;
      return;
    }
    visible.push(l);
  });
  const { clusters, solo } = clusterVisibleListings(visible);
  solo.forEach(l => {
    const marker = L.marker([l.lat, l.lng], { icon: priceIcon(l, l.id === activeId) });
    marker.on('click', () => selectListing(l.id, { scrollList: true }));
    marker.bindPopup(() => card(l), { maxWidth: 240, minWidth: 240, className: 'map-popup-card', autoPanPadding: [20, 80] });
    marker.addTo(map);
    markers[l.id] = marker;
  });
  if (activeId) {
    const activeListing = visible.find(l => l.id === activeId);
    if (activeListing) {
      const marker = L.marker([activeListing.lat, activeListing.lng], { icon: priceIcon(activeListing, true) });
      marker.on('click', () => selectListing(activeListing.id, { scrollList: true }));
      marker.bindPopup(() => card(activeListing), { maxWidth: 240, minWidth: 240, className: 'map-popup-card', autoPanPadding: [20, 80] });
      marker.addTo(map);
      markers[activeListing.id] = marker;
    }
  }
  clusters.forEach((group, idx) => {
    const avgLat = group.reduce((s, l) => s + l.lat, 0) / group.length;
    const avgLng = group.reduce((s, l) => s + l.lng, 0) / group.length;
    const badge = L.marker([avgLat, avgLng], { icon: clusterIcon(group.length), zIndexOffset: 400 });
    badge.on('click', () => {
      // Zoom/expand intelligently: fit the real bounds of this cluster's
      // listings rather than a fixed zoom step, so a tight cluster opens
      // just enough and a spread-out one opens further.
      const bounds = L.latLngBounds(group.map(l => [l.lat, l.lng]));
      map.fitBounds(bounds, { padding: [60, 60], maxZoom: MAX_MAP_ZOOM });
    });
    badge.addTo(map);
    markers['cluster-' + idx] = badge;
  });
  Object.entries(hiddenByCity).forEach(([city, count]) => {
    const center = CITY_CENTERS[city];
    if (!center) return;
    const badge = L.marker(center, { icon: cityBadgeIcon(count) });
    badge.on('click', () => {
      document.getElementById('citySearch').value = city;
      refresh();
      showToast(trf('map.privateListingsInCity', '{n} private listings in {city} — see the list', { n: count, city }), 'lock');
    });
    badge.addTo(map);
    markers['city-' + city] = badge;
  });
  buildNeighborhoodMarkers(visible);
}

// Standard ray-casting point-in-polygon test (odd number of ray
// crossings = inside). `point` is [lat,lng]; `poly` is an array of
// [lat,lng] vertices -- exactly what the hand-drawn boundary and
// `L.LatLng`s already are, no external geometry library needed.
function pointInPolygon(point, poly) {
  const [y, x] = point;
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const yi = poly[i][0], xi = poly[i][1];
    const yj = poly[j][0], xj = poly[j][1];
    const intersects = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersects) inside = !inside;
  }
  return inside;
}

// Spatial region filter -- exactly one of a hand-drawn polygon boundary
// OR a "search this area" viewport-bounds snapshot can be active at a
// time (drawing a new boundary clears the viewport snapshot and vice
// versa, see setDrawMode()/searchThisAreaBtn's handler), so this is a
// single check rather than two independent ones.
function spatialMatch(l) {
  if (searchPolygonPoints && searchPolygonPoints.length >= 3) {
    return pointInPolygon([l.lat, l.lng], searchPolygonPoints);
  }
  if (viewportSearchBounds) {
    return viewportSearchBounds.contains([l.lat, l.lng]);
  }
  return true;
}

function filteredListings() {
  const q = document.getElementById('citySearch').value.trim().toLowerCase();
  const list = LISTINGS.filter(l => {
    const typeMatch = activeType === 'all' || l.type === activeType;
    const qMatch = !q || l.city.toLowerCase().includes(q) || l.address.toLowerCase().includes(q);
    const priceMatch = (priceMin === null || l.price >= priceMin) && (priceMax === null || l.price <= priceMax);
    const bedsMatch = l.beds >= bedsMin;
    const bathsMatch = l.baths >= bathsMin;
    const homeTypeMatch = selectedHomeTypes.size === 0 || selectedHomeTypes.has(l.propertyType);
    const verifiedMatch = !verifiedOnly || l.verified;
    const areaMatch2 = (areaMin === null || l.sqft >= areaMin) && (areaMax === null || l.sqft <= areaMax);
    return typeMatch && qMatch && spatialMatch(l) && priceMatch && bedsMatch && bathsMatch && homeTypeMatch && verifiedMatch && areaMatch2;
  });
  return sortListings(list);
}

// Deterministic, explainable sorts only -- "Recommended" is verified-
// first then newest (both real, visible signals already on the card),
// never a fabricated relevance/AI score.
function sortListings(list) {
  const sorted = list.slice();
  switch (sortBy) {
    case 'priceAsc': return sorted.sort((a, b) => a.price - b.price);
    case 'priceDesc': return sorted.sort((a, b) => b.price - a.price);
    case 'areaDesc': return sorted.sort((a, b) => b.sqft - a.sqft);
    case 'newest': return sorted.sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
    case 'recommended':
    default:
      return sorted.sort((a, b) => (b.verified - a.verified) || ((b.createdAtMs || 0) - (a.createdAtMs || 0)));
  }
}

  }
  const list = filteredListings();

  if (!list.length) {
    // Honest empty state, never an empty wheel -- matches the pre-

    document.getElementById('resultCount').textContent = '';
    document.getElementById('resultCountMobile').textContent = '';

  }
  // Preserve the current active property across a filter/data refresh if
  // it's still in the result set; otherwise focus the first valid
  // result -- never a stale id pointing at a card that no longer exists.
  if (!activeId || !list.some(l => l.id === activeId)) {

        // reuses the existing real listing detail page (js/mam-v2.js and

        // here), never a second property-detail system. A NON-active

// selectListing is the ONE place activeId ever changes -- the shared
// state every entry point (card click, map marker click, keyboard,
// wheel-scroll settling into a new center, MAM's focusListingId) goes
// through, so the map/list/MAM surfaces can never disagree about which
// property is "current." `opts.scrollList` is false only when the list
// itself is what just triggered this call (a wheel-scroll settle) --
// scrolling it again would fight the gesture that got here.
function selectListing(id, opts) {
  opts = opts || {};
  activeId = id;
  const l = LISTINGS.find(x => x.id === id);
  document.querySelectorAll('.listing-card').forEach(el => {
    const isActive = el.dataset.id === id;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-selected', String(isActive));
  });
  const cardListEl = document.getElementById('cardList');
  if (cardListEl) cardListEl.setAttribute('aria-activedescendant', 'wheel-card-' + id);
  // A full marker rebuild (not just an icon-patch) is required here
  // because the active listing is always excluded from clustering (see
  // clusterVisibleListings()) -- a listing that was previously inside a
  // cluster badge has no individual marker to patch an icon onto until
  // it's promoted out of that cluster, which only buildMarkers() does.
  buildMarkers();
  if (l) {
    // Never move the camera toward a hidden private listing's real
    // coordinates — the map simply doesn't react to it until revealed.
    if (opts.panMap !== false && !isPrivateHidden(l)) {
      map.panTo([l.lat, l.lng]);
    }
    if (opts.scrollList !== false) {
      const cardEl = document.querySelector(`.listing-card[data-id="${id}"]`);
      if (cardEl) {
        cardEl.scrollIntoView({
          behavior: prefersReducedMotion() ? 'auto' : 'smooth',
          block: 'center',
        });
      }
    }
  }
}

// on #cardList/.listing-card above) does the real snapping for wheel,
// trackpad, and touch alike -- this only adds two things on top:
//  1. A continuous depth transform (scale/opacity by distance from the
//     container's vertical center) on the small set of cards currently
//     intersecting the viewport, via a requestAnimationFrame loop that
//     runs only while actively scrolling. IntersectionObserver is what
//     keeps that set small regardless of how many total results there
//     are -- the RAF loop never iterates the full list.
//  2. Settle detection (native `scrollend` where supported, a short
//     debounce elsewhere) that commits whichever card is now closest to
//     center as the real selection via selectListing(), so map/marker
//     state follows the wheel the same way it follows a click.

  const cardListEl = document.getElementById('cardList');
  if (cardListEl) {
    if (wheelScrollHandler) cardListEl.removeEventListener('scroll', wheelScrollHandler);
    if (wheelScrollendHandler) cardListEl.removeEventListener('scrollend', wheelScrollendHandler);
    if (wheelKeydownHandler) cardListEl.removeEventListener('keydown', wheelKeydownHandler);
  }
  wheelVisibleCards = new Set();
}

function styleWheelCard(el, container) {
  const cRect = container.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();
  const centerDist = Math.abs((eRect.top + eRect.height / 2) - (cRect.top + cRect.height / 2));
  const maxDist = cRect.height / 2 + eRect.height / 2;
  const t = Math.min(1, centerDist / Math.max(1, maxDist));
  el.style.transform = `scale(${(1 - t * 0.14).toFixed(3)})`;
  el.style.opacity = (1 - t * 0.55).toFixed(3);
}

function commitWheelSettle(container) {
  if (!wheelVisibleCards.size) return;
  const cRect = container.getBoundingClientRect();
  const centerY = cRect.top + cRect.height / 2;
  let closest = null;
  let closestDist = Infinity;
  wheelVisibleCards.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.height / 2) - centerY);
    if (d < closestDist) { closestDist = d; closest = el; }
  });
  if (!closest) return;
  if (closest.dataset.id !== activeId) {
    selectListing(closest.dataset.id, { scrollList: false });
  } else {
    styleWheelCard(closest, container);
  }
}

function wireWheel(container, list) {
  teardownWheel();

  // Spacer height = half the container's own height minus half a real
  // card's rendered height, so the FIRST and LAST cards can still reach
  // dead-center when snapped -- measured live off the actual rendered
  // card rather than a hardcoded constant, so this never drifts out of
  // sync with the CSS breakpoint heights above.
  const firstCard = container.querySelector('.listing-card');
  const spacerTop = document.getElementById('wheelSpacerTop');
  const spacerBottom = document.getElementById('wheelSpacerBottom');
  if (firstCard && spacerTop && spacerBottom) {
    const cardOuterHeight = firstCard.getBoundingClientRect().height +
      parseFloat(getComputedStyle(firstCard).marginBlockStart) +
      parseFloat(getComputedStyle(firstCard).marginBlockEnd);
    const spacerHeight = Math.max(0, (container.clientHeight - cardOuterHeight) / 2);
    spacerTop.style.height = spacerBottom.style.height = spacerHeight + 'px';
  }

  container.setAttribute('role', 'listbox');
  container.setAttribute('aria-label', tr('map.pageTitle', 'Kurdistan Region Listings'));
  container.setAttribute('tabindex', '0');
  document.querySelectorAll('.listing-card').forEach(el => { el.id = 'wheel-card-' + el.dataset.id; });

  wheelObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) wheelVisibleCards.add(entry.target);
      else wheelVisibleCards.delete(entry.target);
    });
  }, { root: container, threshold: 0 });
  container.querySelectorAll('.listing-card').forEach(el => wheelObserver.observe(el));

  // Instant initial positioning (no smooth-scroll animation on a fresh
  // render/filter change -- that's a re-render, not a user gesture) plus
  // one synchronous style pass so cards look correct before any scroll
  // event has ever fired.
  const activeCardEl = document.querySelector(`.listing-card[data-id="${activeId}"]`);
  if (activeCardEl) activeCardEl.scrollIntoView({ behavior: 'auto', block: 'center' });
  wheelVisibleCards.forEach(el => styleWheelCard(el, container));
  if (!wheelVisibleCards.size) container.querySelectorAll('.listing-card').forEach(el => styleWheelCard(el, container));

  const reduced = prefersReducedMotion();

  wheelScrollHandler = () => {
    wheelLastScrollAt = performance.now();
    if (!reduced && wheelRafId == null) {
      wheelRafId = requestAnimationFrame(function tick() {
        wheelVisibleCards.forEach(el => styleWheelCard(el, container));
        if (performance.now() - wheelLastScrollAt < 120) {
          wheelRafId = requestAnimationFrame(tick);
        } else {
          wheelRafId = null;
        }
      });
    }
    if (!WHEEL_HAS_SCROLLEND) {
      clearTimeout(wheelSettleTimer);
      wheelSettleTimer = setTimeout(() => commitWheelSettle(container), 140);
    }
  };
  container.addEventListener('scroll', wheelScrollHandler, { passive: true });

  if (WHEEL_HAS_SCROLLEND) {
    wheelScrollendHandler = () => commitWheelSettle(container);
    container.addEventListener('scrollend', wheelScrollendHandler);
  }

  // Keyboard: usable with zero gestures. Up/Down move one property at a
  // time, Page Up/Down jump by ~3 (a "page" of the wheel) -- both move
  // through the SAME filteredListings() order the wheel itself renders,
  // never trapping focus (Tab still leaves the widget normally).
  wheelKeydownHandler = (e) => {
    const key = e.key;
    if (!['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown'].includes(key)) return;
    e.preventDefault();
    const ids = list.map(l => l.id);
    const idx = ids.indexOf(activeId);
    const step = (key === 'PageUp' || key === 'PageDown') ? 3 : 1;
    const dir = (key === 'ArrowDown' || key === 'PageDown') ? 1 : -1;
    const nextIdx = Math.max(0, Math.min(ids.length - 1, (idx === -1 ? 0 : idx) + dir * step));
    selectListing(ids[nextIdx], { scrollList: true });
  };
  container.addEventListener('keydown', wheelKeydownHandler);
}

// ---------------------------------------------------------------------
// Draw Area -- a real freehand polygon boundary, not a fixed circle.
// Works identically for mouse and touch: Leaflet's own 'click' event
// already fires from a plain tap on touch devices (no separate
// touchstart/touchmove/touchend wiring needed, unlike the old drag-based
// circle tool this replaces), so one handler covers both input types.
// Each click/tap adds one vertex; Finish closes the boundary (requires
// >=3 points); Undo removes the last point while still drawing; the
// existing "Clear Search Area" chip removes a finished boundary.
// ---------------------------------------------------------------------
function redrawPreview() {
  if (drawPreviewLayer) { map.removeLayer(drawPreviewLayer); drawPreviewLayer = null; }
  drawVertexMarkers.forEach(m => map.removeLayer(m));
  drawVertexMarkers = [];
  if (drawPreviewPoints.length >= 2) {
    drawPreviewLayer = L.polygon(drawPreviewPoints, {
      color: '#8E7448', weight: 2, dashArray: '6 4', fillColor: '#B89A63', fillOpacity: 0.15
    }).addTo(map);
  }
  drawPreviewPoints.forEach(pt => {
    const m = L.marker(pt, { icon: L.divIcon({ className: '', html: '<div class="draw-vertex-dot"></div>', iconSize: [9, 9], iconAnchor: [4, 4] }), interactive: false });
    m.addTo(map);
    drawVertexMarkers.push(m);
  });
  drawFinishBtn.disabled = drawPreviewPoints.length < 3;
}

function setDrawMode(on) {
  drawMode = on;
  mapEl.classList.toggle('draw-mode', drawMode);
  drawSearchBtn.classList.toggle('active', drawMode);
  drawActionsEl.classList.toggle('show', drawMode);
  if (drawMode) {
    // Starting a new boundary replaces any previous one -- only one
    // spatial filter (drawn polygon OR viewport snapshot) is ever
    // active at a time.
    if (searchPolygonLayer) { map.removeLayer(searchPolygonLayer); searchPolygonLayer = null; }
    searchPolygonPoints = null;
    viewportSearchBounds = null;
    document.getElementById('searchThisAreaBtn').classList.remove('show');
    clearSearchAreaBtn.style.display = 'none';
    drawPreviewPoints = [];
    redrawPreview();
    showToast(tr('map.tapToAddPoint', 'Tap the map to add points, then Finish'), 'edit');
  } else {
    drawPreviewPoints = [];
    redrawPreview();
  }
}
drawSearchBtn.addEventListener('click', () => setDrawMode(!drawMode));

map.on('click', (e) => {
  if (!drawMode) return;
  drawPreviewPoints.push([e.latlng.lat, e.latlng.lng]);
  redrawPreview();
});

drawUndoBtn.addEventListener('click', () => {
  drawPreviewPoints.pop();

drawFinishBtn.addEventListener('click', () => {
  if (drawPreviewPoints.length < 3) return;

// ---------------------------------------------------------------------
// Administrative area boundaries — real OpenStreetMap district/city
// boundary lines (admin_level=8), drawn once in dark red with the area
// name always visible. Live data from Overpass, same public API already
// used for nearby-amenities lookups elsewhere on this site. A city with
// no boundary data in OSM is simply skipped — no fabricated outline is
// drawn in its place.
// ---------------------------------------------------------------------
const KNOWN_CITY_NAMES = Object.keys(CITY_CENTERS);

function isKnownCityBoundary(tags) {
  const name = (tags && (tags.name || tags['name:en'])) || '';
  return KNOWN_CITY_NAMES.some(c => name.toLowerCase() === c.toLowerCase());
}

function ringFromGeometry(geometry) {
  return (geometry || []).map(pt => [pt.lat, pt.lon]);
}

function drawBoundaryShape(coords, label, labelLatLng) {
  if (coords.length < 2) return;
  const isClosedRing = coords.length > 2 &&
    Math.abs(coords[0][0] - coords[coords.length - 1][0]) < 1e-6 &&
    Math.abs(coords[0][1] - coords[coords.length - 1][1]) < 1e-6;
  const shape = isClosedRing
    ? L.polygon(coords, { color: '#8b0000', weight: 2.5, opacity: 0.85, fillColor: '#8b0000', fillOpacity: 0.05 })
    : L.polyline(coords, { color: '#8b0000', weight: 2.5, opacity: 0.85, dashArray: '6 4' });
  shape.addTo(map);
  adminBoundaryLayers.push(shape);
  if (label && labelLatLng) {
    const labelMarker = L.marker(labelLatLng, {
      icon: L.divIcon({ className: '', html: `<div class="admin-boundary-label">${label}</div>`, iconSize: null, iconAnchor: [0, 0] }),
      interactive: false
    });
    labelMarker.addTo(map);
    adminBoundaryLayers.push(labelMarker);
  }
}

let adminBoundaryLayers = [];

async function loadAdminBoundaries() {
  // One bounding box wide enough to cover every known city, so this is
  // a single Overpass call rather than one per city.
  const bbox = '34.9,42.0,37.5,46.2';
  const query = `[out:json][timeout:25];(way["boundary"="administrative"]["admin_level"="8"](${bbox});relation["boundary"="administrative"]["admin_level"="8"](${bbox}););out geom;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    if (!res.ok) return;
    const data = await res.json();
    (data.elements || []).forEach(el => {
      if (!isKnownCityBoundary(el.tags)) return;
      const label = el.tags.name || el.tags['name:en'];
      if (el.type === 'way' && el.geometry) {
        const coords = ringFromGeometry(el.geometry);
        const mid = coords[Math.floor(coords.length / 2)];
        drawBoundaryShape(coords, label, mid);
      } else if (el.type === 'relation' && el.members) {
        let labelPlaced = false;
        el.members.forEach(m => {
          if (m.type !== 'way' || m.role !== 'outer' || !m.geometry) return;
          const coords = ringFromGeometry(m.geometry);
          const mid = coords[Math.floor(coords.length / 2)];
          drawBoundaryShape(coords, labelPlaced ? null : label, labelPlaced ? null : mid);
          labelPlaced = true;
        });
      }
    });
  } catch (e) {
    // Overpass unreachable or slow — the map still works fine without
    // boundary overlays, so fail silently rather than surface an error
    // for a purely decorative layer.
  }
}
loadAdminBoundaries();

// ---------------------------------------------------------------------
// URL state -- the search itself (deal type, city, price, beds/baths,
// property types, verified/area, sort, and the centered listing) is
// reflected in the URL so a refresh, a shared link, or a browser
// back/forward step restores the same search. Never includes a
// listing's exact lat/lng or any private/hidden-listing information --
// only the same filter values already visible in the filter bar's own
// controls, plus a listing id (a public identifier, not a coordinate).
// ---------------------------------------------------------------------
function buildStateParams() {
  const p = new URLSearchParams();
  if (activeType !== 'sale') p.set('type', activeType);
  const cityVal = document.getElementById('citySearch').value.trim();
  if (cityVal) p.set('city', cityVal);
  if (priceMin !== null) p.set('priceMin', String(priceMin));
  if (priceMax !== null) p.set('priceMax', String(priceMax));
  if (bedsMin > 0) p.set('beds', String(bedsMin));
  if (bathsMin > 0) p.set('baths', String(bathsMin));
  if (selectedHomeTypes.size) p.set('types', [...selectedHomeTypes].join(','));
  if (verifiedOnly) p.set('verified', '1');
  if (areaMin !== null) p.set('areaMin', String(areaMin));
  if (areaMax !== null) p.set('areaMax', String(areaMax));
  if (sortBy !== 'recommended') p.set('sort', sortBy);
  if (activeId) p.set('listing', activeId);
  return p;
}
function updateUrlState(push) {
  const params = buildStateParams();
  const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  const currentUrl = window.location.pathname + window.location.search;
  if (newUrl === currentUrl) return;
  if (push) history.pushState(null, '', newUrl);
  else history.replaceState(null, '', newUrl);
}
function readUrlStateIntoFilters() {
  const p = new URLSearchParams(window.location.search);
  const urlCity = p.get('city');
  const urlType = p.get('type');
  if (urlCity) document.getElementById('citySearch').value = urlCity;
  if (urlType === 'all' || (urlCity && !urlType)) setActiveTypeFromUrl('all');
  else if (urlType === 'rent') setActiveTypeFromUrl('rent');
  else if (urlType === 'sale' || !urlType) setActiveTypeFromUrl(urlType || 'sale');

  const pMin = p.get('priceMin'), pMax = p.get('priceMax');
  priceMin = pMin !== null ? Number(pMin) : null;
  priceMax = pMax !== null ? Number(pMax) : null;
  document.getElementById('priceMinInput').value = priceMin ?? '';
  document.getElementById('priceMaxInput').value = priceMax ?? '';
  document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);

  bedsMin = Number(p.get('beds')) || 0;
  bathsMin = Number(p.get('baths')) || 0;
  document.getElementById('bedsMinSelect').value = String(bedsMin);
  document.getElementById('bathsMinSelect').value = String(bathsMin);
  document.getElementById('bedsFilterBtn').classList.toggle('active', bedsMin > 0 || bathsMin > 0);

  const typesParam = p.get('types');
  selectedHomeTypes = new Set(typesParam ? typesParam.split(',').filter(Boolean) : []);
  document.querySelectorAll('.home-type-check').forEach(cb => { cb.checked = selectedHomeTypes.has(cb.value); });
  document.getElementById('homeTypeFilterBtn').classList.toggle('active', selectedHomeTypes.size > 0);

  verifiedOnly = p.get('verified') === '1';
  const aMin = p.get('areaMin'), aMax = p.get('areaMax');
  areaMin = aMin !== null ? Number(aMin) : null;
  areaMax = aMax !== null ? Number(aMax) : null;
  document.getElementById('verifiedOnlyCheck').checked = verifiedOnly;
  document.getElementById('areaMinInput').value = areaMin ?? '';
  document.getElementById('areaMaxInput').value = areaMax ?? '';
  document.getElementById('moreFiltersBtn').classList.toggle('active', verifiedOnly || areaMin !== null || areaMax !== null);

  sortBy = p.get('sort') || 'recommended';
  document.getElementById('sortBtn').classList.toggle('active', sortBy !== 'recommended');

  const urlListing = p.get('listing');
  if (urlListing) activeId = urlListing;
}
readUrlStateIntoFilters();
// Browser back/forward -- re-read whatever URL the browser just navigated
// to and re-render to match it. Never scrolls/pans on this path (opts
// left default) so a rapid sequence of back/forward doesn't fight the
// user with camera motion; the map/list state itself is what changes.
window.addEventListener('popstate', () => {
  readUrlStateIntoFilters();
  refresh();
});

// ---------------------------------------------------------------------
// MAM AI hook (js/mam-properties-map.js). The ONE way the AI module is
// allowed to touch this page's real search state -- it never re-
// implements filtering itself, it only ever calls this with the exact
// filter keys backend/app/mam/orchestrator.py's _search_filters_action
// and Tools.open_on_map both already use (deal/q/types/minPrice/maxPrice/beds) to
// translate a resolved tool call's OWN real arguments -- so the filters
// applied here always match the cards MAM's reply already showed.
// ---------------------------------------------------------------------
function applyAiFilters(filters) {
  if (!filters || typeof filters !== 'object') return;
  if (filters.deal === 'rent') setActiveTypeFromUrl('rent');
  if (typeof filters.q === 'string' && filters.q) {
    document.getElementById('citySearch').value = filters.q;
  }
  if (Array.isArray(filters.types) && filters.types.length) {
    selectedHomeTypes = new Set(filters.types.filter((t) => typeof t === 'string' && t));
    document.querySelectorAll('.home-type-check').forEach((cb) => { cb.checked = selectedHomeTypes.has(cb.value); });
    document.getElementById('homeTypeFilterBtn').classList.toggle('active', selectedHomeTypes.size > 0);
  }
  if (filters.minPrice !== undefined) {
    priceMin = Number(filters.minPrice) || null;
    document.getElementById('priceMinInput').value = priceMin || '';
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  }
  if (filters.maxPrice !== undefined) {
    priceMax = Number(filters.maxPrice) || null;
    document.getElementById('priceMaxInput').value = priceMax || '';
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  }
  if (filters.beds !== undefined) {
    bedsMin = Number(filters.beds) || 0;
    document.getElementById('bedsMinSelect').value = String(bedsMin);
    document.getElementById('bedsFilterBtn').classList.toggle('active', bedsMin > 0 || bathsMin > 0);
  }
  updateUrlState(true);
  refresh();
  document.dispatchEvent(new CustomEvent('darwesh:mam-ai-filters-applied'));
}
window.DarweshPropertiesMap = {
  applyFilters: applyAiFilters,
  // MAM identifying/selecting a specific property (mapAction.
  // focusListingId) centers it in the SAME wheel/map -- never a second,
  // MAM-only card competing with these real ones. A no-op if the id
  // isn't in the current filtered set (e.g. MAM's own filters haven't
  // been applied yet); applyAiFilters already re-renders the wheel
  // before this would ever be called for a fresh search result.
  focusListing: (id) => {
    if (!id || !listingsLoaded) return;
    if (!filteredListings().some(l => l.id === id)) return;
    selectListing(id, { scrollList: true });
  },
  getState: () => ({ activeType, city: document.getElementById('citySearch').value, priceMin, priceMax, bedsMin, bathsMin, types: [...selectedHomeTypes] }),
  getVisibleCount: () => (listingsLoaded ? filteredListings().length : null),
  isReady: () => listingsLoaded,
};

refresh();
document.addEventListener('darwesh:langchange', refresh);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 100);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 600);
</script>
