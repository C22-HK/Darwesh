// ---------------------------------------------------------------------
// MAP TOOLS EDGE DRAWER
//
// Closed, the tools cost one handle on the map's trailing edge. Open, the
// drawer sits over the map -- a sibling overlay, so opening it never
// touches the Leaflet instance and the map is never re-created or
// re-measured.
//
// Two ways in, because pointing devices and thumbs want different things:
// a click/tap on the handle toggles, and a drag off the handle pulls the
// panel with the finger. During a drag the panel is positioned directly
// from the pointer (transition suppressed) so it tracks 1:1; on release
// it springs to whichever end it is nearest, or in the direction of a
// fast flick.
//
// The gesture is bound to the HANDLE and the DRAWER only -- never to the
// map -- so panning the map is completely unaffected. `touch-action:none`
// on those two elements is what stops the browser claiming the drag for
// a scroll before the handler sees it.
// ---------------------------------------------------------------------
const mapDrawer = document.getElementById('mapDrawer');
const mapEdgeHandle = document.getElementById('mapEdgeHandle');
const mapDrawerScrim = document.getElementById('mapDrawerScrim');
const mapDrawerCloseBtn = document.getElementById('mapDrawerCloseBtn');

// Opening past this fraction of the panel's own width commits the
// gesture; below it the panel snaps back. A velocity flick overrides it,
// so a quick flick opens even if it never travelled far.
const DRAWER_COMMIT_FRACTION = 0.4;
const DRAWER_FLICK_VELOCITY = 0.45;   // px per ms

let drawerOpen = false;

function setDrawerOpen(open, opts) {
  drawerOpen = open;
  mapDrawer.classList.toggle('is-open', open);
  mapDrawer.style.removeProperty('--drawer-x');   // hand control back to CSS
  mapEdgeHandle.setAttribute('aria-expanded', open ? 'true' : 'false');
  // The scrim only exists to catch an outside click, and only on a
  // pointer device wide enough for "outside" to be meaningful map.
  mapDrawerScrim.classList.toggle('is-open', open);
  // Lets page CSS move the MAM companion out of the drawer's way without
  // this handler needing to know the orb exists.
  document.body.dataset.mapDrawer = open ? 'open' : 'closed';
  if (open) mapEdgeHandle.dataset.attention = '0';
  if (open && !(opts && opts.silent)) {
    // Move focus in so keyboard users land on a tool, not back at the top
    // of the page. Not a focus trap: the drawer is non-modal by design
    // (the map behind it stays usable), so Tab may leave it freely.
    const first = mapDrawer.querySelector('.tool-row:not(:disabled), .map-type-btn');
    if (first) first.focus({ preventScroll: true });
  }
}

mapEdgeHandle.setAttribute('aria-expanded', 'false');

// ---- Pointer drag ----------------------------------------------------
// One handler set covers mouse, touch and pen. RTL flips the sign once,
// here, rather than at every arithmetic site.
let dragActive = false;
let dragStartX = 0;
let dragStartTime = 0;
let dragStartOpen = false;
let dragMoved = false;
let dragWidth = 0;

function dirSign() {
  // In RTL the drawer lives on the left, so an opening drag travels the
  // other way. getComputedStyle rather than a lang check: what matters is
  // the direction actually in effect on this element.
  return getComputedStyle(document.documentElement).direction === 'rtl' ? -1 : 1;
}

function onDragStart(e) {
  if (e.button !== undefined && e.button !== 0) return;
  dragActive = true;
  dragMoved = false;
  dragStartX = e.clientX;
  dragStartTime = e.timeStamp;
  dragStartOpen = drawerOpen;
  dragWidth = mapDrawer.getBoundingClientRect().width || 1;
  mapDrawer.classList.add('is-dragging');
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* not captureable */ }
}

function onDragMove(e) {
  if (!dragActive) return;
  const dx = (e.clientX - dragStartX) * dirSign();
  if (Math.abs(dx) > 4) dragMoved = true;
  // Travel is measured from wherever the drawer started, and clamped to
  // the panel's own width so it can never be dragged past either end.
  const base = dragStartOpen ? 0 : dragWidth;
  const next = Math.min(dragWidth, Math.max(0, base + dx));
  mapDrawer.style.setProperty('--drawer-x', (next / dragWidth * 100) + '%');
  mapDrawerScrim.classList.toggle('is-open', next < dragWidth * 0.9);
}

function onDragEnd(e) {
  if (!dragActive) return;
  dragActive = false;
  mapDrawer.classList.remove('is-dragging');
  try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) { /* fine */ }

  // A press that never moved is a tap: toggle, exactly as a click would.
  if (!dragMoved) { setDrawerOpen(!drawerOpen); return; }

  const dx = (e.clientX - dragStartX) * dirSign();
  const dt = Math.max(1, e.timeStamp - dragStartTime);
  const velocity = dx / dt;                       // negative = toward open
  const travelled = Math.abs(dx) / dragWidth;

  if (Math.abs(velocity) > DRAWER_FLICK_VELOCITY) {
    setDrawerOpen(velocity < 0);                  // flick decides outright
  } else if (dragStartOpen) {
    setDrawerOpen(travelled < DRAWER_COMMIT_FRACTION || dx < 0);
  } else {
    setDrawerOpen(dx < 0 && travelled >= DRAWER_COMMIT_FRACTION);
  }
}

[mapEdgeHandle, mapDrawer].forEach(el => {
  el.addEventListener('pointerdown', (e) => {
    // Inside the drawer, only a drag that starts on non-interactive
    // chrome should move the panel -- otherwise pressing a tool would
    // begin a drag instead of activating it.
    if (el === mapDrawer && e.target.closest('button, input, select, a, .map-type-switch')) return;
    onDragStart(e);
  });
  el.addEventListener('pointermove', onDragMove);
  el.addEventListener('pointerup', onDragEnd);
  el.addEventListener('pointercancel', () => {
    if (!dragActive) return;
    dragActive = false;
    mapDrawer.classList.remove('is-dragging');
    setDrawerOpen(dragStartOpen);                 // abandoned: put it back
  });
});
// Keyboard/assistive activation. A real click that followed a drag is
// suppressed by the dragMoved check in onDragEnd, which already toggled.
mapEdgeHandle.addEventListener('click', (e) => { e.preventDefault(); });
mapEdgeHandle.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setDrawerOpen(!drawerOpen); }
});

mapDrawerCloseBtn.addEventListener('click', () => { setDrawerOpen(false); mapEdgeHandle.focus(); });

// Click-outside-to-close, driven from the document rather than from the
// scrim.
//
// The scrim used to swallow the click, which is why a marker could not be
// selected while the drawer was open: the only thing a click on the map
// did was dismiss the panel. Listening here instead means the click keeps
// travelling -- Leaflet still gets it and selects the listing -- and the
// drawer closes on the way. One click, both outcomes.
//
// `pointerdown` rather than `click`, so the drawer starts sliding away as
// the press lands instead of a frame after it is released. Anything
// inside the drawer or on the handle is excluded: the handle runs its own
// toggle, and a press on drawer chrome may be the start of a drag.
//
// The scrim still handles this on mobile, where it stays click-blocking
// (see css/cinematic.css) -- hence the closest() check covering it too,
// so the two paths cannot both fire and fight.
document.addEventListener('pointerdown', (e) => {
  if (!drawerOpen) return;
  // No draw-mode exemption is needed here any more. The circle tool
  // closes the drawer the moment it is armed (setDrawMode below) because
  // a one-gesture circle has no mid-draw controls to keep on screen, so
  // a press on the map while armed both starts the circle and closes
  // whatever was open -- which is what should happen. The old polygon
  // tool needed the opposite (it kept Undo/Finish reachable across many
  // vertex clicks) and that exemption has gone with it.
  // A pointer event's target is normally an Element (SVG included, since
  // SVGElement extends Element and so has closest()), but guard anyway --
  // a target that isn't one cannot be inside the drawer, so it counts as
  // outside rather than skipping the close.
  const t = e.target;
  if (t && typeof t.closest === 'function' && t.closest('#mapDrawer, #mapEdgeHandle')) return;
  setDrawerOpen(false);
});
mapDrawerScrim.addEventListener('click', () => { if (drawerOpen) setDrawerOpen(false); });

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  // Escape backs out of the innermost thing first: an armed/in-flight
  // circle, otherwise the drawer.
  if (drawMode) { setDrawMode(false); return; }
  if (drawerOpen) { setDrawerOpen(false); mapEdgeHandle.focus(); }
});

const drawSearchBtn = document.getElementById('drawSearchBtn');
const redrawSearchAreaBtn = document.getElementById('redrawSearchAreaBtn');
const clearSearchAreaBtn = document.getElementById('clearSearchAreaBtn');
const mapEl = document.getElementById('map');
const drawRadiusBadge = document.getElementById('drawRadiusBadge');

// ---------------------------------------------------------------------
// Draw Area -- a CIRCLE, chosen with one press-drag-release gesture.
//
// Press sets the centre, dragging outward sets the radius, releasing
// commits it. There is no vertex-by-vertex boundary, no Undo step and no
// Finish button: the release IS the commit, so the only things a
// finished area offers are Redraw and Clear.
//
// One code path serves mouse, touch and pen, because it is written
// against Pointer Events rather than either mouse or touch events. Three
// things have to be true for the gesture to survive on a touch screen,
// and all three are done explicitly rather than left to chance:
//
//   1. `touch-action: none` on the armed map (see #map.draw-mode in this
//      file's CSS) -- otherwise the browser claims the drag as a scroll
//      before a single pointermove is delivered.
//   2. Leaflet's own dragging/doubleClickZoom handlers are disabled
//      while armed, so the map cannot pan out from under the circle
//      being sized, and re-enabled the instant the mode ends.
//   3. setPointerCapture on the map container, so a drag that leaves the
//      map (over the listing panel, off the window edge) still delivers
//      its moves and its release here instead of being lost.
// ---------------------------------------------------------------------
const MIN_RADIUS_M = 50;      // below this a "drag" is really a stray tap
let drawGesture = null;       // {pointerId, centre} while a circle is being sized
// The area a redraw is about to replace. Arming does NOT throw the
// existing circle away -- it stays on the map, still filtering, until a
// new gesture actually starts; and if that gesture is abandoned or comes
// out too small, it is put back. Discarding on arm would mean pressing
// "Redraw area" and then changing your mind cost you the area you had.
let replacedCircle = null;

function fmtRadius(metres) {
  if (metres >= 1000) return trf('map.radiusKm', '{n} km', { n: (metres / 1000).toFixed(1) });
  return trf('map.radiusM', '{n} m', { n: Math.round(metres) });
}

// The ONE place a circle layer is created, so there can never be two on
// the map: whatever was there is removed first, every time.
function drawCircleLayer(centre, radius, { preview }) {
  if (searchCircleLayer) { map.removeLayer(searchCircleLayer); searchCircleLayer = null; }
  searchCircleLayer = L.circle(centre, {
    radius,
    // Non-interactive on purpose: the circle is an overlay describing the
    // filter, not a control. If it swallowed clicks it would sit between
    // the visitor and the price markers inside it -- the same mistake the
    // approximate-location halo avoids for the same reason.
    interactive: false,
    color: '#B89A63',
    weight: preview ? 1.5 : 2,
    opacity: preview ? 0.85 : 0.95,
    dashArray: preview ? '5 4' : null,
    fillColor: '#B89A63',
    fillOpacity: preview ? 0.08 : 0.12
  }).addTo(map);
  return searchCircleLayer;
}

function removeCircleLayers() {
  if (searchCircleLayer) { map.removeLayer(searchCircleLayer); searchCircleLayer = null; }
  if (drawCentreMarker) { map.removeLayer(drawCentreMarker); drawCentreMarker = null; }
}

// Puts back the circle a since-abandoned redraw was going to replace, so
// an abandoned gesture leaves the map exactly as it found it. Filtering
// is unaffected either way -- searchCircle only ever changes on commit.
function restoreReplacedCircle() {
  removeCircleLayers();
  if (!replacedCircle) return;
  searchCircle = replacedCircle;
  drawCircleLayer(searchCircle.centre, searchCircle.radius, { preview: false });
  replacedCircle = null;
}

// Area-search group: "Draw Area" while there is nothing to act on,
// "Redraw area" + "Clear area" once a circle exists. Never both states at
// once, and never a control for an action that does not apply.
//
// Clear is the one control shared with the other spatial filter: a
// "Search this area" viewport snapshot is also an active area constraint
// the visitor needs a way out of, even though it has no circle to redraw.
// This is the single place any of the three visibilities is decided, so
// the two filters cannot leave a stale button behind.
function updateAreaControls() {
  const hasCircle = !!searchCircle;
  drawSearchBtn.style.display = hasCircle ? 'none' : 'flex';
  redrawSearchAreaBtn.style.display = hasCircle ? 'flex' : 'none';
  clearSearchAreaBtn.style.display = (hasCircle || viewportSearchBounds) ? 'flex' : 'none';
}

function showRadiusBadge(metres) {
  drawRadiusBadge.textContent = fmtRadius(metres);
  drawRadiusBadge.classList.add('show');
}
function hideRadiusBadge() {
  drawRadiusBadge.classList.remove('show');
  drawRadiusBadge.textContent = '';
}

function setDrawMode(on) {
  drawMode = on;
  mapEl.classList.toggle('draw-mode', drawMode);
  drawSearchBtn.classList.toggle('active', drawMode);
  // The button is a toggle, so its pressed state has to be announced, not
  // just painted. Every entry and exit from draw mode funnels through this
  // one function, so the announced state and the visual state cannot drift.
  drawSearchBtn.setAttribute('aria-pressed', drawMode ? 'true' : 'false');
  redrawSearchAreaBtn.setAttribute('aria-pressed', drawMode ? 'true' : 'false');
  mapEdgeHandle.dataset.drawing = drawMode ? '1' : '0';
  // The circle gesture needs every pixel of the map, and the MAM dock
  // floats over it. This hides the dock for the duration -- it is not
  // unmounted, so the conversation, its position and any voice state are
  // all still there when the circle is finished. js/mam-dock.js listens
  // for this; nothing here reaches into that module.
  document.dispatchEvent(new CustomEvent('darwesh:mam-suppress', { detail: { suppressed: drawMode } }));

  if (drawMode) {
    // The gesture needs the whole map, and there is nothing to keep on
    // screen while it happens -- so the drawer gets out of the way rather
    // than narrowing. (The polygon tool did the opposite because Undo and
    // Finish had to stay reachable between vertex clicks.)
    setDrawerOpen(false, { silent: true });
    // Leaflet must not pan while the pointer is dragging out a radius.
    map.dragging.disable();
    map.doubleClickZoom.disable();
    // Only one spatial filter (drawn circle OR viewport snapshot) is ever
    // active, so arming drops the viewport snapshot straight away. The
    // existing circle, by contrast, survives until a replacement is
    // actually drawn -- see replacedCircle.
    if (viewportSearchBounds) { viewportSearchBounds = null; refresh(); }
    document.getElementById('searchThisAreaBtn').classList.remove('show');
    document.getElementById('searchThisAreaBtn').disabled = true;
    mapEdgeHandle.dataset.attention = '0';
    updateAreaControls();
    showToast(tr('map.dragToSetRadius', 'Press the map and drag out to set your search radius'), 'edit');
  } else {
    // Normal map interaction resumes immediately -- pan, pinch and
    // double-click zoom all behave exactly as they did before arming.
    map.dragging.enable();
    map.doubleClickZoom.enable();
    hideRadiusBadge();
    if (drawGesture) {
      // Abandoned mid-gesture (Escape, or the toggle pressed again).
      try { mapEl.releasePointerCapture(drawGesture.pointerId); } catch { /* already released */ }
      drawGesture = null;
      restoreReplacedCircle();
    }
    replacedCircle = null;
    updateAreaControls();
  }
}

drawSearchBtn.addEventListener('click', () => setDrawMode(!drawMode));
redrawSearchAreaBtn.addEventListener('click', () => setDrawMode(true));

// ---- the gesture itself ---------------------------------------------
// Bound to the map container rather than to Leaflet's own event bus so
// the raw pointer stream (with capture, coalesced moves and pointerId) is
// available; Leaflet's synthetic click/mousedown wrappers cannot express
// press-drag-release the way this needs.
mapEl.addEventListener('pointerdown', (e) => {
  if (!drawMode || drawGesture) return;
  if (e.button !== 0 && e.pointerType === 'mouse') return;   // left button / any touch or pen
  // A press that started on map furniture (zoom buttons, attribution,
  // the drawer or its handle) is that control's business, not a circle.
  if (e.target && typeof e.target.closest === 'function' &&
      e.target.closest('.leaflet-control, #mapDrawer, #mapEdgeHandle, .map-drawer-scrim')) return;

  const centre = map.mouseEventToLatLng(e);
  drawGesture = { pointerId: e.pointerId, centre };
  try { mapEl.setPointerCapture(e.pointerId); } catch { /* capture unsupported -- moves still arrive */ }
  e.preventDefault();

  // A replacement is now genuinely under way: set the old area aside (so
  // an abandoned gesture can restore it) and take it off the map, since
  // from here on the circle being drawn is the one on screen.
  replacedCircle = searchCircle;
  searchCircle = null;
  removeCircleLayers();

  drawCentreMarker = L.marker(centre, {
    icon: L.divIcon({ className: '', html: '<div class="draw-centre-dot"></div>', iconSize: [11, 11], iconAnchor: [5.5, 5.5] }),
    interactive: false
  }).addTo(map);
  drawCircleLayer(centre, 0, { preview: true });
  showRadiusBadge(0);
});

mapEl.addEventListener('pointermove', (e) => {
  if (!drawGesture || e.pointerId !== drawGesture.pointerId) return;
  e.preventDefault();
  // Metres, from Leaflet's own great-circle distance -- never a pixel
  // delta, so the radius means the same thing at every zoom level.
  const radius = map.distance(drawGesture.centre, map.mouseEventToLatLng(e));
  if (searchCircleLayer) searchCircleLayer.setRadius(radius);
  showRadiusBadge(radius);
});

function finishGesture(e, { cancelled } = {}) {
  if (!drawGesture || e.pointerId !== drawGesture.pointerId) return;
  const centre = drawGesture.centre;
  const radius = cancelled ? 0 : map.distance(centre, map.mouseEventToLatLng(e));
  try { mapEl.releasePointerCapture(drawGesture.pointerId); } catch { /* already released */ }
  drawGesture = null;
  hideRadiusBadge();

  if (radius < MIN_RADIUS_M) {
    // A tap, or a cancelled gesture -- not an area. Put back whatever was
    // there and stay armed, so the next real drag still works, rather
    // than committing a circle nobody asked for or silently dropping out
    // of the mode.
    restoreReplacedCircle();
    updateAreaControls();
    if (!cancelled) showToast(tr('map.areaTooSmall', 'Drag further out to set a search radius'), 'edit');
    return;
  }

  searchCircle = { centre, radius };
  replacedCircle = null;   // committed -- there is nothing to restore now
  if (drawCentreMarker) { map.removeLayer(drawCentreMarker); drawCentreMarker = null; }
  drawCircleLayer(centre, radius, { preview: false });
  setDrawMode(false);
  showToast(trf('map.searchAreaAppliedRadius', 'Searching within {r}', { r: fmtRadius(radius) }), 'check_circle');
  updateUrlState(true);
  refresh();
}

mapEl.addEventListener('pointerup', (e) => finishGesture(e));
mapEl.addEventListener('pointercancel', (e) => finishGesture(e, { cancelled: true }));

clearSearchAreaBtn.addEventListener('click', () => {
  removeCircleLayers();
  searchCircle = null;
  viewportSearchBounds = null;
  lastFilteredBounds = null;
  updateAreaControls();
  showToast(tr('map.searchAreaCleared', 'Search area cleared'), 'close');
  updateUrlState(true);
  refresh();
});

// ---------------------------------------------------------------------
// "Search this area" -- appears only after a significant, debounced
// pan/zoom (never queries continuously on every tiny movement); clicking
// it snapshots the current viewport bounds as the active spatial filter.
// Purely a client-side refilter of the already-loaded listings today
// (see loadListings()) -- it does not yet reduce Firestore reads, since
// this codebase has no bounds-aware backend query to send it to (see the
// final report's "Viewport data loading" limitation).
// ---------------------------------------------------------------------
const searchThisAreaBtn = document.getElementById('searchThisAreaBtn');
let lastFilteredBounds = null;
let moveDebounceTimer = null;
map.on('moveend zoomend', () => {
  if (drawMode) return;
  buildMarkers(); // re-cluster/re-adapt marker density for the new zoom/viewport
  clearTimeout(moveDebounceTimer);
  moveDebounceTimer = setTimeout(() => {
    if (searchCircle) return; // a drawn circle takes precedence -- no viewport chip while one is active
    const bounds = map.getBounds();
    if (lastFilteredBounds && lastFilteredBounds.contains(bounds.getCenter()) &&
        Math.abs(lastFilteredBounds.getNorth() - bounds.getNorth()) < 0.02) {
      return; // movement too small to be worth prompting for
    }
    searchThisAreaBtn.classList.add('show');
    searchThisAreaBtn.disabled = false;
    // The drawer may be shut, in which case the newly-available tool is
    // invisible -- the handle says so instead of the offer being lost.
    if (!drawerOpen) mapEdgeHandle.dataset.attention = '1';
  }, 500);
});
searchThisAreaBtn.addEventListener('click', () => {
  viewportSearchBounds = map.getBounds();
  lastFilteredBounds = viewportSearchBounds;
  searchThisAreaBtn.classList.remove('show');
  searchThisAreaBtn.disabled = true;
  mapEdgeHandle.dataset.attention = '0';
  updateAreaControls();
  refresh();
});

// ---------------------------------------------------------------------
// Fullscreen + reset view controls.
// ---------------------------------------------------------------------
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const wrap = document.getElementById('mapPanel');
  if (!document.fullscreenElement) {
    wrap.requestFullscreen?.().then(() => setTimeout(() => map.invalidateSize(), 150)).catch(() => {
      showToast(tr('map.fullscreenUnavailable', 'Fullscreen is not available on this device'), 'fullscreen');
    });
  } else {
    document.exitFullscreen?.().then(() => setTimeout(() => map.invalidateSize(), 150));
  }
});
document.getElementById('resetViewBtn').addEventListener('click', () => {
  map.setView([36.35, 44.3], 8);
});

// Legend -- collapsible/minimal, per the "compact optional Map Key" requirement.
const legendEl = document.getElementById('mapLegend');
document.getElementById('legendToggleBtn').addEventListener('click', () => {
  const collapsed = legendEl.classList.toggle('collapsed');
  document.getElementById('legendToggleBtn').setAttribute('aria-expanded', String(!collapsed));
  document.getElementById('legendToggleIcon').textContent = collapsed ? 'expand_more' : 'expand_less';
});

let myLocationMarker = null;
document.getElementById('myLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast(tr('map.locationUnavailable', 'Location services are not available on this device'), 'location_off');
    return;
  }
  showToast(tr('map.findingLocation', 'Finding your location…'), 'my_location');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 13);
      if (myLocationMarker) map.removeLayer(myLocationMarker);
      myLocationMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({
          className: '',
          html: `<div style="width:16px;height:16px;border-radius:999px;background:#4f6073;border:3px solid #fff;box-shadow:0 0 0 4px rgba(79,96,115,0.3);"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        })
      }).addTo(map);
      showToast(tr('map.locationFound', 'Location found'), 'check_circle');
    },
    () => showToast(tr('map.locationError', 'Could not access your location — check permissions'), 'location_off'),
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

// A price marker's popup reuses the same card markup as the list view,
// including its Request Viewing button — but that button only gets its
// click handler wired up once the popup's content is actually in the
// DOM (Leaflet builds it lazily on open), so it's wired here instead of
// in renderList().
map.on('popupopen', (e) => {
  const el = e.popup.getElement();
  if (!el) return;
  el.querySelectorAll('.request-viewing-btn').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      map.closePopup();
      openViewingModal(btn.dataset.id);
    });
  });
});

// ---------------------------------------------------------------------
// Administrative area boundaries — real OpenStreetMap district/city
// boundary lines (admin_level=8), drawn once in dark red with the area
// name always visible. Live data from Overpass, same public API already
// used for nearby-amenities lookups elsewhere on this site. A city with
// no boundary data in OSM is simply skipped — no fabricated outline is
// drawn in its place.
// ---------------------------------------------------------------------
const KNOWN_CITY_NAMES = Object.keys(CITY_CENTERS);

function isKnownCityBoundary(tags) {
  const name = (tags && (tags.name || tags['name:en'])) || '';
  return KNOWN_CITY_NAMES.some(c => name.toLowerCase() === c.toLowerCase());
}

function ringFromGeometry(geometry) {
  return (geometry || []).map(pt => [pt.lat, pt.lon]);
}

function drawBoundaryShape(coords, label, labelLatLng) {
  if (coords.length < 2) return;
  const isClosedRing = coords.length > 2 &&
    Math.abs(coords[0][0] - coords[coords.length - 1][0]) < 1e-6 &&
    Math.abs(coords[0][1] - coords[coords.length - 1][1]) < 1e-6;
  const shape = isClosedRing
    ? L.polygon(coords, { color: '#8b0000', weight: 2.5, opacity: 0.85, fillColor: '#8b0000', fillOpacity: 0.05 })
    : L.polyline(coords, { color: '#8b0000', weight: 2.5, opacity: 0.85, dashArray: '6 4' });
  shape.addTo(map);
  adminBoundaryLayers.push(shape);
  if (label && labelLatLng) {
    const labelMarker = L.marker(labelLatLng, {
      icon: L.divIcon({ className: '', html: `<div class="admin-boundary-label">${label}</div>`, iconSize: null, iconAnchor: [0, 0] }),
      interactive: false
    });
    labelMarker.addTo(map);
    adminBoundaryLayers.push(labelMarker);
  }
}

let adminBoundaryLayers = [];

async function loadAdminBoundaries() {
  // One bounding box wide enough to cover every known city, so this is
  // a single Overpass call rather than one per city.
  const bbox = '34.9,42.0,37.5,46.2';
  const query = `[out:json][timeout:25];(way["boundary"="administrative"]["admin_level"="8"](${bbox});relation["boundary"="administrative"]["admin_level"="8"](${bbox}););out geom;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    if (!res.ok) return;
    const data = await res.json();
    (data.elements || []).forEach(el => {
      if (!isKnownCityBoundary(el.tags)) return;
      const label = el.tags.name || el.tags['name:en'];
      if (el.type === 'way' && el.geometry) {
        const coords = ringFromGeometry(el.geometry);
        const mid = coords[Math.floor(coords.length / 2)];
        drawBoundaryShape(coords, label, mid);
      } else if (el.type === 'relation' && el.members) {
        let labelPlaced = false;
        el.members.forEach(m => {
          if (m.type !== 'way' || m.role !== 'outer' || !m.geometry) return;
          const coords = ringFromGeometry(m.geometry);
          const mid = coords[Math.floor(coords.length / 2)];
          drawBoundaryShape(coords, labelPlaced ? null : label, labelPlaced ? null : mid);
          labelPlaced = true;
        });
      }
    });
  } catch (e) {
    // Overpass unreachable or slow — the map still works fine without
    // boundary overlays, so fail silently rather than surface an error
    // for a purely decorative layer.
  }
}
loadAdminBoundaries();

// Arriving via any "browse this city" link (?city=) should show every
// deal type for that city — sale and rent —
// not just the default For Sale view, since the point of that nav is to
// see everything available there, not just what's for sale.
//
// ?type=rent / ?type=sale are the shared header/mobile nav's global Buy
// and Rent actions landing directly in the matching mode (see
// js/site-header.js) -- 'sale' needs no branch here since it's already
// this page's own default state.
function setActiveTypeFromUrl(type) {
  activeType = type;
  document.querySelectorAll('.type-toggle').forEach(b => {
    b.classList.remove('bg-primary', 'text-on-primary');
    b.classList.add('text-on-surface-variant');
  });
  const btn = document.querySelector('.type-toggle[data-type-filter="' + type + '"]');
  if (btn) {
    btn.classList.add('bg-primary', 'text-on-primary');
    btn.classList.remove('text-on-surface-variant');
  }
}

// ---------------------------------------------------------------------
// URL state -- the search itself (deal type, city, price, beds/baths,
// property types, verified/area, sort, and the centered listing) is
// reflected in the URL so a refresh, a shared link, or a browser
// back/forward step restores the same search. Never includes a
// listing's exact lat/lng or any private/hidden-listing information --
// only the same filter values already visible in the filter bar's own
// controls, plus a listing id (a public identifier, not a coordinate).
// ---------------------------------------------------------------------
function buildStateParams() {
  const p = new URLSearchParams();
  if (activeType !== 'sale') p.set('type', activeType);
  const cityVal = document.getElementById('citySearch').value.trim();
  if (cityVal) p.set('city', cityVal);
  if (priceMin !== null) p.set('priceMin', String(priceMin));
  if (priceMax !== null) p.set('priceMax', String(priceMax));
  if (bedsMin > 0) p.set('beds', String(bedsMin));
  if (bathsMin > 0) p.set('baths', String(bathsMin));
  if (selectedHomeTypes.size) p.set('types', [...selectedHomeTypes].join(','));
  if (verifiedOnly) p.set('verified', '1');
  if (areaMin !== null) p.set('areaMin', String(areaMin));
  if (areaMax !== null) p.set('areaMax', String(areaMax));
  if (sortBy !== 'recommended') p.set('sort', sortBy);
  if (activeId) p.set('listing', activeId);
  return p;
}
function updateUrlState(push) {
  const params = buildStateParams();
  const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  const currentUrl = window.location.pathname + window.location.search;
  if (newUrl === currentUrl) return;
  if (push) history.pushState(null, '', newUrl);
  else history.replaceState(null, '', newUrl);
}
function readUrlStateIntoFilters() {
  const p = new URLSearchParams(window.location.search);
  const urlCity = p.get('city');
  const urlType = p.get('type');
  if (urlCity) document.getElementById('citySearch').value = urlCity;
  if (urlType === 'all' || (urlCity && !urlType)) setActiveTypeFromUrl('all');
  else if (urlType === 'rent') setActiveTypeFromUrl('rent');
  else if (urlType === 'sale' || !urlType) setActiveTypeFromUrl(urlType || 'sale');

  const pMin = p.get('priceMin'), pMax = p.get('priceMax');
  priceMin = pMin !== null ? Number(pMin) : null;
  priceMax = pMax !== null ? Number(pMax) : null;
  document.getElementById('priceMinInput').value = priceMin ?? '';
  document.getElementById('priceMaxInput').value = priceMax ?? '';
  document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);

  bedsMin = Number(p.get('beds')) || 0;
  bathsMin = Number(p.get('baths')) || 0;
  document.getElementById('bedsMinSelect').value = String(bedsMin);
  document.getElementById('bathsMinSelect').value = String(bathsMin);
  document.getElementById('bedsFilterBtn').classList.toggle('active', bedsMin > 0 || bathsMin > 0);

  const typesParam = p.get('types');
  selectedHomeTypes = new Set(typesParam ? typesParam.split(',').filter(Boolean) : []);
  document.querySelectorAll('.home-type-check').forEach(cb => { cb.checked = selectedHomeTypes.has(cb.value); });
  document.getElementById('homeTypeFilterBtn').classList.toggle('active', selectedHomeTypes.size > 0);

  verifiedOnly = p.get('verified') === '1';
  const aMin = p.get('areaMin'), aMax = p.get('areaMax');
  areaMin = aMin !== null ? Number(aMin) : null;
  areaMax = aMax !== null ? Number(aMax) : null;
  document.getElementById('verifiedOnlyCheck').checked = verifiedOnly;
  document.getElementById('areaMinInput').value = areaMin ?? '';
  document.getElementById('areaMaxInput').value = areaMax ?? '';
  document.getElementById('moreFiltersBtn').classList.toggle('active', verifiedOnly || areaMin !== null || areaMax !== null);

  sortBy = p.get('sort') || 'recommended';
  document.getElementById('sortBtn').classList.toggle('active', sortBy !== 'recommended');

  const urlListing = p.get('listing');
  if (urlListing) activeId = urlListing;
}
readUrlStateIntoFilters();
// Browser back/forward -- re-read whatever URL the browser just navigated
// to and re-render to match it. Never scrolls/pans on this path (opts
// left default) so a rapid sequence of back/forward doesn't fight the
// user with camera motion; the map/list state itself is what changes.
window.addEventListener('popstate', () => {
  readUrlStateIntoFilters();
  refresh();
});

// ---------------------------------------------------------------------
// MAM AI hook (js/mam-chat-panel.js's applyMapAction). The ONE way MAM is
// allowed to touch this page's real search state -- it never re-
// implements filtering itself, it only ever calls this with the exact
// filter keys backend/app/mam/orchestrator.py's _search_filters_action
// and Tools.open_on_map both already use (deal/q/types/minPrice/maxPrice/beds) to
// translate a resolved tool call's OWN real arguments -- so the filters
// applied here always match the cards MAM's reply already showed.
// ---------------------------------------------------------------------
function applyAiFilters(filters) {
  if (!filters || typeof filters !== 'object') return;
  if (filters.deal === 'rent') setActiveTypeFromUrl('rent');
  if (typeof filters.q === 'string' && filters.q) {
    document.getElementById('citySearch').value = filters.q;
  }
  if (Array.isArray(filters.types) && filters.types.length) {
    selectedHomeTypes = new Set(filters.types.filter((t) => typeof t === 'string' && t));
    document.querySelectorAll('.home-type-check').forEach((cb) => { cb.checked = selectedHomeTypes.has(cb.value); });
    document.getElementById('homeTypeFilterBtn').classList.toggle('active', selectedHomeTypes.size > 0);
  }
  if (filters.minPrice !== undefined) {
    priceMin = Number(filters.minPrice) || null;
    document.getElementById('priceMinInput').value = priceMin || '';
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  }
  if (filters.maxPrice !== undefined) {
    priceMax = Number(filters.maxPrice) || null;
    document.getElementById('priceMaxInput').value = priceMax || '';
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  }
  if (filters.beds !== undefined) {
    bedsMin = Number(filters.beds) || 0;
    document.getElementById('bedsMinSelect').value = String(bedsMin);
    document.getElementById('bedsFilterBtn').classList.toggle('active', bedsMin > 0 || bathsMin > 0);
  }
  updateUrlState(true);
  refresh();
  document.dispatchEvent(new CustomEvent('darwesh:mam-ai-filters-applied'));
}
window.DarweshPropertiesMap = {
  applyFilters: applyAiFilters,
  // MAM identifying/selecting a specific property (mapAction.
  // focusListingId) centers it in the SAME wheel/map -- never a second,
  // MAM-only card competing with these real ones. A no-op if the id
  // isn't in the current filtered set (e.g. MAM's own filters haven't
  // been applied yet); applyAiFilters already re-renders the wheel
  // before this would ever be called for a fresh search result.
  focusListing: (id) => {
    if (!id || !listingsLoaded) return;
    if (!filteredListings().some(l => l.id === id)) return;
    selectListing(id, { scrollList: true });
  },
  getState: () => ({ activeType, city: document.getElementById('citySearch').value, priceMin, priceMax, bedsMin, bathsMin, types: [...selectedHomeTypes] }),
  getVisibleCount: () => (listingsLoaded ? filteredListings().length : null),
  isReady: () => listingsLoaded,
};

refresh();
document.addEventListener('darwesh:langchange', refresh);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 100);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 600);
</script>
