<!-- CLIENT-04 (CLIENT_SIDE_SECURITY_REVIEW.md): meta-delivered CSP. GitHub Pages
can't set HTTP headers, so this is the only delivery mechanism available.
unsafe-inline on script and style sources is a deliberate, documented
tradeoff: this codebase has no build step and dozens of inline script/style
blocks per page; blocking them needs a nonce (impossible with no per-request
server logic) or a SHA-256 hash per block kept in lockstep with every future
edit across 21 pages, a real ongoing cost not taken on here. What this DOES
still provide: an injected payload (e.g. CLIENT-01/02, both since fixed) can
no longer load a script from an attacker-controlled domain or exfiltrate data
via fetch or img to one. Note: frame-ancestors, report-uri, and sandbox are
silently ignored when CSP is delivered via a meta tag (a browser spec rule,
not an oversight here); this can never provide clickjacking protection or
violation reporting. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://darwesh-backend-353477435585.me-central1.run.app https://overpass-api.de https://nominatim.openstreetmap.org https://www.google.com https://*.ingest.sentry.io; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"/>

<style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* Property price pins — color encodes verification status:
       red = agent-listed (not yet verified), green = verified/registered.
       This is the same `verified` flag already shown as a badge on the

    .price-pin {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1.5px solid transparent;

      white-space: nowrap;
      transition: all .15s ease;
      cursor: pointer;
      color: #ffffff;
    }
    .price-pin.pin-unverified { background: #c62828; border-color: #8f1c1c; }
    .price-pin.pin-verified { background: #2e7d32; border-color: #1e5620; }
    .price-pin:hover { transform: scale(1.08); z-index: 1000 !important; }
    .price-pin.active {

    .neighborhood-label {

      letter-spacing: 0.02em;
      padding: 2px 7px;

      pointer-events: none;
    }
    /* Administrative area boundaries — dark red outline, real OSM data,
       with the city/region name always visible along the boundary. */
    .admin-boundary-label {
      background: rgba(139,0,0,0.92);
      color: #ffffff;
      font-family: 'IBM Plex Sans', sans-serif;

      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
    }
    .map-legend-title {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #8E7448;
      margin-bottom: 6px;
    }
    .map-legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #F2EEE5; padding: 2px 0; }
    .map-legend-dot { width: 11px; height: 11px; border-radius: 999px; flex: none; }
    .map-legend-line { width: 16px; height: 0; border-top: 2.5px dashed #8b0000; flex: none; }
    /* ---- Property Wheel -------------------------------------------------
     * The listing column reads as a vertical picker, not a scrolling
     * list -- one property centered/focused, its neighbors visible above
     * and below at reduced scale/opacity. Motion reference only: an
     * iPhone-timer-wheel FEEL (centered focus, snap-to-nearest, gentle
     * depth), not Apple's visuals/assets/typography -- every value below
     * is this page's own cinematic dark-luxury palette. Text never
     * rotates; cards stay upright and fully readable at every position.
     * Native CSS scroll-snap does the actual snapping (smooth, free,
     * identical for wheel/trackpad/touch) -- JS only adds the continuous
     * depth (scale/opacity) transform while scrolling and detects when a
     * new card has settled into center (see renderList()/wireWheel()). */
    #cardList {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      outline: none;
    }
    #cardList.wheel-instant-scroll { scroll-behavior: auto; }
    .wheel-spacer { flex: none; scroll-snap-align: none; }
    .listing-card {
      /* A fixed, breakpoint-specific height (not just min-height) is
         what makes the snap-centering math in wireWheel() exact --
         every real card, in every language, must be the same height so
         "distance from the container's vertical center" means the same
         thing for every card. Content inside is deliberately kept to
         fixed single-line rows (truncated, never wrapped) so this holds
         regardless of how long a given language's price/address text is. */
      height: 124px;
      margin-block: 5px;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      flex: none;
      transform-origin: center center;
      /* transform/opacity are driven per-frame by JS while scrolling
         (raw values, no CSS lag fighting a live scroll position) --
         only the discrete "just became active" cues transition, so the
         gold focus border/shadow eases in once a card actually settles
         into center rather than flickering on every intersection tick. */
      transition: border-color 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
    }
    .listing-card.active {
      border-color: #B89A63;
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    @media (min-width: 768px) {
      .listing-card { height: 140px; margin-block: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #cardList { scroll-behavior: auto; }
      .listing-card { transition: none; transform: none !important; opacity: 1 !important; }
    }
    .leaflet-container { font-family: 'Inter', sans-serif; cursor: default; }
    .leaflet-container.draw-mode { cursor: crosshair; }
    .private-city-badge {
      background: #17150F;
      color: #F2EEE5;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #8E7448;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      white-space: nowrap;
      cursor: pointer;
      transition: transform .15s ease;
    }
    .private-city-badge:hover { transform: scale(1.06); }
    .filter-dropdown-btn.active { border-color: #8E7448; color: #B89A63; background: #221E15; }
    .filter-dropdown-menu { position: fixed; z-index: 1200; }
    .map-popup-card .leaflet-popup-content-wrapper { padding: 0; border-radius: 12px; overflow: hidden; }
    .map-popup-card .leaflet-popup-content { margin: 0; width: 240px !important; }
    .map-popup-card .listing-card { border-radius: 0; border: none; box-shadow: none; cursor: default; }
    .map-popup-card .leaflet-popup-tip-container { display: none; }
    .map-overlay-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .map-overlay-btn {
      background: #17150F;
      color: #F2EEE5;
      font-family: 'Inter', sans-serif;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      border: 1px solid #5D482B;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background .2s ease;
    }
    .map-overlay-btn:hover { background: #221E15; }
    .map-overlay-btn.active { background: #B89A63; color: #090A0A; }
    .map-overlay-btn-labeled { padding: 10px 16px 10px 12px; }
    .map-overlay-btn-icon { padding: 12px; }
    .map-overlay-btn .icon { font-size: 20px; }
    .map-overlay-btn .label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
    .map-search-chip {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1100;
      background: #17150F;
      color: #F2EEE5;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 8px 12px 8px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .map-toast {
      position: fixed; bottom: 6.5rem; left: 50%; transform: translateX(-50%) translateY(10px);
      background: #17150F; color: #F2EEE5; border: 1px solid #5D482B; padding: 10px 20px; border-radius: 999px;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 1100;
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .map-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (min-width: 768px) { .map-toast { bottom: 1.5rem; } }

    /* ---- MAM AI ---------------------------------------------------------
     * A floating assistant dock layered OVER the live map/results -- an
     * original Darwesh implementation. The interaction shape (a compact
     * search bar that expands into a conversation panel, both staying on
     * top of the real search behind them) is the only thing taken as
     * reference from Zillow's own AI search UX; every asset, string, and
     * pixel value below is this codebase's own cinematic dark-luxury
     * palette (see css/cinematic.css), not copied markup/CSS. This is the
     * ONE public map's own AI dock -- MAM has no separate map of its own. */
    #drmAiWrap {
      position: fixed; z-index: 1150; left: 50%; transform: translateX(-50%);
      bottom: 20px; width: min(92vw, 640px);
      display: flex; flex-direction: column; gap: 10px; align-items: stretch;
      pointer-events: none;
    }
    #drmAiWrap > * { pointer-events: auto; }
    .drm-ai-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .drm-ai-chip {
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
      background: #17150Fcc; backdrop-filter: blur(6px); color: #F2EEE5; border: 1px solid #5D482B;
      border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap;
    }
    .drm-ai-chip:hover { border-color: #B89A63; }
    .drm-ai-bar {
      display: flex; align-items: center; gap: 8px;
      background: #17150Ff2; backdrop-filter: blur(10px); border: 1px solid #5D482B;
      border-radius: 999px; padding: 7px 7px 7px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.4);
    }
    .drm-ai-mark {
      width: 22px; height: 22px; border-radius: 999px; flex: none; position: relative;
      background: radial-gradient(circle at 35% 30%, #221E15, #17150F 70%); border: 1px solid #5D482B;
    }
    .drm-ai-mark::after { content: ''; position: absolute; inset: 0; margin: auto; width: 6px; height: 6px; border-radius: 999px; background: #B89A63; }
    #drmAiInput { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #F2EEE5; font-family: 'Inter', sans-serif; font-size: 14px; }
    #drmAiInput::placeholder { color: #A79F91; }
    .drm-ai-icon-btn { flex: none; width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    .drm-ai-send { background: #B89A63; color: #090A0A; }
    .drm-ai-send:disabled { opacity: .5; cursor: not-allowed; }
    .drm-ai-mic { background: transparent; color: #F2EEE5; border: 1px solid #5D482B; }
    .drm-ai-mic.mic-listening { background: #E5787A; border-color: #E5787A; color: #090A0A; }

    #drmAiPanel {
      display: flex; flex-direction: column; background: #17150Ff5; backdrop-filter: blur(10px);
      border: 1px solid #5D482B; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
      max-height: 56vh; overflow: hidden;
    }
    .drm-ai-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #5D482B; flex: none; }
    .drm-ai-panel-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; color: #F2EEE5; letter-spacing: .04em; text-transform: uppercase; }
    .drm-ai-close { background: none; border: none; color: #A79F91; cursor: pointer; padding: 4px; border-radius: 999px; display: flex; }
    .drm-ai-close:hover { color: #F2EEE5; }
    #drmAiLog { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .drm-ai-bubble { border-radius: 16px; padding: 10px 14px; max-width: 88%; font-family: 'Inter', sans-serif; font-size: 13.5px; line-height: 1.45; }
    .drm-ai-bubble-user { align-self: flex-end; background: #B89A63; color: #090A0A; border-end-end-radius: 4px; }
    .drm-ai-bubble-assistant { align-self: flex-start; background: #221E15; color: #F2EEE5; border: 1px solid #5D482B; border-start-start-radius: 4px; }
    .drm-ai-bubble-error { border-color: #E5787A; }
    .drm-ai-retry { margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #B89A63; background: none; border: 1px solid #5D482B; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
    .drm-ai-thinking { display: flex; gap: 4px; padding: 10px 14px; }
    .drm-ai-dot { width: 6px; height: 6px; border-radius: 999px; background: #8E7448; animation: drm-ai-dot-bounce 1.2s infinite; }
    .drm-ai-dot:nth-child(2) { animation-delay: .15s; }
    .drm-ai-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes drm-ai-dot-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .drm-ai-dot { animation: none; opacity: .8; } }

    .drm-ai-ref-cards { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
    .drm-ai-ref-card { flex: none; width: 132px; border-radius: 12px; overflow: hidden; background: #1C1912; border: 1px solid #5D482B; text-align: start; cursor: pointer; text-decoration: none; display: block; }
    .drm-ai-ref-card-media { height: 68px; background: #221E15; }
    .drm-ai-ref-card-media img { width: 100%; height: 100%; object-fit: cover; }
    .drm-ai-ref-card-body { padding: 6px 8px 8px; }
    .drm-ai-ref-card-title { font-size: 11px; font-weight: 700; color: #F2EEE5; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .drm-ai-ref-card-price { font-size: 11px; font-weight: 700; color: #B89A63; margin-top: 3px; }

    @media (max-width: 767px) {
      #drmAiWrap { bottom: calc(6rem + 62px + env(safe-area-inset-bottom)); width: calc(100vw - 24px); }
      #drmAiPanel { max-height: 62vh; }
    }
    /* #drmAiPanel/.drm-ai-chips set their own `display` above -- both an
       ID selector and a same-specificity-as-.hidden class selector that
       happens to be defined AFTER css/tailwind.css in the cascade, either
       of which would otherwise beat Tailwind's plain `.hidden{display:
       none}` utility and leave the panel visible while "closed." This is
       the one, explicit place that guarantees `hidden` always wins. */
    #drmAiPanel.hidden, .drm-ai-chips.hidden { display: none !important; }
    /* The AI dock floats fixed over the bottom of the list panel (by
       design, matching the layered "assistant over live results" shape
       this is inspired by) -- this reserves enough scroll room that the
       last real card can still be scrolled fully clear of it, rather
       than staying permanently obscured. */
    #listPanel { padding-bottom: 180px; }
    @media (min-width: 768px) { #listPanel { padding-bottom: 96px; } }
    /* css/mam-companion.css deliberately docks to the same PHYSICAL edge
       in both directions (see its own comment) -- the right choice on a
       page with nothing competing for that edge. Here, though, the list
       panel itself moves to the right in RTL (matching reading
       direction), which would put the companion right on top of it.
       This page-scoped override keeps the companion over the map side
       instead, in both directions -- a host page restyling the shared
       module for its own layout, not a change to the module's default. */
    html[dir="rtl"] .mamco-root { right: auto; left: 20px; }
    @media (max-width: 767px) { html[dir="rtl"] .mamco-root { left: 10px; right: auto; } }
  </style>
</head>

];

let LISTINGS = [];
let listingsLoaded = false;

// ---------------------------------------------------------------------
// Real listings, loaded live from Firestore's `listings` collection —
// the same collection admin.html and agent-dashboard.html write to.
// firestore.rules only allows an anonymous/public read when the query
// itself is constrained to private==false AND status=='active' (a
// listing-level get() or an unfiltered query is denied) -- so this is
// the only listing set this page can ever fetch for a public visitor.
// Private listings never reach this page's memory at all any more, so
// isPrivateHidden()/revealListing() below naturally never trigger for
// them; they're left in place only because an agent's OWN private
// listings still round-trip through the same `card()`/marker code when
// viewed from agent-dashboard.html's map. A listing with no lat/lng
// can't be placed on this map so it's left out here.
// ---------------------------------------------------------------------
let listingsLoadError = false;
async function loadListings() {
  listingsLoadError = false;
  try {
    const [{ db, getDocs }, storeMod] = await Promise.all([
      import('./js/firebase-init.js'),
      import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
    ]);
    const { collection, query, where } = storeMod;
    const q = query(collection(db, 'listings'), where('private', '==', false), where('status', '==', 'active'));
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    LISTINGS = docs.filter(d => d.lat != null && d.lng != null).map(d => {
      const price = Number(d.price) || 0;
      return {
        id: d.id,
        city: d.city || '',
        address: d.address || d.title || '',
        lat: d.lat, lng: d.lng,
        type: d.dealType === 'rent' ? 'rent' : 'sale',
        price,
        priceLabel: d.dealType === 'rent' ? ('$' + price.toLocaleString() + '/mo') : ('$' + price.toLocaleString()),
        beds: Number(d.beds) || 0,
        baths: Number(d.baths) || 0,
        sqft: Number(d.sqft) || 0,
        propertyType: d.propertyType || '',
        img: d.img || IMAGES[0],
        verified: !!d.verified,
        private: !!d.private
      };
    });
  } catch (e) {
    LISTINGS = [];
    listingsLoadError = true;
  }
  listingsLoaded = true;
  refresh();
}
loadListings();

const revealed = new Set();
let searchCircle = null;
let drawMode = false;
let drawStart = null;

// ---------------------------------------------------------------------
// Favorites & saved searches (Firebase). Loaded via dynamic import so
// this stays a plain classic script — no module-scope isolation issues
// with the rest of this file's functions/variables.
// ---------------------------------------------------------------------
let favAuth = null, favDb = null, favFns = null;
let favoriteIds = new Set();

async function initFavorites() {
  const [{ auth, db, getDocs, addDoc, setDoc, deleteDoc }, authMod, storeMod] = await Promise.all([
    import('./js/firebase-init.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
  ]);
  favAuth = auth; favDb = db;
  favFns = { ...authMod, ...storeMod, getDocs, addDoc, setDoc, deleteDoc };
  favFns.onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await favFns.getDocs(favFns.collection(db, 'users', user.uid, 'favorites'));
      favoriteIds = new Set();
      snap.forEach(d => favoriteIds.add(d.id));
    } else {
      favoriteIds = new Set();
    }
    refresh();
  });
}
initFavorites();

async function toggleFavorite(id) {
  if (!favAuth || !favAuth.currentUser) {
    showToast('Log in to save favorites', 'favorite');
    setTimeout(() => { window.location.href = 'login.html'; }, 900);
    return;
  }
  const uid = favAuth.currentUser.uid;
  // Every other favoriting surface site-wide (buy.html, rent.html, and
  // listing.html -- the shared detail page for both sale and rent) uses
  // the 'buy-' + id doc-id prefix regardless of dealType. This page used
  // to write 'map-' + id instead, a different document for the exact
  // same listing -- so a listing favorited here never showed as already
  // saved on buy.html/rent.html/listing.html and vice versa, and
  // account.html's favorites list (no dedup by underlying listing id)
  // would show it twice. Matched to the site-wide convention.
  const idStr = 'buy-' + id;
  const l = LISTINGS.find(x => x.id === id);
  const ref = favFns.doc(favDb, 'users', uid, 'favorites', idStr);
  if (favoriteIds.has(idStr)) {
    favoriteIds.delete(idStr);
    await favFns.deleteDoc(ref);
    showToast('Removed from favorites', 'favorite');
  } else {
    favoriteIds.add(idStr);
    await favFns.setDoc(ref, {
      listingId: idStr, address: l.address, city: l.city,
      priceLabel: l.priceLabel, img: l.img, savedAt: favFns.serverTimestamp()
    });
    showToast('Saved to favorites', 'favorite');
  }
  refresh();
}

// ---------------------------------------------------------------------
// Request Viewing modal — writes a real submission doc to Firestore so
// staff can see and triage it in admin.html's Customer Services tab.
// Works for guests too (no account required), not just logged-in users.
// ---------------------------------------------------------------------
let viewingListingId = null;

function openViewingModal(id) {
  viewingListingId = id;
  const l = LISTINGS.find(x => x.id === id);
  document.getElementById('viewingModalListingLine').textContent = l ? `${l.address}, ${l.city}` : '';
  document.getElementById('viewingRequestError').classList.add('hidden');
  document.getElementById('viewingRequestForm').reset();
  if (favAuth && favAuth.currentUser && favAuth.currentUser.email) {
    document.getElementById('viewingEmail').value = favAuth.currentUser.email;
  }
  document.getElementById('viewingModalOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeViewingModal() {
  document.getElementById('viewingModalOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}

document.getElementById('viewingModalClose').addEventListener('click', closeViewingModal);
document.getElementById('viewingModalBackdrop').addEventListener('click', closeViewingModal);

document.getElementById('viewingRequestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('viewingRequestError');
  errEl.classList.add('hidden');
  if (!favFns || !favDb) {
    errEl.textContent = tr('map.viewingRequestError', 'Could not send your request — please try again in a moment.');
    errEl.classList.remove('hidden');
    return;
  }
  const l = LISTINGS.find(x => x.id === viewingListingId);
  const name = document.getElementById('viewingName').value.trim();
  const phone = document.getElementById('viewingPhone').value.trim();
  const email = document.getElementById('viewingEmail').value.trim();
  const submitBtn = document.getElementById('viewingSubmitBtn');
  submitBtn.disabled = true;
  try {
    await favFns.addDoc(favFns.collection(favDb, 'submissions'), {
      type: 'viewing',
      listingId: viewingListingId,
      address: l ? l.address : '', city: l ? l.city : '', priceLabel: l ? l.priceLabel : '',
      lat: l ? l.lat : null, lng: l ? l.lng : null,
      name, phone, email,
      uid: (favAuth && favAuth.currentUser) ? favAuth.currentUser.uid : null,
      status: 'pending', createdAt: favFns.serverTimestamp()
    });
    closeViewingModal();
    showToast(tr('map.viewingRequestSent', 'Viewing request sent — an agent will contact you within 24 hours'), 'event_available');
  } catch (err) {
    errEl.textContent = tr('map.viewingRequestError', 'Could not send your request — please try again in a moment.');
    errEl.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
  }
});

async function saveCurrentSearch() {
  if (!favAuth || !favAuth.currentUser) {
    showToast('Log in to save searches', 'bookmark_add');

  }
  const uid = favAuth.currentUser.uid;

  const label = `${activeType === 'all' ? 'All types' : (activeType === 'sale' ? 'For Sale' : 'For Rent')}${cityVal ? ' in ' + cityVal : ' — Kurdistan Region'}`;
  await favFns.addDoc(favFns.collection(favDb, 'users', uid, 'savedSearches'), {
    label, url: 'map.html', filters: { type: activeType, city: cityVal }, createdAt: favFns.serverTimestamp()
  });

}

function showToast(msg, icon) {

let activeType = "sale";
let activeId = null;
let markers = {};
let priceMin = null, priceMax = null;
let bedsMin = 0, bathsMin = 0;
let selectedHomeTypes = new Set();
// Capped well below street/building level (OSM building outlines
// typically render from z16+) so no one can zoom in far enough to make
// out an individual property, private listing or not.
const MAX_MAP_ZOOM = 15;
const map = L.map('map', { zoomControl: false, maxZoom: MAX_MAP_ZOOM }).setView([36.35, 44.3], 8);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: MAX_MAP_ZOOM
}).addTo(map);

function isPrivateHidden(l) {
  return !!l.private && !revealed.has(l.id);
}

// Fixed, publicly-known city centers — the same point a city label would
// sit on. Never derived from any listing's real coordinates, so a badge
// placed here carries no information about where a specific property is.
const CITY_CENTERS = {
  "Erbil": [36.1911, 44.0093],
  "Sulaymaniyah": [35.5608, 45.4347],
  "Duhok": [36.8642, 42.9903],
  "Zakho": [37.1450, 42.6829],
  "Soran": [36.6500, 44.5450],
  "Koya": [36.0750, 44.6200],
  "Kirkuk": [35.4681, 44.3922]
};

function priceIcon(listing, active) {
  const statusClass = listing.verified ? 'pin-verified' : 'pin-unverified';
  return L.divIcon({
    className: '',
    html: `<div class="price-pin ${statusClass}${active ? ' active' : ''}" data-id="${listing.id}">${listing.priceLabel}</div>`,
    iconSize: null,
    iconAnchor: [30, 15]
  });
}

function cityBadgeIcon(count) {
  return L.divIcon({
    className: '',
    html: `<div class="private-city-badge"><span class="material-symbols-outlined text-[14px]">lock</span><span>${count} Private</span></div>`,
    iconSize: null,
    iconAnchor: [20, 14]
  });
}

function neighborhoodIcon() {
  return L.divIcon({ className: '', html: `<div class="neighborhood-pin"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
}

// ---------------------------------------------------------------------
// Neighborhood markers — one blue pin per distinct address among this
// city's VISIBLE listings (never derived from a hidden private listing's
// coordinates), placed at the centroid of that address's listings, with
// the neighborhood name always visible as a label. Real data derived
// from real listing addresses, not a separate fabricated dataset.
// ---------------------------------------------------------------------
function buildNeighborhoodMarkers(visibleListings) {
  const groups = {};
  visibleListings.forEach(l => {
    if (!l.address) return;
    const key = l.address + '|' + l.city;
    if (!groups[key]) groups[key] = { name: l.address, lats: [], lngs: [] };
    groups[key].lats.push(l.lat);
    groups[key].lngs.push(l.lng);
  });
  Object.entries(groups).forEach(([key, g]) => {
    const lat = g.lats.reduce((a, b) => a + b, 0) / g.lats.length;
    const lng = g.lngs.reduce((a, b) => a + b, 0) / g.lngs.length;
    const marker = L.marker([lat, lng], { icon: neighborhoodIcon(), zIndexOffset: -500 });
    marker.bindTooltip(g.name, { permanent: true, direction: 'top', offset: [0, -6], className: 'neighborhood-label' });
    marker.addTo(map);
    markers['nbhd-' + key] = marker;
  });
}

function buildMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  // Private listings that haven't been revealed never get an individual
  // pin — no marker, no circle, nothing tied to their real coordinates.
  // Instead they're rolled up into one badge per city, sitting on that
  // city's public center point, so the map never points at a specific
  // building for a hidden listing, only says "some are somewhere in here."
  const hiddenByCity = {};
  const visible = [];
  LISTINGS.forEach(l => {
    if (isPrivateHidden(l)) {
      hiddenByCity[l.city] = (hiddenByCity[l.city] || 0) + 1;
      return;
    }
    visible.push(l);
    const marker = L.marker([l.lat, l.lng], { icon: priceIcon(l, l.id === activeId) });
    marker.on('click', () => selectListing(l.id, { scrollList: true }));
    marker.bindPopup(() => card(l), { maxWidth: 240, minWidth: 240, className: 'map-popup-card', autoPanPadding: [20, 80] });
    marker.addTo(map);
    markers[l.id] = marker;
  });
  Object.entries(hiddenByCity).forEach(([city, count]) => {
    const center = CITY_CENTERS[city];
    if (!center) return;
    const badge = L.marker(center, { icon: cityBadgeIcon(count) });
    badge.on('click', () => {
      document.getElementById('citySearch').value = city;
      refresh();
      showToast(`${count} private listing${count > 1 ? 's' : ''} in ${city} — see the list`, 'lock');
    });
    badge.addTo(map);
    markers['city-' + city] = badge;
  });
  buildNeighborhoodMarkers(visible);
}

function filteredListings() {
  const q = document.getElementById('citySearch').value.trim().toLowerCase();
  return LISTINGS.filter(l => {
    const typeMatch = activeType === 'all' || l.type === activeType;
    const qMatch = !q || l.city.toLowerCase().includes(q) || l.address.toLowerCase().includes(q);
    const areaMatch = !searchCircle || L.latLng(l.lat, l.lng).distanceTo(searchCircle.getLatLng()) <= searchCircle.getRadius();
    const priceMatch = (priceMin === null || l.price >= priceMin) && (priceMax === null || l.price <= priceMax);
    const bedsMatch = l.beds >= bedsMin;
    const bathsMatch = l.baths >= bathsMin;
    const homeTypeMatch = selectedHomeTypes.size === 0 || selectedHomeTypes.has(l.propertyType);
    return typeMatch && qMatch && areaMatch && priceMatch && bedsMatch && bathsMatch && homeTypeMatch;
  });
}

function renderList() {
  if (!listingsLoaded) {
    document.getElementById('cardList').innerHTML = `<p class="col-span-full text-center text-on-surface-variant py-8">${tr('map.loadingListings','Loading listings…')}</p>`;
    document.getElementById('resultCount').textContent = '';
    document.getElementById('resultCountMobile').textContent = '';
    return;
  }
  if (listingsLoadError) {
    // Distinct from "0 listings matched" (map.noListingsYet, below) --
    // a genuine fetch failure previously rendered as an identical "0
    // homes in Kurdistan Region" with no error indication and no way to
    // retry.
    document.getElementById('cardList').innerHTML = `<div class="col-span-full text-center py-8">
      <p class="text-on-surface-variant mb-3">${tr('buy.loadError', "Couldn't load listings. Please check your connection and try again.")}</p>
      <button id="mapRetryBtn" type="button" class="bg-primary text-on-primary px-6 py-2.5 rounded-full font-label-caps text-label-caps hover:bg-primary-container transition-colors">${tr('common.retry', 'Retry')}</button>
    </div>`;
    document.getElementById('resultCount').textContent = '';
    document.getElementById('resultCountMobile').textContent = '';
    const retryBtn = document.getElementById('mapRetryBtn');
    if (retryBtn) retryBtn.addEventListener('click', () => { listingsLoaded = false; loadListings(); });
    return;
  }
  const list = filteredListings();
  const cardListEl = document.getElementById('cardList');
  if (!list.length) {
    // Honest empty state, never an empty wheel -- matches the pre-
    // existing "0 matched" copy exactly, just no spacers/observer wired
    // since there is nothing to center.
    teardownWheel();
    cardListEl.innerHTML = `<p class="col-span-full text-center text-on-surface-variant py-8">${tr('map.noListingsYet','No listings match yet — check back soon or adjust your filters.')}</p>`;
    document.getElementById('resultCount').textContent = '';
    document.getElementById('resultCountMobile').textContent = '';
    activeId = null;
    return;
  }
  // Preserve the current active property across a filter/data refresh if
  // it's still in the result set; otherwise focus the first valid
  // result -- never a stale id pointing at a card that no longer exists.
  if (!activeId || !list.some(l => l.id === activeId)) {
    activeId = list[0].id;
  }
  cardListEl.innerHTML =
    '<div class="wheel-spacer" id="wheelSpacerTop"></div>' +
    list.map(wheelCard).join('') +
    '<div class="wheel-spacer" id="wheelSpacerBottom"></div>';
  document.querySelectorAll('.listing-card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      if (el.dataset.id === activeId) {
        // The already-centered/active card is the one clicking opens --
        // reuses the existing real listing detail page (js/mam-v2.js and
        // js/mam-properties-map.js's own reference cards already link
        // here), never a second property-detail system. A NON-active
        // card click below just brings it to center first instead.
        window.location.href = 'listing.html?id=' + encodeURIComponent(el.dataset.id);
        return;
      }
      selectListing(el.dataset.id, { scrollList: true });
    });
  });
  document.querySelectorAll('.request-viewing-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openViewingModal(btn.dataset.id);
    });
  });
  document.querySelectorAll('.reveal-location-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      revealListing(btn.dataset.id);
    });
  });
  document.getElementById('resultCount').textContent = `${list.length} homes in Kurdistan Region`;
  document.getElementById('resultCountMobile').textContent = `${list.length} homes found`;
  wireWheel(cardListEl, list);
}

function revealListing(id) {
  if (revealed.has(id)) return;
  revealed.add(id);
  showToast('Exact location unlocked', 'lock_open');
  refresh();
  selectListing(id, { scrollList: true });
}

// selectListing is the ONE place activeId ever changes -- the shared
// state every entry point (card click, map marker click, keyboard,
// wheel-scroll settling into a new center, MAM's focusListingId) goes
// through, so the map/list/MAM surfaces can never disagree about which
// property is "current." `opts.scrollList` is false only when the list
// itself is what just triggered this call (a wheel-scroll settle) --
// scrolling it again would fight the gesture that got here.
function selectListing(id, opts) {
  opts = opts || {};
  activeId = id;
  const l = LISTINGS.find(x => x.id === id);
  document.querySelectorAll('.listing-card').forEach(el => {
    const isActive = el.dataset.id === id;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-selected', String(isActive));
  });
  const cardListEl = document.getElementById('cardList');
  if (cardListEl) cardListEl.setAttribute('aria-activedescendant', 'wheel-card-' + id);
  Object.entries(markers).forEach(([mid, marker]) => {
    if (!(marker instanceof L.Marker)) return;
    const listing = LISTINGS.find(x => x.id === mid);
    if (!listing) return;
    marker.setIcon(priceIcon(listing, mid === id));
  });
  if (l) {
    // Never move the camera toward a hidden private listing's real
    // coordinates — the map simply doesn't react to it until revealed.
    if (opts.panMap !== false && !isPrivateHidden(l)) {
      map.panTo([l.lat, l.lng]);
    }
    if (opts.scrollList !== false) {
      const cardEl = document.querySelector(`.listing-card[data-id="${id}"]`);
      if (cardEl) {
        cardEl.scrollIntoView({
          behavior: prefersReducedMotion() ? 'auto' : 'smooth',
          block: 'center',
        });
      }
    }
  }
}

// ---------------------------------------------------------------------
// Property wheel motion controller. Native CSS scroll-snap (already set
// on #cardList/.listing-card above) does the real snapping for wheel,
// trackpad, and touch alike -- this only adds two things on top:
//  1. A continuous depth transform (scale/opacity by distance from the
//     container's vertical center) on the small set of cards currently
//     intersecting the viewport, via a requestAnimationFrame loop that
//     runs only while actively scrolling. IntersectionObserver is what
//     keeps that set small regardless of how many total results there
//     are -- the RAF loop never iterates the full list.
//  2. Settle detection (native `scrollend` where supported, a short
//     debounce elsewhere) that commits whichever card is now closest to
//     center as the real selection via selectListing(), so map/marker
//     state follows the wheel the same way it follows a click.
// ---------------------------------------------------------------------
let wheelObserver = null;
let wheelVisibleCards = new Set();
let wheelRafId = null;
let wheelLastScrollAt = 0;
let wheelSettleTimer = null;
let wheelScrollHandler = null;
let wheelScrollendHandler = null;
let wheelKeydownHandler = null;
const WHEEL_HAS_SCROLLEND = 'onscrollend' in window;

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function teardownWheel() {
  if (wheelObserver) { wheelObserver.disconnect(); wheelObserver = null; }
  if (wheelRafId) { cancelAnimationFrame(wheelRafId); wheelRafId = null; }
  clearTimeout(wheelSettleTimer);
  const cardListEl = document.getElementById('cardList');
  if (cardListEl) {
    if (wheelScrollHandler) cardListEl.removeEventListener('scroll', wheelScrollHandler);
    if (wheelScrollendHandler) cardListEl.removeEventListener('scrollend', wheelScrollendHandler);
    if (wheelKeydownHandler) cardListEl.removeEventListener('keydown', wheelKeydownHandler);
  }
  wheelVisibleCards = new Set();
}

function styleWheelCard(el, container) {
  const cRect = container.getBoundingClientRect();
  const eRect = el.getBoundingClientRect();
  const centerDist = Math.abs((eRect.top + eRect.height / 2) - (cRect.top + cRect.height / 2));
  const maxDist = cRect.height / 2 + eRect.height / 2;
  const t = Math.min(1, centerDist / Math.max(1, maxDist));
  el.style.transform = `scale(${(1 - t * 0.14).toFixed(3)})`;
  el.style.opacity = (1 - t * 0.55).toFixed(3);
}

function commitWheelSettle(container) {
  if (!wheelVisibleCards.size) return;
  const cRect = container.getBoundingClientRect();
  const centerY = cRect.top + cRect.height / 2;
  let closest = null;
  let closestDist = Infinity;
  wheelVisibleCards.forEach(el => {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.height / 2) - centerY);
    if (d < closestDist) { closestDist = d; closest = el; }
  });
  if (!closest) return;
  if (closest.dataset.id !== activeId) {
    selectListing(closest.dataset.id, { scrollList: false });
  } else {
    styleWheelCard(closest, container);
  }
}

function wireWheel(container, list) {
  teardownWheel();

  // Spacer height = half the container's own height minus half a real
  // card's rendered height, so the FIRST and LAST cards can still reach
  // dead-center when snapped -- measured live off the actual rendered
  // card rather than a hardcoded constant, so this never drifts out of
  // sync with the CSS breakpoint heights above.
  const firstCard = container.querySelector('.listing-card');
  const spacerTop = document.getElementById('wheelSpacerTop');
  const spacerBottom = document.getElementById('wheelSpacerBottom');
  if (firstCard && spacerTop && spacerBottom) {
    const cardOuterHeight = firstCard.getBoundingClientRect().height +
      parseFloat(getComputedStyle(firstCard).marginBlockStart) +
      parseFloat(getComputedStyle(firstCard).marginBlockEnd);
    const spacerHeight = Math.max(0, (container.clientHeight - cardOuterHeight) / 2);
    spacerTop.style.height = spacerBottom.style.height = spacerHeight + 'px';
  }

  container.setAttribute('role', 'listbox');
  container.setAttribute('aria-label', tr('map.pageTitle', 'Kurdistan Region Listings'));
  container.setAttribute('tabindex', '0');
  document.querySelectorAll('.listing-card').forEach(el => { el.id = 'wheel-card-' + el.dataset.id; });

  wheelObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) wheelVisibleCards.add(entry.target);
      else wheelVisibleCards.delete(entry.target);
    });
  }, { root: container, threshold: 0 });
  container.querySelectorAll('.listing-card').forEach(el => wheelObserver.observe(el));

  // Instant initial positioning (no smooth-scroll animation on a fresh
  // render/filter change -- that's a re-render, not a user gesture) plus
  // one synchronous style pass so cards look correct before any scroll
  // event has ever fired.
  const activeCardEl = document.querySelector(`.listing-card[data-id="${activeId}"]`);
  if (activeCardEl) activeCardEl.scrollIntoView({ behavior: 'auto', block: 'center' });
  wheelVisibleCards.forEach(el => styleWheelCard(el, container));
  if (!wheelVisibleCards.size) container.querySelectorAll('.listing-card').forEach(el => styleWheelCard(el, container));

  const reduced = prefersReducedMotion();

  wheelScrollHandler = () => {
    wheelLastScrollAt = performance.now();
    if (!reduced && wheelRafId == null) {
      wheelRafId = requestAnimationFrame(function tick() {
        wheelVisibleCards.forEach(el => styleWheelCard(el, container));
        if (performance.now() - wheelLastScrollAt < 120) {
          wheelRafId = requestAnimationFrame(tick);
        } else {
          wheelRafId = null;
        }
      });
    }
    if (!WHEEL_HAS_SCROLLEND) {
      clearTimeout(wheelSettleTimer);
      wheelSettleTimer = setTimeout(() => commitWheelSettle(container), 140);
    }
  };
  container.addEventListener('scroll', wheelScrollHandler, { passive: true });

  if (WHEEL_HAS_SCROLLEND) {
    wheelScrollendHandler = () => commitWheelSettle(container);
    container.addEventListener('scrollend', wheelScrollendHandler);
  }

  // Keyboard: usable with zero gestures. Up/Down move one property at a
  // time, Page Up/Down jump by ~3 (a "page" of the wheel) -- both move
  // through the SAME filteredListings() order the wheel itself renders,
  // never trapping focus (Tab still leaves the widget normally).
  wheelKeydownHandler = (e) => {
    const key = e.key;
    if (!['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown'].includes(key)) return;
    e.preventDefault();
    const ids = list.map(l => l.id);
    const idx = ids.indexOf(activeId);
    const step = (key === 'PageUp' || key === 'PageDown') ? 3 : 1;
    const dir = (key === 'ArrowDown' || key === 'PageDown') ? 1 : -1;
    const nextIdx = Math.max(0, Math.min(ids.length - 1, (idx === -1 ? 0 : idx) + dir * step));
    selectListing(ids[nextIdx], { scrollList: true });
  };
  container.addEventListener('keydown', wheelKeydownHandler);
}

window.addEventListener('resize', () => {
  const container = document.getElementById('cardList');
  const spacerTop = document.getElementById('wheelSpacerTop');
  if (!container || !spacerTop) return;
  const firstCard = container.querySelector('.listing-card');
  const spacerBottom = document.getElementById('wheelSpacerBottom');
  if (!firstCard) return;
  const cardOuterHeight = firstCard.getBoundingClientRect().height +
    parseFloat(getComputedStyle(firstCard).marginBlockStart) +
    parseFloat(getComputedStyle(firstCard).marginBlockEnd);
  const spacerHeight = Math.max(0, (container.clientHeight - cardOuterHeight) / 2);
  spacerTop.style.height = spacerBottom.style.height = spacerHeight + 'px';
});

function refresh() {
  buildMarkers();
  renderList();
}

// ---------------------------------------------------------------------
// Filter dropdowns (Price / Beds & Baths / Home Type) — each toggle
// button opens its own popover menu; Apply commits the values into the
// module-level filter state and re-filters, Clear resets that one
// filter. Only one menu is open at a time, and clicking outside closes
// whichever is open.
// ---------------------------------------------------------------------
function closeAllFilterMenus() {
  document.querySelectorAll('.filter-dropdown-menu').forEach(m => m.classList.add('hidden'));
}
document.querySelectorAll('.filter-dropdown-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const menu = btn.nextElementSibling;
    const wasHidden = menu.classList.contains('hidden');
    closeAllFilterMenus();
    if (wasHidden) {
      // Fixed positioning (set here, computed from the button's live
      // location) so the menu isn't clipped by the filter bar's
      // horizontal scroll container — that ancestor has overflow-x:
      // auto, which some browsers also clip vertical overflow for.
      menu.classList.remove('hidden');
      const rect = btn.getBoundingClientRect();
      menu.style.top = (rect.bottom + 8) + 'px';
      menu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
    }
  });
});
document.querySelectorAll('.filter-dropdown-menu').forEach(menu => {
  menu.addEventListener('click', (e) => e.stopPropagation());
});
document.addEventListener('click', closeAllFilterMenus);

document.getElementById('priceApplyBtn').addEventListener('click', () => {
  const minVal = document.getElementById('priceMinInput').value;
  const maxVal = document.getElementById('priceMaxInput').value;
  priceMin = minVal !== '' ? Number(minVal) : null;
  priceMax = maxVal !== '' ? Number(maxVal) : null;
  document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  closeAllFilterMenus();
  refresh();
});
document.getElementById('priceClearBtn').addEventListener('click', () => {
  priceMin = null; priceMax = null;
  document.getElementById('priceMinInput').value = '';
  document.getElementById('priceMaxInput').value = '';
  document.getElementById('priceFilterBtn').classList.remove('active');
  closeAllFilterMenus();
  refresh();
});

document.getElementById('bedsApplyBtn').addEventListener('click', () => {
  bedsMin = Number(document.getElementById('bedsMinSelect').value);
  bathsMin = Number(document.getElementById('bathsMinSelect').value);
  document.getElementById('bedsFilterBtn').classList.toggle('active', bedsMin > 0 || bathsMin > 0);
  closeAllFilterMenus();
  refresh();
});
document.getElementById('bedsClearBtn').addEventListener('click', () => {
  bedsMin = 0; bathsMin = 0;
  document.getElementById('bedsMinSelect').value = '0';
  document.getElementById('bathsMinSelect').value = '0';
  document.getElementById('bedsFilterBtn').classList.remove('active');
  closeAllFilterMenus();
  refresh();
});

document.getElementById('homeTypeApplyBtn').addEventListener('click', () => {
  selectedHomeTypes = new Set(
    Array.from(document.querySelectorAll('.home-type-check:checked')).map(cb => cb.value)
  );
  document.getElementById('homeTypeFilterBtn').classList.toggle('active', selectedHomeTypes.size > 0);
  closeAllFilterMenus();
  refresh();
});
document.getElementById('homeTypeClearBtn').addEventListener('click', () => {
  selectedHomeTypes = new Set();
  document.querySelectorAll('.home-type-check').forEach(cb => { cb.checked = false; });
  document.getElementById('homeTypeFilterBtn').classList.remove('active');
  closeAllFilterMenus();
  refresh();
});

document.querySelectorAll('.type-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    activeType = btn.dataset.typeFilter;
    document.querySelectorAll('.type-toggle').forEach(b => {
      b.classList.remove('bg-primary', 'text-on-primary');
      b.classList.add('text-on-surface-variant');
    });
    btn.classList.add('bg-primary', 'text-on-primary');
    btn.classList.remove('text-on-surface-variant');
    refresh();
  });
});
document.getElementById('citySearch').addEventListener('input', refresh);

const viewToggle = document.getElementById('viewToggle');
const listPanel = document.getElementById('listPanel');
const mapPanel = document.getElementById('mapPanel');
let mobileView = 'map';
viewToggle.addEventListener('click', () => {
  mobileView = mobileView === 'map' ? 'list' : 'map';
  if (mobileView === 'list') {
    listPanel.classList.remove('hidden');
    mapPanel.classList.add('hidden');
    document.getElementById('viewToggleLabel').textContent = 'Map';
    viewToggle.querySelector('.material-symbols-outlined').textContent = 'map';
  } else {
    listPanel.classList.add('hidden');
    mapPanel.classList.remove('hidden');
    document.getElementById('viewToggleLabel').textContent = 'List';
    viewToggle.querySelector('.material-symbols-outlined').textContent = 'format_list_bulleted';
    setTimeout(() => map.invalidateSize(), 200);
  }
});

const drawSearchBtn = document.getElementById('drawSearchBtn');
const clearSearchAreaBtn = document.getElementById('clearSearchAreaBtn');
const mapEl = document.getElementById('map');

function setDrawMode(on) {
  drawMode = on;
  mapEl.classList.toggle('draw-mode', drawMode);
  drawSearchBtn.classList.toggle('active', drawMode);
  if (drawMode) {
    map.dragging.disable();
    showToast('Drag on the map to draw a search area', 'edit');
  } else {
    map.dragging.enable();
  }
}

drawSearchBtn.addEventListener('click', () => setDrawMode(!drawMode));

function startDraw(latlng) {
  if (!drawMode) return;
  drawStart = latlng;
  if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
  searchCircle = L.circle(drawStart, {
    radius: 1,
    color: '#8E7448',
    weight: 2,
    dashArray: '6 4',
    fillColor: '#B89A63',
    fillOpacity: 0.2
  }).addTo(map);
}

function moveDraw(latlng) {
  if (!drawMode || !drawStart || !searchCircle) return;
  searchCircle.setRadius(drawStart.distanceTo(latlng));
}

function endDraw() {
  if (!drawMode || !drawStart) return;
  drawStart = null;
  setDrawMode(false);
  if (searchCircle && searchCircle.getRadius() < 500) {
    map.removeLayer(searchCircle);
    searchCircle = null;
    showToast('Search area too small — try again', 'close');
    return;
  }
  if (searchCircle) {
    clearSearchAreaBtn.style.display = 'flex';
    showToast('Search area applied', 'check_circle');
    refresh();
  }
}

map.on('mousedown', (e) => startDraw(e.latlng));
map.on('mousemove', (e) => moveDraw(e.latlng));
map.on('mouseup', endDraw);

// Leaflet's map only synthesizes mouse events from simple taps, not
// touch-drags — without these, drawing a search circle never worked
// on phones/tablets since map.dragging.disable() (needed so the drag
// draws instead of panning) leaves nothing else listening to touch.
function touchToLatLng(e) {
  const touch = e.touches[0] || e.changedTouches[0];
  return touch ? map.mouseEventToLatLng(touch) : null;
}
mapEl.addEventListener('touchstart', (e) => {
  if (!drawMode) return;
  e.preventDefault();
  const latlng = touchToLatLng(e);
  if (latlng) startDraw(latlng);
}, { passive: false });
mapEl.addEventListener('touchmove', (e) => {
  if (!drawMode || !drawStart) return;
  e.preventDefault();
  const latlng = touchToLatLng(e);
  if (latlng) moveDraw(latlng);
}, { passive: false });
mapEl.addEventListener('touchend', (e) => {
  if (!drawMode || !drawStart) return;
  e.preventDefault();
  endDraw();
}, { passive: false });

clearSearchAreaBtn.addEventListener('click', () => {
  if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
  clearSearchAreaBtn.style.display = 'none';
  showToast('Search area cleared', 'close');
  refresh();
});

let myLocationMarker = null;
document.getElementById('myLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast('Location services are not available on this device', 'location_off');
    return;
  }
  showToast('Finding your location…', 'my_location');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 13);
      if (myLocationMarker) map.removeLayer(myLocationMarker);
      myLocationMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({
          className: '',
          html: `<div style="width:16px;height:16px;border-radius:999px;background:#4f6073;border:3px solid #fff;box-shadow:0 0 0 4px rgba(79,96,115,0.3);"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        })
      }).addTo(map);
      showToast('Location found', 'check_circle');
    },
    () => showToast('Could not access your location — check permissions', 'location_off'),
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

// A price marker's popup reuses the same card markup as the list view,
// including its Request Viewing button — but that button only gets its
// click handler wired up once the popup's content is actually in the
// DOM (Leaflet builds it lazily on open), so it's wired here instead of
// in renderList().
map.on('popupopen', (e) => {
  const el = e.popup.getElement();
  if (!el) return;
  el.querySelectorAll('.request-viewing-btn').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      map.closePopup();
      openViewingModal(btn.dataset.id);
    });
  });
});

// ---------------------------------------------------------------------
// Administrative area boundaries — real OpenStreetMap district/city
// boundary lines (admin_level=8), drawn once in dark red with the area
// name always visible. Live data from Overpass, same public API already
// used for nearby-amenities lookups elsewhere on this site. A city with
// no boundary data in OSM is simply skipped — no fabricated outline is
// drawn in its place.
// ---------------------------------------------------------------------
const KNOWN_CITY_NAMES = Object.keys(CITY_CENTERS);

function isKnownCityBoundary(tags) {
  const name = (tags && (tags.name || tags['name:en'])) || '';
  return KNOWN_CITY_NAMES.some(c => name.toLowerCase() === c.toLowerCase());
}

function ringFromGeometry(geometry) {
  return (geometry || []).map(pt => [pt.lat, pt.lon]);
}

function drawBoundaryShape(coords, label, labelLatLng) {
  if (coords.length < 2) return;
  const isClosedRing = coords.length > 2 &&
    Math.abs(coords[0][0] - coords[coords.length - 1][0]) < 1e-6 &&
    Math.abs(coords[0][1] - coords[coords.length - 1][1]) < 1e-6;
  const shape = isClosedRing
    ? L.polygon(coords, { color: '#8b0000', weight: 2.5, opacity: 0.85, fillColor: '#8b0000', fillOpacity: 0.05 })
    : L.polyline(coords, { color: '#8b0000', weight: 2.5, opacity: 0.85, dashArray: '6 4' });
  shape.addTo(map);
  adminBoundaryLayers.push(shape);
  if (label && labelLatLng) {
    const labelMarker = L.marker(labelLatLng, {
      icon: L.divIcon({ className: '', html: `<div class="admin-boundary-label">${label}</div>`, iconSize: null, iconAnchor: [0, 0] }),
      interactive: false
    });
    labelMarker.addTo(map);
    adminBoundaryLayers.push(labelMarker);
  }
}

let adminBoundaryLayers = [];

async function loadAdminBoundaries() {
  // One bounding box wide enough to cover every known city, so this is
  // a single Overpass call rather than one per city.
  const bbox = '34.9,42.0,37.5,46.2';
  const query = `[out:json][timeout:25];(way["boundary"="administrative"]["admin_level"="8"](${bbox});relation["boundary"="administrative"]["admin_level"="8"](${bbox}););out geom;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    if (!res.ok) return;
    const data = await res.json();
    (data.elements || []).forEach(el => {
      if (!isKnownCityBoundary(el.tags)) return;
      const label = el.tags.name || el.tags['name:en'];
      if (el.type === 'way' && el.geometry) {
        const coords = ringFromGeometry(el.geometry);
        const mid = coords[Math.floor(coords.length / 2)];
        drawBoundaryShape(coords, label, mid);
      } else if (el.type === 'relation' && el.members) {
        let labelPlaced = false;
        el.members.forEach(m => {
          if (m.type !== 'way' || m.role !== 'outer' || !m.geometry) return;
          const coords = ringFromGeometry(m.geometry);
          const mid = coords[Math.floor(coords.length / 2)];
          drawBoundaryShape(coords, labelPlaced ? null : label, labelPlaced ? null : mid);
          labelPlaced = true;
        });
      }
    });
  } catch (e) {
    // Overpass unreachable or slow — the map still works fine without
    // boundary overlays, so fail silently rather than surface an error
    // for a purely decorative layer.
  }
}
loadAdminBoundaries();

// Arriving via any "browse this city" link (?city=) should show every
// deal type for that city — sale and rent —
// not just the default For Sale view, since the point of that nav is to
// see everything available there, not just what's for sale.
//
// ?type=rent / ?type=sale are the shared header/mobile nav's global Buy
// and Rent actions landing directly in the matching mode (see
// js/site-header.js) -- 'sale' needs no branch here since it's already
// this page's own default state.
function setActiveTypeFromUrl(type) {
  activeType = type;
  document.querySelectorAll('.type-toggle').forEach(b => {
    b.classList.remove('bg-primary', 'text-on-primary');
    b.classList.add('text-on-surface-variant');
  });
  const btn = document.querySelector('.type-toggle[data-type-filter="' + type + '"]');
  if (btn) {
    btn.classList.add('bg-primary', 'text-on-primary');
    btn.classList.remove('text-on-surface-variant');
  }
}
const urlParams = new URLSearchParams(window.location.search);
const urlCity = urlParams.get('city');
const urlType = urlParams.get('type');
if (urlCity) {
  document.getElementById('citySearch').value = urlCity;
}
if (urlType === 'all' || urlCity) {
  setActiveTypeFromUrl('all');
} else if (urlType === 'rent') {
  setActiveTypeFromUrl('rent');
}

// ---------------------------------------------------------------------
// MAM AI hook (js/mam-properties-map.js). The ONE way the AI module is
// allowed to touch this page's real search state -- it never re-
// implements filtering itself, it only ever calls this with the exact
// filter keys backend/app/mam/orchestrator.py's _search_filters_action
// and Tools.open_on_map both already use (deal/q/types/minPrice/maxPrice/beds) to
// translate a resolved tool call's OWN real arguments -- so the filters
// applied here always match the cards MAM's reply already showed.
// ---------------------------------------------------------------------
function applyAiFilters(filters) {
  if (!filters || typeof filters !== 'object') return;
  if (filters.deal === 'rent') setActiveTypeFromUrl('rent');
  if (typeof filters.q === 'string' && filters.q) {
    document.getElementById('citySearch').value = filters.q;
  }
  if (Array.isArray(filters.types) && filters.types.length) {
    selectedHomeTypes = new Set(filters.types.filter((t) => typeof t === 'string' && t));
    document.querySelectorAll('.home-type-check').forEach((cb) => { cb.checked = selectedHomeTypes.has(cb.value); });
    document.getElementById('homeTypeFilterBtn').classList.toggle('active', selectedHomeTypes.size > 0);
  }
  if (filters.minPrice !== undefined) {
    priceMin = Number(filters.minPrice) || null;
    document.getElementById('priceMinInput').value = priceMin || '';
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  }
  if (filters.maxPrice !== undefined) {
    priceMax = Number(filters.maxPrice) || null;
    document.getElementById('priceMaxInput').value = priceMax || '';
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMin !== null || priceMax !== null);
  }
  if (filters.beds !== undefined) {
    bedsMin = Number(filters.beds) || 0;
    document.getElementById('bedsMinSelect').value = String(bedsMin);
    document.getElementById('bedsFilterBtn').classList.toggle('active', bedsMin > 0 || bathsMin > 0);
  }
  refresh();
  document.dispatchEvent(new CustomEvent('darwesh:mam-ai-filters-applied'));
}
window.DarweshPropertiesMap = {
  applyFilters: applyAiFilters,
  // MAM identifying/selecting a specific property (mapAction.
  // focusListingId) centers it in the SAME wheel/map -- never a second,
  // MAM-only card competing with these real ones. A no-op if the id
  // isn't in the current filtered set (e.g. MAM's own filters haven't
  // been applied yet); applyAiFilters already re-renders the wheel
  // before this would ever be called for a fresh search result.
  focusListing: (id) => {
    if (!id || !listingsLoaded) return;
    if (!filteredListings().some(l => l.id === id)) return;
    selectListing(id, { scrollList: true });
  },
  getState: () => ({ activeType, city: document.getElementById('citySearch').value, priceMin, priceMax, bedsMin, bathsMin, types: [...selectedHomeTypes] }),
  getVisibleCount: () => (listingsLoaded ? filteredListings().length : null),
  isReady: () => listingsLoaded,
};

refresh();
document.addEventListener('darwesh:langchange', refresh);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 100);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 600);
