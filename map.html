const map = L.map('map', { zoomControl: false, maxZoom: MAX_MAP_ZOOM }).setView([36.35, 44.3], 8);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: MAX_MAP_ZOOM
}).addTo(map);

function isPrivateHidden(l) {
  return !!l.private && !revealed.has(l.id);
}

// Fixed, publicly-known city centers — the same point a city label would
// sit on. Never derived from any listing's real coordinates, so a badge
// placed here carries no information about where a specific property is.
const CITY_CENTERS = {
  "Erbil": [36.1911, 44.0093],
  "Sulaymaniyah": [35.5608, 45.4347],
  "Duhok": [36.8642, 42.9903],
  "Zakho": [37.1450, 42.6829],
  "Soran": [36.6500, 44.5450],
  "Koya": [36.0750, 44.6200]
};

function priceIcon(listing, active) {
  return L.divIcon({
    className: '',
    html: `<div class="price-pin${active ? ' active' : ''}" data-id="${listing.id}">${listing.priceLabel}</div>`,
    iconSize: null,
    iconAnchor: [30, 15]
  });
}

function cityBadgeIcon(count) {
  return L.divIcon({
    className: '',
    html: `<div class="private-city-badge"><span class="material-symbols-outlined text-[14px]">lock</span><span>${count} Private</span></div>`,
    iconSize: null,
    iconAnchor: [20, 14]
  });
}

function buildMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  // Private listings that haven't been revealed never get an individual
  // pin — no marker, no circle, nothing tied to their real coordinates.
  // Instead they're rolled up into one badge per city, sitting on that
  // city's public center point, so the map never points at a specific
  // building for a hidden listing, only says "some are somewhere in here."
  const hiddenByCity = {};
  LISTINGS.forEach(l => {
    if (isPrivateHidden(l)) {
      hiddenByCity[l.city] = (hiddenByCity[l.city] || 0) + 1;
      return;
    }
    const marker = L.marker([l.lat, l.lng], { icon: priceIcon(l, l.id === activeId) });
    marker.on('click', () => selectListing(l.id, true));
    marker.addTo(map);
    markers[l.id] = marker;
  });
  Object.entries(hiddenByCity).forEach(([city, count]) => {
    const center = CITY_CENTERS[city];
    if (!center) return;
    const badge = L.marker(center, { icon: cityBadgeIcon(count) });
    badge.on('click', () => {
      document.getElementById('citySearch').value = city;
      refresh();
      showToast(`${count} private listing${count > 1 ? 's' : ''} in ${city} — see the list`, 'lock');
    });
    badge.addTo(map);
    markers['city-' + city] = badge;
  });
}

function filteredListings() {
  const q = document.getElementById('citySearch').value.trim().toLowerCase();
  return LISTINGS.filter(l => {
    const typeMatch = activeType === 'all' || l.type === activeType;
    const qMatch = !q || l.city.toLowerCase().includes(q) || l.address.toLowerCase().includes(q);
    const areaMatch = !searchCircle || L.latLng(l.lat, l.lng).distanceTo(searchCircle.getLatLng()) <= searchCircle.getRadius();
    return typeMatch && qMatch && areaMatch;
  });
}

function card(l) {
  const hidden = isPrivateHidden(l);
  const badge = l.verified ? `<div class="absolute top-3 right-3 bg-tertiary-container/90 backdrop-blur-sm text-on-tertiary-container px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
      <span class="material-symbols-outlined text-[14px]">verified</span>
      <span class="font-label-caps text-label-caps text-[10px]">Verified</span>
    </div>` : '';
  const trustBar = l.verified ? `<div class="flex items-center gap-1.5 px-3 py-1.5 bg-tertiary-container/30 border-t border-outline-variant">
      <span class="material-symbols-outlined text-[14px] text-on-tertiary-container">verified_user</span>
      <span class="font-label-caps text-label-caps text-[10px] text-on-tertiary-container">Verified by Darwesh Group</span>
    </div>` : '';

  const imageBlock = hidden ? `
    <div class="relative h-40 w-full overflow-hidden">
      <img class="w-full h-full object-cover blur-md scale-110" src="${l.img}"/>
      <div class="absolute inset-0 bg-primary/55 flex flex-col items-center justify-center gap-1 text-on-primary">
        <span class="material-symbols-outlined text-[26px]">lock</span>
        <span class="font-label-caps text-label-caps text-[11px]">Location Hidden</span>
      </div>
      <div class="absolute bottom-3 left-3 bg-primary/80 text-on-primary px-2 py-1 rounded-full font-label-caps text-label-caps text-[10px]">${l.type === 'sale' ? 'For Sale' : 'For Rent'}</div>
    </div>` : `
    <div class="relative h-40 w-full overflow-hidden">
      <img class="w-full h-full object-cover" src="${l.img}"/>
      ${badge}
      <div class="absolute bottom-3 left-3 bg-primary/80 text-on-primary px-2 py-1 rounded-full font-label-caps text-label-caps text-[10px]">${l.type === 'sale' ? 'For Sale' : 'For Rent'}</div>
    </div>`;

  const addressLine = hidden
    ? `<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 text-[13px]"><span class="material-symbols-outlined text-[15px]">location_on</span>Approximate area &middot; ${l.city}</p>`
    : `<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 text-[13px]"><span class="material-symbols-outlined text-[15px]">location_on</span>${l.address}, ${l.city}</p>`;

  const actions = hidden ? `
    <div class="flex gap-2 mt-3">
      <button data-id="${l.id}" class="request-viewing-btn flex-1 border border-outline-variant rounded-full py-1.5 font-label-caps text-label-caps text-on-surface hover:bg-surface-container transition-colors">Request Viewing</button>
      <button data-id="${l.id}" class="reveal-location-btn flex-1 bg-secondary text-on-secondary rounded-full py-1.5 font-label-caps text-label-caps hover:bg-secondary-container hover:text-on-secondary-container transition-colors">Exact Location</button>
    </div>` : `
    <div class="mt-3">
      <button data-id="${l.id}" class="request-viewing-btn w-full border border-outline-variant rounded-full py-1.5 font-label-caps text-label-caps text-on-surface hover:bg-surface-container transition-colors">Request Viewing</button>
    </div>`;

  return `
  <article data-id="${l.id}" class="listing-card${l.id === activeId ? ' active' : ''} cursor-pointer flex-none bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant hover:shadow-[0_4px_20px_rgba(26,43,60,0.08)] transition-all relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1 bg-secondary z-20"></div>
    ${imageBlock}
    <div class="p-3">
      <p class="font-headline-md text-[18px] text-primary mb-1">${hidden ? 'Price on request' : l.priceLabel}</p>
      <div class="flex gap-3 mb-2">
        <span class="font-data-mono text-data-mono text-on-surface flex items-center gap-1 text-[13px]"><span class="material-symbols-outlined text-[15px] text-outline">bed</span>${l.beds}</span>
        <span class="font-data-mono text-data-mono text-on-surface flex items-center gap-1 text-[13px]"><span class="material-symbols-outlined text-[15px] text-outline">bathtub</span>${l.baths}</span>
        <span class="font-data-mono text-data-mono text-on-surface flex items-center gap-1 text-[13px]"><span class="material-symbols-outlined text-[15px] text-outline">square_foot</span>${l.sqft}m²</span>
      </div>
      ${addressLine}
      ${actions}
    </div>
    ${trustBar}
  </article>`;
}

function renderList() {
  const list = filteredListings();
  document.getElementById('cardList').innerHTML = list.map(card).join('');
  document.querySelectorAll('.listing-card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      selectListing(Number(el.dataset.id), false);
    });
  });
  document.querySelectorAll('.request-viewing-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      showToast('Viewing request sent — an agent will contact you within 24 hours', 'event_available');
    });
  });
  document.querySelectorAll('.reveal-location-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      revealListing(Number(btn.dataset.id));
    });
  });
  document.getElementById('resultCount').textContent = `${list.length} homes in Kurdistan Region`;
  document.getElementById('resultCountMobile').textContent = `${list.length} homes found`;
}

function revealListing(id) {
  if (revealed.has(id)) return;
  revealed.add(id);
  showToast('Exact location unlocked', 'lock_open');
  refresh();
  selectListing(id, false);
}

function selectListing(id, fromMap) {
  activeId = id;
  const l = LISTINGS.find(x => x.id === id);
  document.querySelectorAll('.listing-card').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === id);
  });
  Object.entries(markers).forEach(([mid, marker]) => {
    if (!(marker instanceof L.Marker)) return;
    const listing = LISTINGS.find(x => x.id == mid);
    if (!listing) return;
    marker.setIcon(priceIcon(listing, Number(mid) === id));
  });
  if (l) {
    // Never move the camera toward a hidden private listing's real
    // coordinates — the map simply doesn't react to it until revealed.
    if (!isPrivateHidden(l)) {
      map.panTo([l.lat, l.lng]);
    }
    if (!fromMap) {
      const cardEl = document.querySelector(`.listing-card[data-id="${id}"]`);
      if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
}

function refresh() {
  buildMarkers();
  renderList();
}

document.querySelectorAll('.type-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    activeType = btn.dataset.typeFilter;
    document.querySelectorAll('.type-toggle').forEach(b => {
      b.classList.remove('bg-primary', 'text-on-primary');
      b.classList.add('text-on-surface-variant');
    });
    btn.classList.add('bg-primary', 'text-on-primary');
    btn.classList.remove('text-on-surface-variant');
    refresh();
  });
});
document.getElementById('citySearch').addEventListener('input', refresh);

const viewToggle = document.getElementById('viewToggle');
const listPanel = document.getElementById('listPanel');
const mapPanel = document.getElementById('mapPanel');
let mobileView = 'map';
viewToggle.addEventListener('click', () => {
  mobileView = mobileView === 'map' ? 'list' : 'map';
  if (mobileView === 'list') {
    listPanel.classList.remove('hidden');
    mapPanel.classList.add('hidden');
    document.getElementById('viewToggleLabel').textContent = 'Map';
    viewToggle.querySelector('.material-symbols-outlined').textContent = 'map';
  } else {
    listPanel.classList.add('hidden');
    mapPanel.classList.remove('hidden');
    document.getElementById('viewToggleLabel').textContent = 'List';
    viewToggle.querySelector('.material-symbols-outlined').textContent = 'format_list_bulleted';
    setTimeout(() => map.invalidateSize(), 200);
  }
});

const drawSearchBtn = document.getElementById('drawSearchBtn');
const clearSearchAreaBtn = document.getElementById('clearSearchAreaBtn');
const mapEl = document.getElementById('map');

function setDrawMode(on) {
  drawMode = on;
  mapEl.classList.toggle('draw-mode', drawMode);
  drawSearchBtn.classList.toggle('bg-primary', drawMode);
  drawSearchBtn.classList.toggle('text-on-primary', drawMode);
  if (drawMode) {
    map.dragging.disable();
    showToast('Drag on the map to draw a search area', 'edit');
  } else {
    map.dragging.enable();
  }
}

drawSearchBtn.addEventListener('click', () => setDrawMode(!drawMode));

map.on('mousedown', (e) => {
  if (!drawMode) return;
  drawStart = e.latlng;
  if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
  searchCircle = L.circle(drawStart, {
    radius: 1,
    color: '#775a19',
    weight: 2,
    dashArray: '6 4',
    fillColor: '#e9c176',
    fillOpacity: 0.2
  }).addTo(map);
});

map.on('mousemove', (e) => {
  if (!drawMode || !drawStart || !searchCircle) return;
  searchCircle.setRadius(drawStart.distanceTo(e.latlng));
});

map.on('mouseup', () => {
  if (!drawMode || !drawStart) return;
  drawStart = null;
  setDrawMode(false);
  if (searchCircle && searchCircle.getRadius() < 500) {
    map.removeLayer(searchCircle);
    searchCircle = null;
    showToast('Search area too small — try again', 'close');
    return;
  }
  if (searchCircle) {
    clearSearchAreaBtn.classList.remove('hidden');
    showToast('Search area applied', 'check_circle');
    refresh();
  }
});

clearSearchAreaBtn.addEventListener('click', () => {
  if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
  clearSearchAreaBtn.classList.add('hidden');
  showToast('Search area cleared', 'close');
  refresh();
});

let myLocationMarker = null;
document.getElementById('myLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast('Location services are not available on this device', 'location_off');
    return;
  }
  showToast('Finding your location…', 'my_location');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 13);
      if (myLocationMarker) map.removeLayer(myLocationMarker);
      myLocationMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({
          className: '',
          html: `<div style="width:16px;height:16px;border-radius:999px;background:#4f6073;border:3px solid #fff;box-shadow:0 0 0 4px rgba(79,96,115,0.3);"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        })
      }).addTo(map);
      showToast('Location found', 'check_circle');
    },
    () => showToast('Could not access your location — check permissions', 'location_off'),
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

refresh();
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 100);
setTimeout(() => { layoutMain(); map.invalidateSize(); }, 600);
</script>
</body></html>
