<!DOCTYPE html>

<meta charset="utf-8"/>
<!-- CLIENT-04 (CLIENT_SIDE_SECURITY_REVIEW.md): meta-delivered CSP. GitHub Pages
can't set HTTP headers, so this is the only delivery mechanism available.
unsafe-inline on script and style sources is a deliberate, documented
tradeoff: this codebase has no build step and dozens of inline script/style
blocks per page; blocking them needs a nonce (impossible with no per-request
server logic) or a SHA-256 hash per block kept in lockstep with every future
edit across 21 pages, a real ongoing cost not taken on here. What this DOES
still provide: an injected payload (e.g. CLIENT-01/02, both since fixed) can
no longer load a script from an attacker-controlled domain or exfiltrate data
via fetch or img to one. Note: frame-ancestors, report-uri, and sandbox are
silently ignored when CSP is delivered via a meta tag (a browser spec rule,
not an oversight here); this can never provide clickjacking protection or
violation reporting. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://darwesh-backend-353477435585.me-central1.run.app https://overpass-api.de https://nominatim.openstreetmap.org https://www.google.com https://*.ingest.sentry.io; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"/>

</a>

<!-- Distinct from emptyState: the query itself failed (network/Firestore),
     not "zero real listings matched" -- previously both cases silently
     collapsed into the exact same "No properties match your search"
     copy, with no way for a real user (or a support agent looking over
     their shoulder) to tell a genuine empty result apart from a broken
     fetch, and no retry affordance either way. -->
<div id="buyErrorState" class="hidden text-center py-stack-lg">
<p class="font-body-md text-body-md text-on-surface-variant mb-3" data-i18n="buy.loadError">Couldn't load listings. Please check your connection and try again.</p>

</div>

<div class="buy-toast" id="buyToast"></div>
</main>

<!-- BottomNavBar (Mobile Only) -->
<script>
const IMAGES = {
  villa: "https://lh3.googleusercontent.com/aida-public/AB6AXuCadS8UKt5hw5G1f_11HN8IvXcjYIZjWdPEERcDXd7KlV6jDQi57D0dt008Ie6vDXaNmO7hrcfiT7OzbLSUzfuCV_ENwWUyEtSuVhmETPfWffweOLgJjF_j3dEu3dINZDVR0ECA1sBUvdWi0ndRERfu2XwOKvFh_0UXtXFvpWNHnBWZSsNKrcoWexb74a4iFiK1IYboC_Ply436SLbKtrliX0ysrJ3K-rI6YstSyhy-xkAb0zjfwVy8",
  office: "https://lh3.googleusercontent.com/aida-public/AB6AXuDs7uRtP1wPjHeH8O6ZujWse4l9HjMt-6w9Q9P1ncr1PPhRw2ebXVPRkUnwLkqAk-DbyBUFjgvUEFWSiPyhDR4QnmPtoRI5aB8S_BpEzqMYUUHbU1xcBsULFrdpD1JA21p4e8hlxPBXS8ovBoaGYL2ihSjRJhspv_nN06GICbhH4Fojz4U9z4OMsRUJKwiUbLPc3Z5rhs618RinH5AQU53UkPtMapT0-Q3J5qHjpSjOthmZnuQ8gw1Z",
  apartment: "https://lh3.googleusercontent.com/aida-public/AB6AXuDii6xTkNXKTsc2msOvTgk_GQRcMSy050_Dub19-3hbsr_7hP2rG706xznOp3AeUptsrkRFQRdDAyRVv34ZC0SUkPNGIL-UJT7JD0cy09YlNtODFbsnXaEF8zJd8aCvsZTCEWBKPj1XViF2xaNk4S5ik9wCMk8rl0kk9lg4Fo1HxPTg6ko3xaad2_K6da2mIldQlUkjAAy1sB7EUWp2DDwZ3zv679mzelRkHr4tPHRSXmBA6Aq8Vhjs",
  land: "https://lh3.googleusercontent.com/aida-public/AB6AXuAXnrKs6P8OU65PpWIRAwU_OSyMRNE-jzLjdRFlnv8r7CdpjKKmQYsyagFZAYcSomNUaaaWMdZ5NKWmR7gTdFiFmOMW5ENypMupjYZ_16_Fpnc45Z-64i9QvvrLviQ3NEVhquVw9vxA1pgajqqX1eXu01BSZuHfB_XmkK_WLyr9US6n3uj-J_aFiv_Fls37St279KqfAlz85QFCAR9OkxjkSxywCHzANk-U7hsVzTONXr_uvaFiTlaz",
  renovated: "https://lh3.googleusercontent.com/aida-public/AB6AXuDGtaxWIcftb-EP9u-NdUy9r0UdUqR-6283vKdSpaVQs9ETleHzA7y7MF8dYNCKDoHPlLY6GhmUWLw5VKGOVQ3-Y0hzMxBClpFUGWcSELBJ20pyEDKDhZrN8NEs6YC9QyvFhSon6LnGx_6MSq7BcHr2scHlMPBi5nyRE4ywT8VFMmPUL4lS-1Qy1h9YVNKXLXudDq3luKINQvUb9XzQWgKg4XuPquVIHraqZKXW8AeLZbfriOSyCfPV"
};
// House/Building/Shop/Commercial Property don't have their own distinct
// stock photo yet -- reuse the closest existing category's image rather
// than leaving them undefined (an undefined entry here previously showed
// as a broken image for any listing with an unrecognized type).
IMAGES.house = IMAGES.villa;
IMAGES.building = IMAGES.office;
IMAGES.shop = IMAGES.office;
IMAGES.commercialProperty = IMAGES.office;

let LISTINGS = [];
let listingsLoaded = false;

// ---------------------------------------------------------------------
// Real for-sale listings, loaded live from Firestore's `listings`
// collection — the same collection admin.html and agent-dashboard.html
// write to. firestore.rules only allows an anonymous/public read when
// the query is constrained to private==false AND status=='active' (a
// listing-level get() or an unfiltered/under-constrained query is
// denied) -- an unconstrained fetch here would now fail outright.
// Only dealType === 'sale' shows here — Buy is a sale-only page.
// ---------------------------------------------------------------------
let listingsLoadError = false;
async function loadListings() {
  listingsLoadError = false;
  try {
    const [{ db, getDocs }, storeMod] = await Promise.all([
      import('./js/firebase-init.js'),
      import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
    ]);
    const { collection, query, where } = storeMod;
    const q = query(collection(db, 'listings'), where('private', '==', false), where('status', '==', 'active'));
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    LISTINGS = docs.filter(d => d.dealType === 'sale').map(d => ({
      id: d.id,
      title: d.title || d.address || 'Property',
      city: d.city || '',
      address: d.address || '',
      type: d.propertyType || '',
      price: Number(d.price) || 0,
      beds: Number(d.beds) || 0,
      baths: Number(d.baths) || 0,
      sqft: Number(d.sqft) || 0,
      img: d.img || IMAGES[d.propertyType] || IMAGES.villa,
      verified: !!d.verified
    }));
  } catch (e) {
    LISTINGS = [];
    listingsLoadError = true;
  }
  listingsLoaded = true;
  render();
}
document.getElementById('buyRetryBtn').addEventListener('click', () => {
  listingsLoaded = false;
  loadListings();
});
loadListings();

// ---------------------------------------------------------------------
// Favorites & saved searches (Firebase). Dynamic import keeps this a
// plain classic script — no module-scope isolation with the rest of
// this file's functions/variables.
// ---------------------------------------------------------------------
let favAuth = null, favDb = null, favFns = null;
let favoriteIds = new Set();

function showToast(msg, icon) {
  const el = document.getElementById('buyToast');
  el.innerHTML = `${icon ? `<span class="material-symbols-outlined text-[18px]">${icon}</span>` : ''}<span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

async function initFavorites() {
  const [{ auth, db, getDocs, addDoc, setDoc, deleteDoc }, authMod, storeMod] = await Promise.all([
    import('./js/firebase-init.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
  ]);
  favAuth = auth; favDb = db;
  favFns = { ...authMod, ...storeMod, getDocs, addDoc, setDoc, deleteDoc };
  favFns.onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await favFns.getDocs(favFns.collection(db, 'users', user.uid, 'favorites'));
      favoriteIds = new Set();
      snap.forEach(d => favoriteIds.add(d.id));
    } else {
      favoriteIds = new Set();
    }
    render();
  });
}
initFavorites();

async function toggleFavorite(id) {
  if (!favAuth || !favAuth.currentUser) {
    showToast('Log in to save favorites', 'favorite');
    setTimeout(() => { window.location.href = 'login.html'; }, 900);
    return;
  }
  const uid = favAuth.currentUser.uid;
  const idStr = 'buy-' + id;
  const l = LISTINGS.find(x => x.id === id);
  const ref = favFns.doc(favDb, 'users', uid, 'favorites', idStr);
  if (favoriteIds.has(idStr)) {
    favoriteIds.delete(idStr);
    await favFns.deleteDoc(ref);
    showToast('Removed from favorites', 'favorite');
  } else {
    favoriteIds.add(idStr);
    await favFns.setDoc(ref, {
      listingId: idStr, address: l.address, city: l.city,
      priceLabel: fmtPrice(l.price), img: l.img, savedAt: favFns.serverTimestamp()
    });
    showToast('Saved to favorites', 'favorite');
  }
  render();
}

async function saveCurrentSearch() {
  if (!favAuth || !favAuth.currentUser) {
    showToast('Log in to save searches', 'bookmark_add');
    setTimeout(() => { window.location.href = 'login.html'; }, 900);
    return;
  }
  const uid = favAuth.currentUser.uid;
  const q = document.getElementById('searchInput').value.trim();
  const type = document.getElementById('typeFilter').value;
  const label = `${type === 'all' ? 'All types' : type}${q ? ' — "' + q + '"' : ''} on Buy`;
  await favFns.addDoc(favFns.collection(favDb, 'users', uid, 'savedSearches'), {
    label, url: 'buy.html', filters: { type, q }, createdAt: favFns.serverTimestamp()
  });
  showToast('Search saved to your account', 'check_circle');
}
document.getElementById('saveSearchBtn').addEventListener('click', saveCurrentSearch);

function fmtPrice(p) { return "$" + p.toLocaleString(); }

function tr(key, fallback) { return (window.t && window.t(key)) || fallback; }
function card(l) {
  const badge = l.verified ? `<div class="absolute top-3 right-3 bg-tertiary-container/90 backdrop-blur-sm text-on-tertiary-container px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
      <span class="material-symbols-outlined text-[14px]">verified</span>
      <span class="font-label-caps text-label-caps text-[10px]">${tr('common.verified','Verified')}</span>
    </div>` : '';
  const favActive = favoriteIds.has('buy-' + l.id);
  const favBtn = `<button type="button" onclick="event.preventDefault(); event.stopPropagation(); toggleFavorite('${l.id}');" class="absolute top-3 left-3 w-8 h-8 rounded-full bg-primary/60 backdrop-blur-sm flex items-center justify-center hover:bg-primary/80 transition-colors z-10" aria-label="Save to favorites">
      <span class="material-symbols-outlined text-[18px] ${favActive ? 'text-secondary' : 'text-white'}" style="font-variation-settings: 'FILL' ${favActive ? 1 : 0};">favorite</span>
    </button>`;
  return `
  <a href="listing.html?id=${encodeURIComponent(l.id)}" class="block bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant hover:shadow-[0_4px_20px_rgba(26,43,60,0.08)] transition-all relative overflow-hidden group">
    <div class="absolute top-0 left-0 w-full h-1 bg-secondary z-20"></div>
    <div class="relative h-48 w-full overflow-hidden">
      <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${isSafeHttpUrl(l.img) ? escapeHtml(l.img) : IMAGES.villa}"/>
      ${favBtn}
      ${badge}
    </div>
    <div class="p-4">
      <h3 class="font-headline-md text-[18px] leading-tight text-on-surface mb-1">${escapeHtml(l.title)}</h3>
      <p class="font-body-md text-body-md text-on-surface-variant mb-4 flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">location_on</span> ${escapeHtml(l.address)}, ${escapeHtml(l.city)}
      </p>
      <div class="flex justify-between items-center mb-4 pb-4 border-b border-surface-variant">
        <div class="flex gap-4">
          <span class="font-data-mono text-data-mono text-on-surface flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-outline">bed</span>${l.beds}</span>
          <span class="font-data-mono text-data-mono text-on-surface flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-outline">bathtub</span>${l.baths}</span>
          <span class="font-data-mono text-data-mono text-on-surface flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-outline">square_foot</span>${l.sqft}m²</span>
        </div>
      </div>
      <div class="flex justify-between items-center">
        <span class="font-headline-md text-headline-md text-primary">${fmtPrice(l.price)}</span>
        <span class="font-label-caps text-label-caps text-secondary group-hover:text-primary transition-colors">${tr('common.details','Details')}</span>
      </div>
    </div>
  </a>`;
}

function render() {
  if (!listingsLoaded) {
    document.getElementById('listingsGrid').innerHTML = '';
    document.getElementById('resultCount').textContent = tr('map.loadingListings', 'Loading listings…');
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('buyErrorState').classList.add('hidden');
    return;
  }

  if (listingsLoadError) {
    document.getElementById('listingsGrid').innerHTML = '';
    document.getElementById('resultCount').textContent = '';
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('buyErrorState').classList.remove('hidden');
    return;
  }
  document.getElementById('buyErrorState').classList.add('hidden');

  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const type = document.getElementById('typeFilter').value;
  const sort = document.getElementById('sortFilter').value;

  let list = LISTINGS.filter(l => {
    const qMatch = !q || l.city.toLowerCase().includes(q) || l.address.toLowerCase().includes(q) || l.title.toLowerCase().includes(q);
    const typeMatch = type === 'all' || l.type === type;
    return qMatch && typeMatch;
  });

  if (sort === 'price-asc') list = list.slice().sort((a, b) => a.price - b.price);
  if (sort === 'price-desc') list = list.slice().sort((a, b) => b.price - a.price);

  document.getElementById('listingsGrid').innerHTML = list.map(card).join('');
  document.getElementById('resultCount').textContent = `${list.length} properties for sale`;
  document.getElementById('emptyState').classList.toggle('hidden', list.length > 0);
}

['searchInput', 'typeFilter', 'sortFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

const urlParams = new URLSearchParams(window.location.search);
const urlType = urlParams.get('type');
if (urlType && ['house', 'villa', 'apartment', 'land', 'building', 'office', 'shop', 'commercialProperty'].includes(urlType)) {
  document.getElementById('typeFilter').value = urlType;
}
const urlCity = urlParams.get('city');
if (urlCity) {
  document.getElementById('searchInput').value = urlCity;
  // Arriving via a "Browse by City" link (?city=) — make this feel
  // like a dedicated city page, not just a pre-filled
  // search box. Detach from data-i18n so a language switch doesn't wipe
  // this back to the generic title; re-render it ourselves instead.
  const titleEl = document.getElementById('buyPageTitle');
  const subEl = document.getElementById('buyPageSubtitle');
  titleEl.removeAttribute('data-i18n');
  subEl.removeAttribute('data-i18n');
  function renderCityHeading() {
    const cityLabelText = (window.cityLabel && window.cityLabel(urlCity)) || urlCity;
    titleEl.textContent = cityLabelText + ' ' + tr('buy.apartmentsSuffix', 'Apartments');
    subEl.textContent = tr('buy.cityHeadingSubtitle', 'Verified properties for sale in') + ' ' + cityLabelText + '.';
  }
  renderCityHeading();
  document.addEventListener('darwesh:langchange', renderCityHeading);
}
render();
document.addEventListener('darwesh:langchange', render);
</script>
