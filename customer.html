<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://darwesh-backend-353477435585.me-central1.run.app https://overpass-api.de https://nominatim.openstreetmap.org https://www.google.com https://*.ingest.sentry.io; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<!-- Favicon / app icons -- generated from the official Darwesh Group D-mark
     (images/brand/darwesh-mark.png); geometry unmodified. Root-relative
     paths so they resolve from every route regardless of the current page. -->
<link rel="icon" href="/images/brand/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="48x48" href="/images/brand/favicon-48.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="canonical" href="https://www.darweshgroup.com/customer.html"/>
<script>(function(){var l=localStorage.getItem('darwesh_lang');document.documentElement.lang=l||'en';document.documentElement.dir=(l==='ku'||l==='ar')?'rtl':'ltr';})();</script>
<script src="./js/icon-fallback.js"></script>
<title>Darwesh Group - Public Profile</title>
<meta name="description" content="Public Darwesh Group member profile: rank, badges and Darwesh Challenge activity."/>
<link href="css/tailwind.css" rel="stylesheet"/>
<link href="css/profile-tokens.css" rel="stylesheet"/>
<link href="css/cinematic.css" rel="stylesheet"/>
<link href="css/arena.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  body { min-height: 100dvh; }
</style>
</head>
<body class="cine-scope bg-background text-on-surface font-body-md antialiased pt-[76px] pb-24 md:pb-0">

<div id="siteHeader" data-active=""></div>
<script src="./js/site-header.js"></script>
<div id="siteMobileNav" data-active=""></div>
<script src="./js/site-mobile-nav.js"></script>

<main class="ps-shell py-8">

  <!-- Loading state -->
  <div id="loadingState" aria-live="polite">
    <div class="ps-skeleton" style="height:180px;border-radius:16px;margin-bottom:24px;"></div>
    <div class="ps-skeleton" style="height:140px;"></div>
  </div>

  <!-- No profile to resolve: no ?id= in the URL and nobody signed in. -->
  <div id="noProfileState" class="ps-empty hidden">
    <span class="material-symbols-outlined text-[32px] text-on-surface-variant opacity-60" aria-hidden="true">person</span>
    <p class="font-body-md text-[14px] text-on-surface font-medium mt-3" data-i18n="customer.noProfileTitle">No profile to show</p>
    <p class="font-body-md text-[13px] text-on-surface-variant mt-1" data-i18n="customer.noProfileHint">Check the link, or sign in to view your own public profile.</p>
  </div>

  <!-- A profile id resolved, but there is nothing public to show for it.
       This is also what a visitor sees for a real member who simply hasn't
       done anything in the Darwesh Challenge yet -- by design, this page
       can never tell those two cases apart, since it never reads anything
       about the member beyond the public arenaLeaderboardEntries doc. -->
  <div id="noActivityState" class="ps-empty hidden">
    <span class="material-symbols-outlined text-[32px] text-on-surface-variant opacity-60" aria-hidden="true">military_tech</span>
    <p class="font-body-md text-[14px] text-on-surface font-medium mt-3" data-i18n="customer.noActivityTitle">No public activity yet</p>
    <p class="font-body-md text-[13px] text-on-surface-variant mt-1" data-i18n="customer.noActivityHint">This member hasn't started their Darwesh Challenge journey yet.</p>
  </div>

  <div id="errorState" class="hidden"></div>

  <div id="customerContent" class="hidden">

    <!-- Hero. Plain solid .ps-hero (same family office.html uses), never
         the professional-role .rp-hero photo-banner system -- a customer
         has no cover photo or portfolio, so an avatar-circle identity card
         is the honest fit, not a forced-in cover treatment built for a
         professional's work. -->
    <section class="ps-hero mb-8">
      <div class="ps-hero-glow" aria-hidden="true"></div>
      <div class="ps-avatar" style="position:relative;z-index:1;">
        <div id="avatarFrame" class="ps-avatar-frame">
          <span class="material-symbols-outlined text-on-secondary text-[36px]" id="avatarIcon">person</span>
          <img id="avatarImg" class="hidden" alt="" decoding="async"/>
        </div>
      </div>
      <div style="position:relative;z-index:1;flex:1;min-width:0;">
        <p id="heroEyebrow" class="rp-hero-eyebrow mb-1" data-i18n="customer.role">Community Member</p>
        <h1 id="customerName" class="font-headline-md text-[24px] md:text-[28px] font-bold truncate max-w-full mb-1">—</h1>
        <p id="heroMeta" class="font-body-md text-[13px] opacity-80"></p>
        <div class="flex flex-wrap justify-center md:justify-start gap-2.5 mt-4">
          <!-- Owner-only. -->
          <a id="manageAccountBtn" href="account.html" class="ps-btn hidden border border-white/30 text-on-primary px-5 py-2.5 rounded-full font-label-caps text-label-caps hover:bg-white/10 transition-colors" data-i18n="customer.manageAccount">Manage my account</a>
        </div>
      </div>
    </section>

    <!-- Darwesh Challenge summary -- owner gets the full private panel
         (arena-panel.js), a visitor gets only the safe public subset
         (arena-summary.js). Never both, same host element, exactly like
         every other public profile page mounts these two components. -->
    <div id="arenaPanel" class="max-w-2xl" hidden></div>

  </div>
</main>

<script type="module" src="./js/i18n.js"></script>
<script type="module" src="./js/customer-profile.js"></script>
</body></html>
