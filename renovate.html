<!-- CLIENT-04 (CLIENT_SIDE_SECURITY_REVIEW.md): meta-delivered CSP. GitHub Pages
can't set HTTP headers, so this is the only delivery mechanism available.
unsafe-inline on script and style sources is a deliberate, documented
tradeoff: this codebase has no build step and dozens of inline script/style
blocks per page; blocking them needs a nonce (impossible with no per-request
server logic) or a SHA-256 hash per block kept in lockstep with every future
edit across 21 pages, a real ongoing cost not taken on here. What this DOES
still provide: an injected payload (e.g. CLIENT-01/02, both since fixed) can
no longer load a script from an attacker-controlled domain or exfiltrate data
via fetch or img to one. Note: frame-ancestors, report-uri, and sandbox are
silently ignored when CSP is delivered via a meta tag (a browser spec rule,
not an oversight here); this can never provide clickjacking protection or
violation reporting. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://darwesh-backend-353477435585.me-central1.run.app https://overpass-api.de https://nominatim.openstreetmap.org https://www.google.com https://*.ingest.sentry.io; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"/>
