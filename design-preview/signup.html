<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Darwesh Group — Design Preview (Sign Up)</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  body { background: var(--bg-secondary); }
  .auth-wrap { min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 32px 20px; }
  .auth-card { width:100%; max-width:460px; }
  .role-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
  .role-opt { border:1px solid var(--border-soft); border-radius:var(--radius-medium); padding:14px 8px; text-align:center; font-size:13px; font-weight:600; }
  .role-opt.selected { border-color:var(--accent); background:var(--accent-tint); color:var(--accent); }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:480px){ .row-2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#111;color:#fff;font:600 12px/1 var(--font-display);padding:6px 14px;border-radius:999px;opacity:.85;">DESIGN PREVIEW — not live</div>
<div class="auth-wrap">
  <a class="dp-logo" href="index.html" style="margin-bottom:32px;font-size:22px;"><span class="dp-logo-mark"><img src="../images/brand/darwesh-approved-new-logo.png" alt=""></span>Darwesh Group</a>
  <div class="dp-form-card auth-card">
    <h1 class="dp-h3" style="font-size:24px;text-align:center;">Create your account</h1>
    <p class="dp-body-sm" style="text-align:center;margin-bottom:24px;">Join Darwesh Group to buy, sell, or offer your services.</p>

    <label class="dp-label" style="display:block;margin-bottom:10px;">I am a…</label>
    <div class="role-grid">
      <div class="role-opt selected">Customer</div>
      <div class="role-opt">Agent / Office</div>
      <div class="role-opt">Professional</div>
    </div>

    <div class="row-2">
      <div class="dp-field"><label class="dp-label">First name</label><input class="dp-input" type="text" value="Ranj"/></div>
      <div class="dp-field"><label class="dp-label">Last name</label><input class="dp-input" type="text" value="Ahmed"/></div>
    </div>
    <div class="dp-field"><label class="dp-label">Email</label><input class="dp-input" type="email" value="ranj@example.com"/></div>
    <div class="dp-field"><label class="dp-label">Phone</label><input class="dp-input" type="tel" value="+964 750 123 4567"/></div>
    <div class="dp-field"><label class="dp-label">Password</label><input class="dp-input" type="password" value="••••••••••"/></div>

    <button class="dp-btn dp-btn-primary" style="width:100%;margin-top:6px;">Create Account</button>
    <p class="dp-body-sm" style="text-align:center;margin-top:22px;">Already have an account? <a href="login.html" style="color:var(--accent);font-weight:600;">Log in</a></p>
  </div>
</div>
<script src="preview.js"></script>
</body>
</html>
