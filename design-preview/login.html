<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Darwesh Group — Design Preview (Login)</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  body { background: var(--bg-secondary); }
  .auth-wrap { min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 32px 20px; }
  .auth-card { width:100%; max-width:420px; }
</style>
</head>
<body>
<div style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#111;color:#fff;font:600 12px/1 var(--font-display);padding:6px 14px;border-radius:999px;opacity:.85;">DESIGN PREVIEW — not live</div>
<div class="auth-wrap">
  <a class="dp-logo" href="index.html" style="margin-bottom:36px;font-size:22px;"><span class="dp-logo-mark"><img src="../images/brand/darwesh-approved-new-logo.png" alt=""></span>Darwesh Group</a>
  <div class="dp-form-card auth-card">
    <h1 class="dp-h3" style="font-size:24px;text-align:center;">Welcome back</h1>
    <p class="dp-body-sm" style="text-align:center;margin-bottom:28px;">Log in to manage your listings and saved properties.</p>

    <div class="dp-field">
      <label class="dp-label">Email</label>
      <input class="dp-input" type="email" value="ranj@example.com"/>
    </div>
    <div class="dp-field">
      <label class="dp-label">Password</label>
      <input class="dp-input" type="password" value="••••••••••"/>
    </div>
    <a href="#" class="dp-body-sm" style="display:block;text-align:right;margin-bottom:20px;">Forgot password?</a>
    <button class="dp-btn dp-btn-primary" style="width:100%;">Log In</button>

    <div style="display:flex;align-items:center;gap:12px;margin:24px 0;">
      <div style="flex:1;height:1px;background:var(--border-soft);"></div>
      <span class="dp-body-sm">or</span>
      <div style="flex:1;height:1px;background:var(--border-soft);"></div>
    </div>
    <button class="dp-btn dp-btn-secondary" style="width:100%;">Continue with Google</button>

    <p class="dp-body-sm" style="text-align:center;margin-top:24px;">Don't have an account? <a href="signup.html" style="color:var(--accent);font-weight:600;">Sign up</a></p>
  </div>
</div>
<script src="preview.js"></script>
</body>
</html>
