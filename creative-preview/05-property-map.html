<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 05 — Property Map</title>
<link rel="stylesheet" href="preview.css">
<style>
  .map-stage { height: 900px; position: relative; }
  .map-bg {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(100deg, rgba(27,31,39,0.05) 0 2px, transparent 2px 90px),
      repeating-linear-gradient(10deg, rgba(27,31,39,0.05) 0 2px, transparent 2px 90px),
      linear-gradient(160deg, #efe7d6, #e3d9c0 60%, #d8cdae 100%);
  }
  .parcel { position: absolute; border-radius: 6px; background: rgba(74,87,68,0.14); border: 1px solid rgba(74,87,68,0.3); }
  .top-bar {
    position: absolute; top: 22px; left: 22px; right: 22px; z-index: 5;
    display: flex; align-items: center; gap: 12px;
  }
  .search-bar {
    flex: 1; max-width: 460px; background: #fff; border-radius: var(--radius-pill);
    padding: 13px 20px; border: 1px solid var(--line-on-light);
    font: 500 13.5px var(--font-body); color: var(--ink-on-light-dim);
    box-shadow: 0 16px 34px -18px rgba(20,23,28,0.35);
    display: flex; align-items: center; gap: 10px;
  }
  .chip-row { display: flex; gap: 8px; }
  .chip { background: #fff; border: 1px solid var(--line-on-light); border-radius: var(--radius-pill); padding: 10px 15px; font: 600 12px/1 var(--font-body); color: var(--ink-on-light); box-shadow: 0 10px 24px -16px rgba(20,23,28,0.3); }
  .map-controls { position: absolute; right: 22px; top: 100px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .mctrl { width: 42px; height: 42px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -16px rgba(20,23,28,0.3); border: 1px solid var(--line-on-light); }
  .select-area-btn {
    position: absolute; left: 22px; bottom: 22px; z-index: 5;
  }
  .save-alert { position: absolute; left: 200px; bottom: 22px; z-index: 5; }
  .marker { position: absolute; width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--gold); box-shadow: 0 10px 24px -12px rgba(201,162,39,0.7); display: flex; align-items: center; justify-content: center; }
  .marker span { transform: rotate(45deg); font: 700 9px var(--font-body); color: #201705; }
  .listing-card {
    position: absolute; right: 22px; bottom: 22px; width: 300px; z-index: 6;
    background: #fff; border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: 0 30px 60px -24px rgba(20,23,28,0.4); border: 1px solid var(--line-on-light);
  }
  .listing-card .img { height: 130px; background: linear-gradient(200deg, #d8cdae, #efe7d6); position: relative; }
  .listing-card .body { padding: 16px; }
  .listing-card .price { font: 700 18px/1 var(--font-display); color: var(--ink-on-light); }
  .listing-card .addr { font: 500 12.5px/1.3 var(--font-body); color: var(--ink-on-light-dim); margin-top: 6px; }
</style>
</head>
<body>
<div class="scene on-light map-stage">
  <div class="map-bg"></div>
  <div class="parcel" style="left:220px; top:260px; width:180px; height:120px; transform: skew(-6deg);"></div>
  <div class="parcel" style="left:560px; top:410px; width:220px; height:160px; transform: skew(4deg) rotate(2deg);"></div>
  <div class="parcel" style="left:900px; top:220px; width:160px; height:130px; transform: skew(-3deg) rotate(-1deg);"></div>
  <div class="pending-tag" style="color:rgba(27,31,39,0.45); border-color:rgba(27,31,39,0.2);">CSS mockup — no real geographic data</div>

  <nav class="nav" style="position:relative; z-index:6;">
    <div class="nav-mark"><div style="width:9px;height:9px;border-radius:50%;background:var(--gold);"></div>Darwesh Group</div>
    <div class="nav-links"><a>Home</a><a class="active">Map</a><a>Projects</a><a>Services</a></div>
    <div></div>
  </nav>

  <div class="top-bar">
    <div class="search-bar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg> Erbil — 40 Meter Road</div>
    <div class="chip-row">
      <div class="chip">For Sale</div><div class="chip">Verified only</div><div class="chip">₪ Price ▾</div>
    </div>
  </div>

  <div class="map-controls">
    <div class="mctrl">＋</div><div class="mctrl">－</div><div class="mctrl">⤢</div>
  </div>

  <button class="btn btn-ghost-light select-area-btn">Select Area</button>
  <button class="btn btn-ghost-light save-alert">Save as Alert</button>

  <div class="marker" style="left:290px; top:300px;"><span>$</span></div>
  <div class="marker" style="left:640px; top:450px;"><span>$</span></div>
  <div class="marker" style="left:960px; top:250px;"><span>$</span></div>

  <div class="listing-card">
    <div class="img"></div>
    <div class="body">
      <div class="price">$185,000</div>
      <div class="addr">3 bed villa · 40 Meter Road, Erbil</div>
    </div>
  </div>
</div>
</body>
</html>
