<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 03 — About Cinematic</title>
<link rel="stylesheet" href="preview.css">
<style>
  .stage { height: 900px; position: relative; display: flex; align-items: center; justify-content: center; }
  .layer { position: absolute; text-align: center; }
  .layer.back { transform: scale(1.15); filter: blur(1.5px); opacity: 0.35; top: 120px; }
  .layer.mid { transform: scale(1.0); opacity: 0.75; top: 260px; }
  .layer.front { top: 380px; }
  .layer .word { font-family: var(--font-display); font-size: 30px; color: var(--ivory); letter-spacing: 0.01em; }
  .layer.front .word { font-size: 58px; }
  .caption { position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; }
  .caption .line { font: 500 15px/1.5 var(--font-body); color: var(--ink-on-dark-dim); }
  .scroll-note {
    position: absolute; top: 26px; right: 56px; z-index: 6;
    font: 600 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gold-soft); display: flex; align-items: center; gap: 8px;
  }
  .scroll-note .bar { width: 1px; height: 60px; background: linear-gradient(var(--gold-soft), transparent); }
  .frame-dots { position: absolute; bottom: 64px; left: 56px; display: flex; gap: 8px; }
  .frame-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line-on-dark); }
  .frame-dots span.active { background: var(--gold); }
</style>
</head>
<body>
<div class="scene on-dark stage">
  <div class="photo-surface" style="background:
    radial-gradient(90% 70% at 50% 0%, rgba(201,162,39,0.16), transparent 60%),
    radial-gradient(120% 90% at 50% 100%, rgba(74,87,68,0.28), transparent 60%),
    linear-gradient(180deg, #191c22 0%, #0e1013 100%);"></div>
  <div class="grain"></div>
  <div class="pending-tag">CSS mockup — represents one frozen frame of a scroll sequence</div>

  <nav class="nav" style="position:absolute; top:0; left:0; right:0; z-index:5;">
    <div class="nav-mark"><div style="width:9px;height:9px;border-radius:50%;background:var(--gold);"></div>Darwesh Group</div>
    <div class="nav-links"><a>Home</a><a class="active">About</a><a>Services</a><a>Challenge</a></div>
    <div></div>
  </nav>

  <div class="scroll-note">Scroll<div class="bar"></div></div>

  <div class="layer back"><div class="word">Architecture</div></div>
  <div class="layer mid"><div class="word">People</div></div>
  <div class="layer front"><div class="word">Rooted in Kurdistan.<br>Built for what's next.</div></div>

  <div class="frame-dots">
    <span></span><span class="active"></span><span></span><span></span><span></span>
  </div>
  <div class="caption">
    <div class="line">A layered scroll sequence — architecture, people, and the future move as one story, not stacked sections.</div>
  </div>
</div>
</body>
</html>
