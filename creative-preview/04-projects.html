<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 04 — Projects</title>
<link rel="stylesheet" href="preview.css">
<style>
  .wrap { padding: 56px; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  h2.display { font-size: 38px; color: var(--ivory); margin: 12px 0 0; }
  .tabs { display: flex; gap: 8px; }
  .tab { font: 600 12.5px/1 var(--font-body); padding: 9px 16px; border-radius: var(--radius-pill); background: rgba(247,242,232,0.06); color: var(--ink-on-dark-dim); border: 1px solid var(--line-on-dark); }
  .tab.active { background: var(--gold); color: #201705; border-color: transparent; }

  .hero-card {
    position: relative; height: 380px; border-radius: var(--radius-lg); overflow: hidden;
    border: 1px solid var(--line-on-dark); margin-bottom: 22px;
  }
  .hero-card .bg { position: absolute; inset: 0; background:
    radial-gradient(100% 80% at 80% 10%, rgba(90,110,150,0.4), transparent 55%),
    linear-gradient(200deg, #232833, #0e1013 70%); }
  .hero-card .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,16,19,0.9) 0%, rgba(14,16,19,0.2) 55%, transparent 100%); }
  .hero-card .content { position: absolute; left: 40px; top: 40px; bottom: 40px; display: flex; flex-direction: column; justify-content: space-between; max-width: 440px; }
  .hero-card h3 { font: 500 34px/1.1 var(--font-display); color: var(--ivory); margin: 10px 0; }
  .meta-row { display: flex; gap: 26px; }
  .meta { display: flex; flex-direction: column; gap: 2px; }
  .meta b { font: 600 15px/1 var(--font-body); color: var(--ivory); }
  .meta span { font: 500 11px/1 var(--font-body); color: var(--ink-on-dark-dim); text-transform: uppercase; letter-spacing: 0.06em; }

  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .p-card { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line-on-dark); height: 190px; position: relative; }
  .p-card .bg { position: absolute; inset: 0; }
  .p-card .veil { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(14,16,19,0.92) 100%); }
  .p-card .body { position: absolute; left: 18px; right: 18px; bottom: 16px; }
  .p-card .name { font: 600 16px/1.2 var(--font-body); color: var(--ivory); }
  .p-card .loc { font: 500 11.5px/1 var(--font-body); color: var(--ink-on-dark-dim); margin-top: 3px; }
</style>
</head>
<body>
<div class="scene on-dark">
  <nav class="nav">
    <div class="nav-mark"><div style="width:9px;height:9px;border-radius:50%;background:var(--gold);"></div>Darwesh Group</div>
    <div class="nav-links"><a>Home</a><a class="active">Projects</a><a>Services</a><a>Challenge</a></div>
    <div></div>
  </nav>
  <div class="wrap">
    <div class="head-row">
      <div>
        <div class="eyebrow">Projects</div>
        <h2 class="display">Follow what's being built.</h2>
      </div>
      <div class="tabs"><div class="tab active">All Cities</div><div class="tab">Erbil</div><div class="tab">Sulaymaniyah</div><div class="tab">Duhok</div></div>
    </div>

    <div class="hero-card">
      <div class="bg"></div>
      <div class="veil"></div>
      <div class="content">
        <span class="badge badge-gold">Now Selling</span>
        <div>
          <h3>Sartip Heights</h3>
          <p class="lede">A 12-tower residential development overlooking the Erbil skyline, developed by Zana Group.</p>
        </div>
        <div>
          <div class="meta-row" style="margin-bottom:16px;">
            <div class="meta"><b>412</b><span>Total units</span></div>
            <div class="meta"><b>68%</b><span>Reserved</span></div>
            <div class="meta"><b>Q3 2027</b><span>Handover</span></div>
          </div>
          <button class="btn btn-primary">View Project</button>
        </div>
      </div>
    </div>

    <div class="row3" id="row3"></div>
  </div>
</div>
<script>
const PROJECTS = [
  { name: 'Rwange Residences', loc: 'Sulaymaniyah', hue: [201,162,39] },
  { name: 'Duhok Garden City', loc: 'Duhok', hue: [74,87,68] },
  { name: 'Peace Avenue Towers', loc: 'Erbil', hue: [90,110,150] },
];
document.getElementById('row3').innerHTML = PROJECTS.map(p => `
  <div class="p-card">
    <div class="bg" style="background: radial-gradient(100% 90% at 70% 0%, rgba(${p.hue.join(',')},0.42), transparent 60%), linear-gradient(200deg, #20242c, #0e1013 75%);"></div>
    <div class="veil"></div>
    <div class="body"><div class="name">${p.name}</div><div class="loc">${p.loc}</div></div>
  </div>
`).join('');
</script>
</body>
</html>
