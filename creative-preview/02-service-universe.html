<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 02 — Service Universe</title>
<link rel="stylesheet" href="preview.css">
<style>
  .wrap { padding: 40px 56px 0; }
  .head { max-width: 640px; margin-bottom: 22px; }
  h2.display { font-size: 38px; color: var(--ivory); margin: 12px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .svc-card {
    position: relative; border-radius: var(--radius-lg); overflow: hidden; height: 172px;
    border: 1px solid var(--line-on-dark);
  }
  .svc-card .bg { position: absolute; inset: 0; }
  .svc-card .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,23,28,0) 30%, rgba(15,17,21,0.92) 100%); }
  .svc-card .icon { position: absolute; top: 20px; left: 20px; width: 38px; height: 38px; border-radius: 10px; background: rgba(247,242,232,0.12); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; }
  .svc-card .icon svg { width: 18px; height: 18px; }
  .svc-card .body { position: absolute; left: 20px; right: 20px; bottom: 18px; }
  .svc-card .body .name { font: 600 19px/1.15 var(--font-display); color: var(--ivory); margin-bottom: 4px; }
  .svc-card .body .tag { font: 500 12.5px/1.3 var(--font-body); color: rgba(247,242,232,0.72); }
</style>
</head>
<body>
<div class="scene on-dark">
  <nav class="nav">
    <div class="nav-mark"><div style="width:9px;height:9px;border-radius:50%;background:var(--gold);"></div>Darwesh Group</div>
    <div class="nav-links"><a>Home</a><a class="active">Services</a><a>Projects</a><a>Challenge</a></div>
    <div></div>
  </nav>
  <div class="wrap">
    <div class="head">
      <div class="eyebrow">Service Universe</div>
      <h2 class="display">One network.<br>Every step.</h2>
      <p class="lede">From finding a home to furnishing it — one coordinated collection of trusted professionals.</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<script>
const SERVICES = [
  { name: 'Properties', tag: 'Find where you belong.', hue: [201,162,39] },
  { name: 'Projects', tag: "Watch the city grow.", hue: [90,110,150] },
  { name: 'Design', tag: 'Spaces with intention.', hue: [176,110,90] },
  { name: 'Engineering', tag: 'Built with confidence.', hue: [110,120,132] },
  { name: 'Legal', tag: 'Clarity at every step.', hue: [70,75,90] },
  { name: 'Cleaning', tag: 'A fresh start, every time.', hue: [180,175,150] },
  { name: 'Landscaping', tag: 'Make space grow.', hue: [74,87,68] },
  { name: 'Moving', tag: 'Your next chapter, carried carefully.', hue: [150,110,70] },
  { name: 'Maintenance', tag: 'Cared for, always.', hue: [120,105,95] },
];
const grid = document.getElementById('grid');
grid.innerHTML = SERVICES.map(s => `
  <div class="svc-card">
    <div class="bg" style="background:
      radial-gradient(120% 100% at 20% 0%, rgba(${s.hue.join(',')},0.55), transparent 60%),
      linear-gradient(160deg, rgba(${s.hue.join(',')},0.22), #14171c 70%);"></div>
    <div class="veil"></div>
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#f7f2e8" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/></svg></div>
    <div class="body">
      <div class="name">${s.name}</div>
      <div class="tag">${s.tag}</div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
