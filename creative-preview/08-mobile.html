<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 08 — Mobile</title>
<link rel="stylesheet" href="preview.css">
<style>
  .m-stage { height: 844px; position: relative; display: flex; flex-direction: column; }
  .m-top { display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0; position: relative; z-index: 5; }
  .m-mark { display: flex; align-items: center; gap: 8px; font: 600 14px/1 var(--font-body); }
  .m-hero { position: relative; height: 360px; margin-top: 18px; }
  .m-hero .content { position: absolute; left: 20px; right: 20px; bottom: 24px; z-index: 3; }
  .m-hero h1 { font: 500 32px/1.12 var(--font-display); color: var(--ivory); margin: 10px 0 12px; }
  .m-search {
    margin: -28px 20px 0; position: relative; z-index: 4;
    background: rgba(20,23,28,0.7); backdrop-filter: blur(16px);
    border: 1px solid var(--line-on-dark); border-radius: var(--radius-lg);
    padding: 16px;
  }
  .m-search .row { display: flex; gap: 6px; margin-bottom: 10px; }
  .m-search .tab { flex: 1; text-align: center; font: 600 12px/1 var(--font-body); padding: 10px 0; border-radius: var(--radius-pill); background: rgba(247,242,232,0.06); color: var(--ink-on-dark-dim); }
  .m-search .tab.active { background: var(--gold); color: #201705; }
  .m-search input { width: 100%; background: rgba(247,242,232,0.06); border: 1px solid var(--line-on-dark); border-radius: var(--radius-sm); padding: 13px 14px; color: var(--ivory); font: 500 13px var(--font-body); }

  .m-section { padding: 26px 20px 0; }
  .m-section h3 { font: 600 15px/1 var(--font-body); color: var(--ivory); margin: 0 0 12px; }
  .m-row { display: flex; gap: 12px; overflow: hidden; }
  .m-card { flex: 0 0 150px; height: 100px; border-radius: var(--radius-md); background: linear-gradient(160deg, #2a2d33, #14171c); border: 1px solid var(--line-on-dark); position: relative; overflow: hidden; }
  .m-card span { position: absolute; left: 12px; bottom: 10px; font: 600 12px/1 var(--font-body); color: var(--ivory); }

  .m-fab {
    position: absolute; right: 20px; bottom: 96px; z-index: 6;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 30px -10px rgba(201,162,39,0.6);
  }
  .m-bottomnav {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    height: 82px; background: rgba(20,23,28,0.85); backdrop-filter: blur(18px);
    border-top: 1px solid var(--line-on-dark);
    display: flex; align-items: center; justify-content: space-around;
    padding-bottom: 14px;
  }
  .m-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 9.5px/1 var(--font-body); color: var(--ink-on-dark-dim); }
  .m-nav-item.active { color: var(--gold-soft); }
  .m-nav-item .dot-icon { width: 20px; height: 20px; border-radius: 6px; background: currentColor; opacity: 0.9; }
</style>
</head>
<body>
<div class="scene mobile on-dark m-stage">
  <div class="m-hero">
    <div class="photo-surface" style="background:
      radial-gradient(140% 90% at 50% 0%, rgba(220,195,114,0.3), transparent 55%),
      linear-gradient(180deg, #2a2d33, #0d0f13 100%);"></div>
    <div class="grain"></div>
    <div class="m-top">
      <div class="m-mark"><div style="width:8px;height:8px;border-radius:50%;background:var(--gold);"></div>Darwesh</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ivory)" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </div>
    <div class="content">
      <div class="eyebrow">Kurdistan · Real Estate</div>
      <h1>Find home.<br>Build right.</h1>
    </div>
  </div>

  <div class="m-search">
    <div class="row"><div class="tab active">Buy</div><div class="tab">Rent</div><div class="tab">Projects</div></div>
    <input placeholder="City or neighborhood…" readonly>
  </div>

  <div class="m-section">
    <h3>Featured projects</h3>
    <div class="m-row">
      <div class="m-card"><span>Sartip Heights</span></div>
      <div class="m-card"><span>Garden City</span></div>
      <div class="m-card"><span>Peace Towers</span></div>
    </div>
  </div>

  <div class="m-section">
    <h3>Services</h3>
    <div class="m-row">
      <div class="m-card" style="background:linear-gradient(160deg,#2f3b2e,#14171c);"><span>Landscaping</span></div>
      <div class="m-card" style="background:linear-gradient(160deg,#3a2f2a,#14171c);"><span>Engineering</span></div>
      <div class="m-card" style="background:linear-gradient(160deg,#2a2d33,#14171c);"><span>Legal</span></div>
    </div>
  </div>

  <div class="m-fab">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#201705" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
  </div>

  <div class="m-bottomnav">
    <div class="m-nav-item active"><div class="dot-icon"></div>Home</div>
    <div class="m-nav-item"><div class="dot-icon"></div>Map</div>
    <div class="m-nav-item"><div class="dot-icon"></div>Challenge</div>
    <div class="m-nav-item"><div class="dot-icon"></div>Account</div>
  </div>
</div>
</body>
</html>
