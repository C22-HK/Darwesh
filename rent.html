<!-- CLIENT-04 (CLIENT_SIDE_SECURITY_REVIEW.md): meta-delivered CSP. GitHub Pages
can't set HTTP headers, so this is the only delivery mechanism available.
unsafe-inline on script and style sources is a deliberate, documented
tradeoff: this codebase has no build step and dozens of inline script/style
blocks per page; blocking them needs a nonce (impossible with no per-request
server logic) or a SHA-256 hash per block kept in lockstep with every future
edit across 21 pages, a real ongoing cost not taken on here. What this DOES
still provide: an injected payload (e.g. CLIENT-01/02, both since fixed) can
no longer load a script from an attacker-controlled domain or exfiltrate data
via fetch or img to one. Note: frame-ancestors, report-uri, and sandbox are
silently ignored when CSP is delivered via a meta tag (a browser spec rule,
not an oversight here); this can never provide clickjacking protection or
violation reporting. -->

<script>
// ---------------------------------------------------------------------
// Real for-rent listings, loaded live from Firestore's `listings`
// collection -- the same collection buy.html/buy-rent-map.html read.
// firestore.rules only allows a public read when the query is
// constrained to private==false AND status=='active' (isListingPubliclyVisible());
// an unconstrained or under-constrained query is denied outright, and
// hasSaneListingNumbers() plus the create/update field allowlists mean
// there is no server-side concept of "monthlyPrice"/"furnished"/"deposit"
// -- `price` is reused for whatever dealType the listing has (rent shows
// it with a "/mo" suffix client-side, same convention as index.html's
// featured-listings card and listing.html's own price formatter), and
// "furnished" can only ever be a string inside the generic `amenities`
// array. No rent-specific field is invented here that the schema
// doesn't actually support.
//
// Query strategy: one bounded, single-shot getDocs() (not a realtime
// listener) with three equality filters (private/status/dealType) and
// limit(200) -- the exact same shape buy-rent-map.html already runs in
// production for its own Rent toggle, so this needs no new Firestore
// index. `projects` is fetched the same bounded way (limit 200) in
// parallel via Promise.all, so a project/community name lookup never
// costs a second network round-trip or a per-listing read. Every other
// filter (city/neighborhood text, property type, beds, baths, price,
// area, furnished, verified) and every sort option is then applied
// client-side over that single already-fetched, already-bounded array --
// there is no unbounded collection download and no per-filter-change
// network request.
// ---------------------------------------------------------------------
const IMAGES = {
  villa: "https://lh3.googleusercontent.com/aida-public/AB6AXuCadS8UKt5hw5G1f_11HN8IvXcjYIZjWdPEERcDXd7KlV6jDQi57D0dt008Ie6vDXaNmO7hrcfiT7OzbLSUzfuCV_ENwWUyEtSuVhmETPfWffweOLgJjF_j3dEu3dINZDVR0ECA1sBUvdWi0ndRERfu2XwOKvFh_0UXtXFvpWNHnBWZSsNKrcoWexb74a4iFiK1IYboC_Ply436SLbKtrliX0ysrJ3K-rI6YstSyhy-xkAb0zjfwVy8",
  office: "https://lh3.googleusercontent.com/aida-public/AB6AXuDs7uRtP1wPjHeH8O6ZujWse4l9HjMt-6w9Q9P1ncr1PPhRw2ebXVPRkUnwLkqAk-DbyBUFjgvUEFWSiPyhDR4QnmPtoRI5aB8S_BpEzqMYUUHbU1xcBsULFrdpD1JA21p4e8hlxPBXS8ovBoaGYL2ihSjRJhspv_nN06GICbhH4Fojz4U9z4OMsRUJKwiUbLPc3Z5rhs618RinH5AQU53UkPtMapT0-Q3J5qHjpSjOthmZnuQ8gw1Z",
  apartment: "https://lh3.googleusercontent.com/aida-public/AB6AXuDii6xTkNXKTsc2msOvTgk_GQRcMSy050_Dub19-3hbsr_7hP2rG706xznOp3AeUptsrkRFQRdDAyRVv34ZC0SUkPNGIL-UJT7JD0cy09YlNtODFbsnXaEF8zJd8aCvsZTCEWBKPj1XViF2xaNk4S5ik9wCMk8rl0kk9lg4Fo1HxPTg6ko3xaad2_K6da2mIldQlUkjAAy1sB7EUWp2DDwZ3zv679mzelRkHr4tPHRSXmBA6Aq8Vhjs",
  land: "https://lh3.googleusercontent.com/aida-public/AB6AXuAXnrKs6P8OU65PpWIRAwU_OSyMRNE-jzLjdRFlnv8r7CdpjKKmQYsyagFZAYcSomNUaaaWMdZ5NKWmR7gTdFiFmOMW5ENypMupjYZ_16_Fpnc45Z-64i9QvvrLviQ3NEVhquVw9vxA1pgajqqX1eXu01BSZuHfB_XmkK_WLyr9US6n3uj-J_aFiv_Fls37St279KqfAlz85QFCAR9OkxjkSxywCHzANk-U7hsVzTONXr_uvaFiTlaz",
  renovated: "https://lh3.googleusercontent.com/aida-public/AB6AXuDGtaxWIcftb-EP9u-NdUy9r0UdUqR-6283vKdSpaVQs9ETleHzA7y7MF8dYNCKDoHPlLY6GhmUWLw5VKGOVQ3-Y0hzMxBClpFUGWcSELBJ20pyEDKDhZrN8NEs6YC9QyvFhSon6LnGx_6MSq7BcHr2scHlMPBi5nyRE4ywT8VFMmPUL4lS-1Qy1h9YVNKXLXudDq3luKINQvUb9XzQWgKg4XuPquVIHraqZKXW8AeLZbfriOSyCfPV"
};
IMAGES.house = IMAGES.villa;
IMAGES.building = IMAGES.office;
IMAGES.shop = IMAGES.office;
IMAGES.commercialProperty = IMAGES.office;

let LISTINGS = [];
let PROJECTS = {};
let listingsLoaded = false;

function tsMillis(t) {
  if (!t) return 0;
  if (typeof t.toMillis === 'function') return t.toMillis();
  if (typeof t.seconds === 'number') return t.seconds * 1000;
  return 0;
}

async function fetchListingsRaw() {
  const [{ db, getDocs }, storeMod] = await Promise.all([
    import('./js/firebase-init.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
  ]);
  const { collection, query, where, limit } = storeMod;
  const q = query(
    collection(db, 'listings'),
    where('private', '==', false),
    where('status', '==', 'active'),
    where('dealType', '==', 'rent'),
    limit(200)
  );
  const snap = await getDocs(q);
  const docs = [];
  snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
  return docs;
}

async function fetchProjects() {
  try {
    const [{ db, getDocs }, storeMod] = await Promise.all([
      import('./js/firebase-init.js'),
      import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
    ]);
    const { collection, query, limit } = storeMod;
    const snap = await getDocs(query(collection(db, 'projects'), limit(200)));
    const map = {};
    snap.forEach(d => { map[d.id] = d.data(); });
    return map;
  } catch (e) {
    return {};
  }
}

async function loadAll() {
  try {
    const [rawListings, projects] = await Promise.all([fetchListingsRaw(), fetchProjects()]);
    PROJECTS = projects;
    LISTINGS = rawListings.map(d => ({
      id: d.id,
      title: d.title || d.address || 'Property',
      city: d.city || '',
      address: d.address || '',
      type: d.propertyType || '',
      price: Number(d.price) || 0,
      beds: Number(d.beds) || 0,
      baths: Number(d.baths) || 0,
      sqft: Number(d.sqft) || 0,
      img: d.img || IMAGES[d.propertyType] || IMAGES.villa,
      verified: !!d.verified,
      furnished: Array.isArray(d.amenities) && d.amenities.includes('furnished'),
      createdAtMs: tsMillis(d.createdAt),
      projectId: d.projectId || null,
      projectName: (d.projectId && projects[d.projectId] && projects[d.projectId].name) || ''
    }));
  } catch (e) {
    LISTINGS = [];
  }
  listingsLoaded = true;
  render();
}
loadAll();

// ---------------------------------------------------------------------
// Favorites (Firebase). NOTE: every favorite doc across the whole site
// (buy.html, map.html, listing.html) uses the 'buy-' + id prefix
// regardless of dealType -- listing.html:349/370/377 hardcodes it for
// BOTH sale and rent listings, since it's the single shared detail page
// for both. Using a different prefix here ('rent-') would silently
// desync a rental's favorite state between this page and listing.html
// (two different subcollection docs for the same listing). Kept
// identical to the existing convention on purpose, not a naming choice
// made fresh for this page.
// ---------------------------------------------------------------------
let favAuth = null, favDb = null, favFns = null;
let favoriteIds = new Set();

function showToast(msg, icon) {
  const el = document.getElementById('rentToast');
  el.innerHTML = `${icon ? `<span class="material-symbols-outlined text-[18px]">${icon}</span>` : ''}<span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

async function initFavorites() {
  const [{ auth, db, getDocs, addDoc, setDoc, deleteDoc }, authMod, storeMod] = await Promise.all([
    import('./js/firebase-init.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
  ]);
  favAuth = auth; favDb = db;
  favFns = { ...authMod, ...storeMod, getDocs, addDoc, setDoc, deleteDoc };
  favFns.onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await favFns.getDocs(favFns.collection(db, 'users', user.uid, 'favorites'));
      favoriteIds = new Set();
      snap.forEach(d => favoriteIds.add(d.id));
    } else {
      favoriteIds = new Set();
    }
    render();
  });
}
initFavorites();

async function toggleFavorite(id) {
  if (!favAuth || !favAuth.currentUser) {
    showToast(tr('listing.loginToSave', 'Log in to save favorites'), 'favorite');
    setTimeout(() => { window.location.href = 'login.html'; }, 900);
    return;
  }
  const uid = favAuth.currentUser.uid;
  const idStr = 'buy-' + id;
  const l = LISTINGS.find(x => x.id === id);
  const ref = favFns.doc(favDb, 'users', uid, 'favorites', idStr);
  if (favoriteIds.has(idStr)) {
    favoriteIds.delete(idStr);
    await favFns.deleteDoc(ref);
    showToast(tr('listing.removedFromFavorites', 'Removed from favorites'), 'favorite');
  } else {
    favoriteIds.add(idStr);
    await favFns.setDoc(ref, {
      listingId: idStr, address: l.address, city: l.city,
      priceLabel: fmtPrice(l.price), img: l.img, savedAt: favFns.serverTimestamp()
    });
    showToast(tr('listing.savedToFavorites', 'Saved to favorites'), 'favorite');
  }
  render();
}

function tr(key, fallback) { return (window.t && window.t(key)) || fallback; }
function fmtPrice(p) { return "$" + p.toLocaleString() + "/mo"; }

function card(l) {
  const cityLabelText = (window.cityLabel && window.cityLabel(l.city)) || l.city || '';
  const badge = l.verified ? `<div class="home-property-badge absolute top-4 end-4 backdrop-blur-sm px-3 py-1 flex items-center gap-1 z-10">
      <span class="material-symbols-outlined text-[14px]">verified</span>
      <span class="font-label-caps text-label-caps text-[11px]">${tr('common.verified', 'Verified')}</span>
    </div>` : '';
  const favActive = favoriteIds.has('buy-' + l.id);
  const favBtn = `<button type="button" onclick="event.preventDefault(); event.stopPropagation(); toggleFavorite('${l.id}');" class="absolute top-3 start-3 w-8 h-8 rounded-full bg-primary/60 backdrop-blur-sm flex items-center justify-center hover:bg-primary/80 transition-colors z-10" aria-label="Save to favorites">
      <span class="material-symbols-outlined text-[18px] ${favActive ? 'text-secondary' : 'text-white'}" style="font-variation-settings: 'FILL' ${favActive ? 1 : 0};">favorite</span>
    </button>`;
  const project = l.projectName ? `<p class="home-property-meta font-data-mono text-data-mono text-[12px] mb-1 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">domain</span>${escapeHtml(l.projectName)}</p>` : '';
  const img = isSafeHttpUrl(l.img) ? escapeHtml(l.img) : IMAGES.villa;
  return `
  <a href="listing.html?id=${encodeURIComponent(l.id)}" class="home-property-card relative overflow-hidden group block">
    <div class="home-property-media relative h-48 w-full overflow-hidden">
      <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${img}" alt="${escapeHtml(l.title)}" loading="lazy" decoding="async"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>
      <div class="home-property-media-fallback absolute inset-0 flex-col items-center justify-center gap-1" style="display:none;">
        <span class="material-symbols-outlined text-[32px]">home_work</span>
      </div>
      ${favBtn}
      ${badge}
    </div>
    <div class="p-5">
      ${project}
      <h3 class="home-property-title font-headline-md text-[18px] leading-tight mb-1.5">${escapeHtml(l.title)}</h3>
      <p class="home-property-meta font-body-md text-body-md mb-4 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[16px]">location_on</span> ${l.address ? escapeHtml(l.address) + ', ' : ''}${escapeHtml(cityLabelText)}
      </p>
      <div class="home-property-divider flex justify-between items-center mb-4 pb-4 border-b">
        <div class="home-property-meta flex gap-4">
          <span class="font-data-mono text-data-mono flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">bed</span>${l.beds}</span>
          <span class="font-data-mono text-data-mono flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">bathtub</span>${l.baths}</span>
          <span class="font-data-mono text-data-mono flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">square_foot</span>${l.sqft}m²</span>
          ${l.furnished ? `<span class="font-data-mono text-data-mono flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">chair</span></span>` : ''}
        </div>
      </div>
      <div class="flex justify-between items-center">
        <span class="home-property-price font-headline-md text-headline-md">${fmtPrice(l.price)}</span>
        <span class="home-property-cta font-label-caps text-label-caps">${tr('common.details', 'Details')}</span>
      </div>
    </div>
  </a>`;
}

function skeletonCard() {
  return `<div class="rounded-xl overflow-hidden border border-outline-variant">
    <div class="ps-skeleton h-48 w-full"></div>
    <div class="p-5 space-y-2">
      <div class="ps-skeleton h-4 w-3/4"></div>
      <div class="ps-skeleton h-3 w-1/2"></div>
      <div class="ps-skeleton h-3 w-full mt-3"></div>
      <div class="ps-skeleton h-6 w-1/3 mt-3"></div>
    </div>
  </div>`;
}

function render() {
  const grid = document.getElementById('rentListingsGrid');
  const empty = document.getElementById('rentEmptyState');

  if (!listingsLoaded) {
    grid.innerHTML = Array.from({ length: 6 }).map(skeletonCard).join('');
    document.getElementById('rentResultCount').textContent = tr('map.loadingListings', 'Loading listings…');
    empty.classList.add('hidden');
    return;
  }

  const q = document.getElementById('rentSearchInput').value.trim().toLowerCase();
  const type = document.getElementById('rentTypeFilter').value;
  const bedsMin = Number(document.getElementById('rentBedsFilter').value) || 0;
  const bathsMin = Number(document.getElementById('rentBathsFilter').value) || 0;
  const minPrice = Number(document.getElementById('rentMinPrice').value) || 0;
  const maxPrice = Number(document.getElementById('rentMaxPrice').value) || 0;
  const minArea = Number(document.getElementById('rentMinArea').value) || 0;
  const maxArea = Number(document.getElementById('rentMaxArea').value) || 0;
  const furnishedOnly = document.getElementById('rentFurnished').checked;
  const verifiedOnly = document.getElementById('rentVerified').checked;
  const sort = document.getElementById('rentSortFilter').value;

  let list = LISTINGS.filter(l => {
    if (q && !(l.city.toLowerCase().includes(q) || l.address.toLowerCase().includes(q) || l.title.toLowerCase().includes(q))) return false;
    if (type !== 'all' && l.type !== type) return false;
    if (bedsMin && l.beds < bedsMin) return false;
    if (bathsMin && l.baths < bathsMin) return false;
    if (minPrice && l.price < minPrice) return false;
    if (maxPrice && l.price > maxPrice) return false;
    if (minArea && l.sqft < minArea) return false;
    if (maxArea && l.sqft > maxArea) return false;
    if (furnishedOnly && !l.furnished) return false;
    if (verifiedOnly && !l.verified) return false;
    return true;
  });

  if (sort === 'price-asc') list = list.slice().sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') list = list.slice().sort((a, b) => b.price - a.price);
  else if (sort === 'newest') list = list.slice().sort((a, b) => b.createdAtMs - a.createdAtMs);

  grid.innerHTML = list.map(card).join('');
  document.getElementById('rentResultCount').textContent = `${list.length} ${tr('rent.propertiesFound', 'properties for rent')}`;
  empty.classList.toggle('hidden', list.length > 0);
}

// Debounce the free-text search input specifically (the only high-
// frequency input here); every other filter is a discrete select/
// checkbox change and re-renders immediately.
let searchDebounce;
document.getElementById('rentSearchInput').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(render, 250);
});
['rentTypeFilter', 'rentBedsFilter', 'rentMinPrice', 'rentMaxPrice', 'rentSortFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});
document.getElementById('rentSearchBtn').addEventListener('click', render);

// Advanced filters drawer -- one drawer, two entry points (desktop
// "Advanced Filters" link, mobile "Filters" button), mirroring
// buy-rent-map.html's single drmFilterDrawer pattern rather than
// building two separate filter UIs.
function openDrawer() {
  document.getElementById('rentFilterDrawer').classList.remove('hidden');
  document.getElementById('rentAdvToggle').setAttribute('aria-expanded', 'true');
}
function closeDrawer() {
  document.getElementById('rentFilterDrawer').classList.add('hidden');
  document.getElementById('rentAdvToggle').setAttribute('aria-expanded', 'false');
}
document.getElementById('rentAdvToggle').addEventListener('click', openDrawer);
document.getElementById('rentMobileFilterBtn').addEventListener('click', openDrawer);
document.getElementById('rentFilterCloseBtn').addEventListener('click', closeDrawer);
document.getElementById('rentFilterDrawer').addEventListener('click', (e) => {
  if (e.target.id === 'rentFilterDrawer') closeDrawer();
});
document.getElementById('rentFilterApplyBtn').addEventListener('click', () => { closeDrawer(); render(); });
document.getElementById('rentFilterClearBtn').addEventListener('click', () => {
  document.getElementById('rentBathsFilter').value = '0';
  document.getElementById('rentMinArea').value = '';
  document.getElementById('rentMaxArea').value = '';
  document.getElementById('rentFurnished').checked = false;
  document.getElementById('rentVerified').checked = false;
  render();
});

// URL prefill (?city=, ?type=) -- same convention buy.html supports, so
// a future "browse this city" link can deep-link into Rent the same way.
const urlParams = new URLSearchParams(window.location.search);
const urlType = urlParams.get('type');
if (urlType && ['house', 'villa', 'apartment', 'land', 'building', 'office', 'shop', 'commercialProperty'].includes(urlType)) {
  document.getElementById('rentTypeFilter').value = urlType;
}
const urlCity = urlParams.get('city');
if (urlCity) document.getElementById('rentSearchInput').value = urlCity;

render();
document.addEventListener('darwesh:langchange', render);
</script>
