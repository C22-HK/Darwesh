<!-- CLIENT-04 (CLIENT_SIDE_SECURITY_REVIEW.md): meta-delivered CSP, same
tradeoff as every other page in this codebase (see buy.html/map.html for
the full rationale). maps.googleapis.com/maps.gstatic.com are added here
specifically for js/maps-core.js -- this is the first page in the repo
that actually loads Google Maps (gracefully inert if no key is
configured, see js/maps-core.js's own header comment).

'wasm-unsafe-eval' (script-src): Google's own Maps JavaScript API bundle
(loaded from maps.googleapis.com, not any code in this repo -- grepped
this codebase for eval()/new Function()/string-form setTimeout and found
none) compiles WebAssembly as part of its modern map-rendering engine,
which a strict CSP with neither 'unsafe-eval' nor 'wasm-unsafe-eval'
blocks, producing a "script-src ... eval" console violation and a blank
map with no other visible error. 'wasm-unsafe-eval' is the CSP-standard,
narrower alternative purpose-built for exactly this: it permits
WebAssembly.compile()/instantiate() ONLY -- it does NOT permit eval(),
new Function(), or string-form setTimeout/setInterval the way
'unsafe-eval' would. Deliberately not using the broader 'unsafe-eval'
here; if a live console check ever shows the SAME violation persisting
after this change, that would mean the blocked call is genuine eval()
rather than WASM, and needs separate investigation rather than reflexively
widening this grant.

https://*.googleapis.com / https://*.gstatic.com (img-src, connect-src):
after wasm-unsafe-eval fixed the script-src block, the map still rendered
as a dark/blank canvas -- Roadmap/Satellite/Hybrid chrome and the map
container both render (those are this page's own DOM, not proof the
underlying google.maps.Map succeeded), but no tiles paint and no JS
exception is thrown, because the Map constructor completes synchronously
before the SDK's own async tile/asset requests go out. Those requests hit
Google-operated subdomains this policy did not name (only the bootstrap
loader's own host, maps.googleapis.com, and maps.gstatic.com were listed) --
Google's own published CSP guidance for the Maps JavaScript API recommends
the wildcarded https://*.googleapis.com / https://*.gstatic.com precisely
because it does not publish, and can change without notice, which specific
subdomain serves tiles/imagery/markers for a given rendering path (vector
vs. raster vs. satellite/hybrid) -- pinning one guessed hostname here would
be fragile against exactly this class of regression. js/maps-core.js now
also reports any securitypolicyviolation naming a google/gstatic domain
straight to the console (blockedURI is origin-only for cross-origin
resources by spec, so this can never leak the API key), so a live check
after this change can confirm directly whether it was sufficient rather
than guessing further. -->

<script type="module">
import { db, getDocs } from './js/firebase-init.js';
import { collection, query, where, limit } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
import { isConfigured, initMap, createMarker, loadGoogleMaps } from './js/maps-core.js';

// ---------------------------------------------------------------------
// State + URL persistence. Every filter and the map's own center/zoom
// round-trips through the query string (history.replaceState, debounced)
// so a shared/bookmarked link reproduces the same view -- per the
// explicit "URL-persisted map/filter state" requirement.
// ---------------------------------------------------------------------
const DEFAULT_CENTER = { lat: 36.19, lng: 44.01 }; // Erbil
const state = {
  dealType: 'sale',
  q: '', minPrice: null, maxPrice: null, beds: 0, baths: 0,
  minArea: null, maxArea: null, types: [], readiness: 'any',
  projectId: '', furnished: false, verified: false, installment: false,
  center: DEFAULT_CENTER, zoom: 11,
};

function readStateFromUrl() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('deal') === 'rent') state.dealType = 'rent';
  if (p.get('q')) state.q = p.get('q');
  if (p.get('minPrice')) state.minPrice = Number(p.get('minPrice'));
  if (p.get('maxPrice')) state.maxPrice = Number(p.get('maxPrice'));
  if (p.get('beds')) state.beds = Number(p.get('beds'));
  if (p.get('baths')) state.baths = Number(p.get('baths'));
  if (p.get('minArea')) state.minArea = Number(p.get('minArea'));
  if (p.get('maxArea')) state.maxArea = Number(p.get('maxArea'));
  if (p.get('types')) state.types = p.get('types').split(',').filter(Boolean);
  if (p.get('readiness')) state.readiness = p.get('readiness');
  if (p.get('projectId')) state.projectId = p.get('projectId');
  state.furnished = p.get('furnished') === '1';
  state.verified = p.get('verified') === '1';
  state.installment = p.get('installment') === '1';
  if (p.get('lat') && p.get('lng')) state.center = { lat: Number(p.get('lat')), lng: Number(p.get('lng')) };
  if (p.get('zoom')) state.zoom = Number(p.get('zoom'));
}
let writeUrlTimer = null;
function writeStateToUrl() {
  clearTimeout(writeUrlTimer);
  writeUrlTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (state.dealType === 'rent') p.set('deal', 'rent');
    if (state.q) p.set('q', state.q);
    if (state.minPrice) p.set('minPrice', String(state.minPrice));
    if (state.maxPrice) p.set('maxPrice', String(state.maxPrice));
    if (state.beds) p.set('beds', String(state.beds));
    if (state.baths) p.set('baths', String(state.baths));
    if (state.minArea) p.set('minArea', String(state.minArea));
    if (state.maxArea) p.set('maxArea', String(state.maxArea));
    if (state.types.length) p.set('types', state.types.join(','));
    if (state.readiness !== 'any') p.set('readiness', state.readiness);
    if (state.projectId) p.set('projectId', state.projectId);
    if (state.furnished) p.set('furnished', '1');
    if (state.verified) p.set('verified', '1');
    if (state.installment) p.set('installment', '1');
    p.set('lat', state.center.lat.toFixed(4));
    p.set('lng', state.center.lng.toFixed(4));
    p.set('zoom', String(state.zoom));
    history.replaceState(null, '', '?' + p.toString());
  }, 300);
}
readStateFromUrl();

// ---------------------------------------------------------------------
// Data. Bounded, one-shot, equality-filtered reads only -- no unlimited
// realtime listener, no unfiltered full-collection download. See
// docs/GOOGLE_MAPS_CONFIGURATION.md §7 for the full strategy this
// mirrors: dealType/private/status are three plain equality filters
// (Firestore serves pure-equality compound queries from its automatic
// per-field indexes -- no composite index needed, same reason buy.html's
// existing private+status query has never needed one), capped with
// limit(200) so a popular deal type can never trigger an unbounded read.
// "Search This Area" / "Draw Search Area" then narrow this already-
// bounded, already-fetched set to the visible/drawn region client-side
// (§7.2's documented "coarse first cut" -- a full geohash-indexed
// re-query per viewport pan is future work once listing volume justifies
// it, not built speculatively here).
// ---------------------------------------------------------------------
let ALL_LISTINGS = [];
let PROJECTS_BY_ID = new Map();
let listingsLoaded = false;

// fetchProjects()/populateProjectFilter() and fetchListingsRaw()/
// enrichListings() are split from loadProjects()/loadListings() (below,
// kept as their public entry points) specifically so the bootstrap
// sequence at the bottom of this script can run the projects read and the
// listings read CONCURRENTLY (Promise.all) instead of one strictly after
// the other -- listings only need project data to ENRICH already-fetched
// results (readiness/installment/projectName), not to start the query, so
// making listings wait for projects to finish first was adding a full
// extra network round-trip to first content paint for no reason.
async function fetchProjects() {
  try {
    const snap = await getDocs(query(collection(db, 'projects'), limit(200)));
    const map = new Map();
    snap.forEach((d) => map.set(d.id, d.data()));
    return map;
  } catch (e) {
    return new Map(); // fails closed to "no project data" -- readiness/installment filters simply match nothing project-related rather than crash
  }
}
function populateProjectFilter() {
  const sel = document.getElementById('drmProject');
  for (const [id, p] of PROJECTS_BY_ID) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = p.name || id;
    sel.appendChild(opt);
  }
}
async function loadProjects() {
  PROJECTS_BY_ID = await fetchProjects();
  populateProjectFilter();
}

async function fetchListingsRaw() {
  const q = query(
    collection(db, 'listings'),
    where('private', '==', false),
    where('status', '==', 'active'),
    where('dealType', '==', state.dealType),
    limit(200)
  );
  const snap = await getDocs(q);
  const docs = [];
  snap.forEach((d) => docs.push({ id: d.id, ...d.data() }));
  return docs;
}
function enrichListings(docs) {
  return docs
    .filter((d) => typeof d.lat === 'number' && typeof d.lng === 'number')
    .map((d) => {
      const project = d.projectId ? PROJECTS_BY_ID.get(d.projectId) : null;
      return {
        id: d.id,
        title: d.title || d.address || 'Property',
        city: d.city || '', address: d.address || '',
        type: d.propertyType || '',
        price: Number(d.price) || 0,
        beds: Number(d.beds) || 0, baths: Number(d.baths) || 0, sqft: Number(d.sqft) || 0,
        lat: d.lat, lng: d.lng,
        img: d.img || '',
        verified: !!d.verified,
        furnished: Array.isArray(d.amenities) && d.amenities.includes('furnished'),
        projectId: d.projectId || null,
        projectName: project ? (project.name || '') : '',
        readiness: project ? (project.constructionStatus === 'completed' ? 'ready' : 'under_construction') : 'ready',
        installmentAvailable: !!(project && project.installmentAvailable),
      };
    });
}
// Race guard: the Buy/Rent toggle calls this directly on every click with
// no debounce. Without a generation token, clicking Rent then quickly
// Buy could let the (now-stale) Rent response land AFTER the Buy
// response if requests settle out of order, overwriting ALL_LISTINGS
// with the wrong deal type's data while the toggle UI (and fmtPrice(),
// which reads state.dealType for its "/mo" suffix) shows "Buy" --
// rental prices rendered as if they were sale prices, wrong information
// shown to a real shopper. Same pattern as rent.html's queryGeneration.
let listingsRequestGeneration = 0;
async function loadListings() {
  const myGeneration = ++listingsRequestGeneration;
  listingsLoaded = false;
  render();
  let nextListings;
  try {
    const docs = await fetchListingsRaw();
    nextListings = enrichListings(docs);
  } catch (e) {
    nextListings = [];
  }
  if (myGeneration !== listingsRequestGeneration) return; // superseded by a newer toggle click
  ALL_LISTINGS = nextListings;
  listingsLoaded = true;
  render();
}

// ---------------------------------------------------------------------
// Filtering (client-side, over the already-bounded fetched set only).
// ---------------------------------------------------------------------
function passesFilters(l) {
  if (state.q) {
    const needle = state.q.toLowerCase();
    if (!l.city.toLowerCase().includes(needle) && !l.address.toLowerCase().includes(needle) && !l.title.toLowerCase().includes(needle)) return false;
  }
  if (state.minPrice && l.price < state.minPrice) return false;
  if (state.maxPrice && l.price > state.maxPrice) return false;
  if (state.beds && l.beds < state.beds) return false;
  if (state.baths && l.baths < state.baths) return false;
  if (state.minArea && l.sqft < state.minArea) return false;
  if (state.maxArea && l.sqft > state.maxArea) return false;
  if (state.types.length && !state.types.includes(l.type)) return false;
  if (state.readiness !== 'any' && l.readiness !== state.readiness) return false;
  if (state.projectId && l.projectId !== state.projectId) return false;
  if (state.furnished && !l.furnished) return false;
  if (state.verified && !l.verified) return false;
  if (state.installment && !l.installmentAvailable) return false;
  if (areaFilter && !areaFilter(l)) return false;
  return true;
}

// Spatial narrowing set by "Search This Area" (current viewport bounds)
// or "Draw Search Area" (a drawn circle) -- null means no spatial filter
// active (the default / after Reset Area).
let areaFilter = null;

function fmtPrice(l) {
  const suffix = state.dealType === 'rent' ? '/mo' : '';
  return '$' + l.price.toLocaleString() + suffix;
}
function shortPrice(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + n;
}

let selectedId = null;
let markerById = new Map();
let clusterMarkers = [];

function tr(key, fallback) { return (window.t && window.t(key)) || fallback; }

function render() {
  const countEl = document.getElementById('drmResultCount');
  const listEl = document.getElementById('drmListingsList');
  const emptyEl = document.getElementById('drmEmptyState');

  if (!listingsLoaded) {
    countEl.textContent = tr('map.loadingListings', 'Loading listings…');
    // Lightweight skeleton instead of a blank panel while the first
    // listings query is in flight -- pure CSS pulse, no extra request.
    listEl.innerHTML = Array.from({ length: 4 }).map(() => `
      <div class="drm-skeleton-card flex bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden animate-pulse">
        <div class="w-28 h-24 flex-none bg-surface-container"></div>
        <div class="p-3 flex-1 min-w-0 space-y-2">
          <div class="h-4 bg-surface-container rounded w-3/4"></div>
          <div class="h-3 bg-surface-container rounded w-1/2"></div>
          <div class="h-4 bg-surface-container rounded w-1/3 mt-3"></div>
        </div>
      </div>`).join('');
    emptyEl.classList.add('hidden');
    return;
  }

  const visible = ALL_LISTINGS.filter(passesFilters);
  countEl.textContent = visible.length + ' ' + (state.dealType === 'rent' ? tr('drm.forRent', 'for rent') : tr('drm.forSale', 'for sale'));
  emptyEl.classList.toggle('hidden', visible.length > 0);

  listEl.innerHTML = visible.map((l) => `
    <a href="listing.html?id=${encodeURIComponent(l.id)}" data-id="${l.id}" class="drm-card block bg-surface-container-lowest rounded-xl border border-outline-variant hover:shadow-md transition-all overflow-hidden ${l.id === selectedId ? 'ring-2 ring-secondary' : ''}">
      <div class="flex">
        <div class="w-28 h-24 flex-none bg-surface-container overflow-hidden">${l.img && isSafeHttpUrl(l.img) ? `<img class="w-full h-full object-cover" src="${escapeHtml(l.img)}" loading="lazy" decoding="async"/>` : ''}</div>
        <div class="p-3 flex-1 min-w-0">
          <p class="font-headline-md text-[15px] text-on-surface truncate">${escapeHtml(l.title)}</p>
          <p class="font-body-md text-[13px] text-on-surface-variant truncate">${escapeHtml(l.address)}, ${escapeHtml(l.city)}</p>
          <div class="flex items-center gap-2 mt-1 text-[12px] text-on-surface-variant">
            <span>${l.beds} ${tr('common.beds','bd')}</span><span>${l.baths} ${tr('common.baths','ba')}</span><span>${l.sqft}m²</span>
          </div>
          <p class="font-headline-md text-[15px] text-primary mt-1">${fmtPrice(l)}${l.verified ? ` <span class="material-symbols-outlined text-[14px] text-tertiary align-middle">verified</span>` : ''}</p>
        </div>
      </div>
    </a>`).join('');

  listEl.querySelectorAll('.drm-card').forEach((el) => {
    el.addEventListener('mouseenter', () => highlightMarker(el.dataset.id, false));
    el.addEventListener('click', (e) => { /* allow navigation to listing.html */ });
  });

  renderMarkers(visible);
}

function highlightMarker(id, pan) {
  selectedId = id;
  document.querySelectorAll('.drm-card').forEach((el) => {
    const isMatch = el.dataset.id === id;
    el.classList.toggle('ring-2', isMatch);
    el.classList.toggle('ring-secondary', isMatch);
  });
  const m = markerById.get(id);
  if (m && m.element) {
    document.querySelectorAll('.drm-price-pin').forEach((p) => p.classList.remove('selected'));
    m.element.classList.add('selected');
  }
  if (pan && m && window.__drmMap) window.__drmMap.panTo(m.position);
}

// ---------------------------------------------------------------------
// Map rendering: price-pin markers + simple grid clustering. Clustering
// groups markers whose rounded lat/lng (grid cell size shrinks as zoom
// increases) collide, replacing them with one badge showing the count --
// this runs entirely over the already-bounded, already-fetched result
// set, never a fresh network call.
// ---------------------------------------------------------------------
function clusterListings(list, zoom) {
  const cellSize = Math.max(0.002, 2 / Math.pow(2, zoom)); // degrees, shrinks as you zoom in
  const cells = new Map();
  for (const l of list) {
    const key = Math.round(l.lat / cellSize) + ':' + Math.round(l.lng / cellSize);
    if (!cells.has(key)) cells.set(key, []);
    cells.get(key).push(l);
  }
  return [...cells.values()];
}

async function renderMarkers(visible) {
  const google = await loadGoogleMaps();
  if (!google || !window.__drmMap) return;
  // .setMap(null) (not a direct el.remove()) so each OverlayView's own
  // onRemove() runs and its 'idle'/projection listeners are actually
  // detached -- removing just the DOM element would leave the overlay
  // instance itself still attached to the map, redrawing a detached
  // element's position on every pan/zoom forever.
  markerById.forEach((m) => m.overlay?.setMap(null));
  markerById = new Map();
  clusterMarkers.forEach((m) => m.overlay?.setMap(null));
  clusterMarkers = [];

  const zoom = window.__drmMap.getZoom() || state.zoom;
  const groups = clusterListings(visible, zoom);

  for (const group of groups) {
    if (group.length === 1) {
      const l = group[0];
      const el = document.createElement('div');
      el.className = 'drm-price-pin' + (l.verified ? ' verified' : '');
      el.textContent = shortPrice(l.price);
      el.addEventListener('click', () => highlightMarker(l.id, true));
      const overlay = placeCustomOverlay(el, { lat: l.lat, lng: l.lng });
      markerById.set(l.id, { element: el, overlay, position: { lat: l.lat, lng: l.lng } });
    } else {
      const avgLat = group.reduce((s, l) => s + l.lat, 0) / group.length;
      const avgLng = group.reduce((s, l) => s + l.lng, 0) / group.length;
      const el = document.createElement('div');
      el.className = 'drm-cluster-pin';
      el.textContent = String(group.length);
      el.addEventListener('click', () => { window.__drmMap.setZoom(Math.min(20, zoom + 2)); window.__drmMap.panTo({ lat: avgLat, lng: avgLng }); });
      const overlay = placeCustomOverlay(el, { lat: avgLat, lng: avgLng });
      clusterMarkers.push({ overlay });
    }
  }
}

// google.maps.OverlayView-based plain HTML pin (works with or without a
// mapId/Advanced Markers -- avoids requiring a mapId just to show a
// price label, since maps-core.js's createMarker() only uses Advanced
// Markers when a mapId is present).
function placeCustomOverlay(el, position) {
  class Overlay extends google.maps.OverlayView {
    onAdd() { this.getPanes().overlayMouseTarget.appendChild(el); }
    draw() {
      const proj = this.getProjection();
      if (!proj) return;
      const point = proj.fromLatLngToDivPixel(new google.maps.LatLng(position.lat, position.lng));
      if (point) { el.style.position = 'absolute'; el.style.left = point.x + 'px'; el.style.top = point.y + 'px'; }
    }
    onRemove() { el.remove(); }
  }
  const overlay = new Overlay();
  overlay.setMap(window.__drmMap);
  return overlay;
}

// ---------------------------------------------------------------------
// Map init + controls.
// ---------------------------------------------------------------------
let drawingManager = null;
let drawnCircle = null;

async function initDrmMap() {
  const container = document.getElementById('drmMap');
  const unavailableEl = document.getElementById('drmMapUnavailable');
  if (!isConfigured()) {
    unavailableEl.classList.remove('hidden');
    unavailableEl.innerHTML = `<div class="text-center p-6 max-w-sm">
      <span class="material-symbols-outlined text-4xl text-outline mb-2 block">map</span>
      <p class="font-headline-md text-on-surface mb-1">${tr('drm.mapNotConfigured','Map view is not configured yet')}</p>
      <p class="font-body-md text-[13px] text-on-surface-variant">${tr('drm.mapNotConfiguredHint','The property list still works fully -- ask an administrator to configure the Google Maps key (see docs/GOOGLE_MAPS_CONFIGURATION.md).')}</p>
    </div>`;
    return;
  }
  const map = await initMap(container, { center: state.center, zoom: state.zoom, mapTypeControl: false });
  if (!map) {
    // A key IS configured (we passed the isConfigured() check above) but
    // the Google Maps script itself failed to load or initialize -- a
    // DIFFERENT failure mode than "not configured", and it needs its own
    // message: this branch previously just revealed #drmMapUnavailable
    // with no content ever written into it, leaving a blank, empty box
    // that additionally COVERED (being absolutely positioned on top of
    // #drmMap) the actual "Map unavailable" text maps-core.js's own
    // initMap()/renderUnavailable() had already written into #drmMap one
    // layer underneath -- net visible result was a silent blank
    // rectangle with no information at all. See the browser console for
    // [darwesh-maps-core] googleLoaderStarted/googleLoaderError lines
    // (or their absence) to pin down exactly why -- this module cannot
    // reliably tell "billing/referrer/API rejected" apart from "network
    // or CSP blocked the script" from here (see js/maps-core.js's own
    // comment on this), so the message stays generic and points at the
    // console rather than guessing.
    unavailableEl.classList.remove('hidden');
    unavailableEl.innerHTML = `<div class="text-center p-6 max-w-sm">
      <span class="material-symbols-outlined text-4xl text-outline mb-2 block">error_outline</span>
      <p class="font-headline-md text-on-surface mb-1">${tr('drm.mapLoadFailed','Map failed to load')}</p>
      <p class="font-body-md text-[13px] text-on-surface-variant">${tr('drm.mapLoadFailedHint','The property list still works fully -- an administrator should check the browser console for [darwesh-maps-core] diagnostic lines, and the Google Cloud project\'s billing status and API key restrictions (see docs/GOOGLE_MAPS_CONFIGURATION.md).')}</p>
    </div>`;
    return;
  }
  window.__drmMap = map;
  unavailableEl.classList.add('hidden');

  map.addListener('idle', () => {
    state.center = { lat: map.getCenter().lat(), lng: map.getCenter().lng() };
    state.zoom = map.getZoom();
    writeStateToUrl();
    renderMarkers(ALL_LISTINGS.filter(passesFilters));
  });

  const google = await loadGoogleMaps();
  if (google.maps.drawing) {
    drawingManager = new google.maps.drawing.DrawingManager({
      drawingMode: null,
      drawingControl: false,
      circleOptions: { fillColor: '#C89A4A', fillOpacity: 0.15, strokeColor: '#C89A4A', strokeWeight: 2, clickable: false, editable: true },
    });
    drawingManager.setMap(map);
    google.maps.event.addListener(drawingManager, 'circlecomplete', (circle) => {
      if (drawnCircle) drawnCircle.setMap(null);
      drawnCircle = circle;
      drawingManager.setDrawingMode(null);
      areaFilterFromCircle(circle);
      document.getElementById('drmResetAreaBtn').classList.remove('hidden');
    });
  }
}

function areaFilterFromCircle(circle) {
  const center = circle.getCenter();
  const radius = circle.getRadius();
  areaFilter = (l) => {
    const dist = google.maps.geometry?.spherical?.computeDistanceBetween(
      new google.maps.LatLng(l.lat, l.lng), center
    );
    return dist == null || dist <= radius;
  };
  render();
}

document.getElementById('drmSearchAreaBtn').addEventListener('click', () => {
  if (!window.__drmMap) return;
  const bounds = window.__drmMap.getBounds();
  if (!bounds) return;
  areaFilter = (l) => bounds.contains({ lat: l.lat, lng: l.lng });
  document.getElementById('drmResetAreaBtn').classList.remove('hidden');
  render();
});
document.getElementById('drmDrawAreaBtn').addEventListener('click', () => {
  if (drawingManager) drawingManager.setDrawingMode(google.maps.drawing.OverlayType.CIRCLE);
});
document.getElementById('drmResetAreaBtn').addEventListener('click', () => {
  areaFilter = null;
  if (drawnCircle) { drawnCircle.setMap(null); drawnCircle = null; }
  document.getElementById('drmResetAreaBtn').classList.add('hidden');
  render();
});
document.getElementById('drmMyLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation || !window.__drmMap) return;
  navigator.geolocation.getCurrentPosition((pos) => {
    window.__drmMap.panTo({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    window.__drmMap.setZoom(14);
  });
});
document.getElementById('drmFullscreenBtn').addEventListener('click', () => {
  const panel = document.getElementById('drmMapPanel');
  if (!document.fullscreenElement) panel.requestFullscreen?.();
  else document.exitFullscreen?.();
});
function setMapType(type, btnId) {
  if (window.__drmMap) window.__drmMap.setMapTypeId(type);
  ['drmTypeRoadmap', 'drmTypeSatellite', 'drmTypeHybrid'].forEach((id) => document.getElementById(id).classList.toggle('active', id === btnId));
}
document.getElementById('drmTypeRoadmap').addEventListener('click', () => setMapType('roadmap', 'drmTypeRoadmap'));
document.getElementById('drmTypeSatellite').addEventListener('click', () => setMapType('satellite', 'drmTypeSatellite'));
document.getElementById('drmTypeHybrid').addEventListener('click', () => setMapType('hybrid', 'drmTypeHybrid'));

// ---------------------------------------------------------------------
// Deal type toggle, filter drawer, mobile list/map toggle.
// ---------------------------------------------------------------------
function updateDealToggle() {
  document.getElementById('drmDealBuy').classList.toggle('bg-primary', state.dealType === 'sale');
  document.getElementById('drmDealBuy').classList.toggle('text-on-primary', state.dealType === 'sale');
  document.getElementById('drmDealRent').classList.toggle('bg-primary', state.dealType === 'rent');
  document.getElementById('drmDealRent').classList.toggle('text-on-primary', state.dealType === 'rent');
}
document.getElementById('drmDealBuy').addEventListener('click', () => { state.dealType = 'sale'; updateDealToggle(); writeStateToUrl(); loadListings(); });
document.getElementById('drmDealRent').addEventListener('click', () => { state.dealType = 'rent'; updateDealToggle(); writeStateToUrl(); loadListings(); });

document.getElementById('drmLocationInput').value = state.q;
document.getElementById('drmLocationInput').addEventListener('input', (e) => { state.q = e.target.value.trim(); writeStateToUrl(); render(); });

document.getElementById('drmMoreFiltersBtn').addEventListener('click', () => document.getElementById('drmFilterDrawer').classList.remove('hidden'));
document.getElementById('drmFilterCloseBtn').addEventListener('click', () => document.getElementById('drmFilterDrawer').classList.add('hidden'));
document.getElementById('drmFilterApplyBtn').addEventListener('click', () => {
  state.minPrice = Number(document.getElementById('drmMinPrice').value) || null;
  state.maxPrice = Number(document.getElementById('drmMaxPrice').value) || null;
  state.beds = Number(document.getElementById('drmBeds').value) || 0;
  state.baths = Number(document.getElementById('drmBaths').value) || 0;
  state.minArea = Number(document.getElementById('drmMinArea').value) || null;
  state.maxArea = Number(document.getElementById('drmMaxArea').value) || null;
  state.types = [...document.querySelectorAll('.drm-type-check:checked')].map((c) => c.value);
  state.readiness = document.getElementById('drmReadiness').value;
  state.projectId = document.getElementById('drmProject').value;
  state.furnished = document.getElementById('drmFurnished').checked;
  state.verified = document.getElementById('drmVerified').checked;
  state.installment = document.getElementById('drmInstallment').checked;
  document.getElementById('drmFilterDrawer').classList.add('hidden');
  const activeCount = [state.minPrice, state.maxPrice, state.beds, state.baths, state.minArea, state.maxArea, state.types.length, state.readiness !== 'any' ? 1 : 0, state.projectId, state.furnished, state.verified, state.installment].filter(Boolean).length;
  const badge = document.getElementById('drmFilterCount');
  badge.textContent = String(activeCount);
  badge.classList.toggle('hidden', activeCount === 0);
  writeStateToUrl();
  render();
});
document.getElementById('drmFilterClearBtn').addEventListener('click', () => {
  document.querySelectorAll('#drmFilterDrawer input[type=number]').forEach((i) => i.value = '');
  document.querySelectorAll('.drm-type-check').forEach((c) => c.checked = false);
  document.getElementById('drmReadiness').value = 'any';
  document.getElementById('drmProject').value = '';
  document.getElementById('drmFurnished').checked = false;
  document.getElementById('drmVerified').checked = false;
  document.getElementById('drmInstallment').checked = false;
});

document.getElementById('drmMobileListBtn').addEventListener('click', () => {
  document.getElementById('drmListPanel').classList.remove('hidden');
  document.getElementById('drmMapPanel').classList.add('hidden');
  document.getElementById('drmMobileListBtn').classList.add('bg-on-primary/20');
  document.getElementById('drmMobileMapBtn').classList.remove('bg-on-primary/20');
});
document.getElementById('drmMobileMapBtn').addEventListener('click', () => {
  document.getElementById('drmListPanel').classList.add('hidden');
  document.getElementById('drmMapPanel').classList.remove('hidden');
  document.getElementById('drmMobileMapBtn').classList.add('bg-on-primary/20');
  document.getElementById('drmMobileListBtn').classList.remove('bg-on-primary/20');
  // On mobile, initDrmMap() runs at page load while #drmMapPanel is still
  // `hidden` (the "List" tab is the default view) -- Google Maps computes
  // its tile layout from the container's size AT CONSTRUCTION TIME and
  // does not observe it becoming visible later on its own, a well-known
  // "grey/blank map after unhiding its container" failure mode. Trigger a
  // resize + recenter every time the map tab is actually shown so it
  // always ends up correctly laid out, not just on whichever viewport
  // happened to have the panel visible at construction time.
  if (window.__drmMap && window.google?.maps) {
    google.maps.event.trigger(window.__drmMap, 'resize');
    window.__drmMap.setCenter(state.center);
  }
});

// Prefill drawer inputs from URL-restored state, so a shared link
// reopens with the same filters visibly applied, not just silently
// active.
document.getElementById('drmMinPrice').value = state.minPrice || '';
document.getElementById('drmMaxPrice').value = state.maxPrice || '';
document.getElementById('drmBeds').value = String(state.beds);
document.getElementById('drmBaths').value = String(state.baths);
document.getElementById('drmMinArea').value = state.minArea || '';
document.getElementById('drmMaxArea').value = state.maxArea || '';
document.querySelectorAll('.drm-type-check').forEach((c) => { c.checked = state.types.includes(c.value); });
document.getElementById('drmReadiness').value = state.readiness;
document.getElementById('drmFurnished').checked = state.furnished;
document.getElementById('drmVerified').checked = state.verified;
document.getElementById('drmInstallment').checked = state.installment;

updateDealToggle();
initDrmMap();
// Map init (above), the projects read, and the listings read all start
// concurrently -- none of the three blocks either of the others. Listings
// render as soon as their own query resolves, using whatever project data
// (possibly none yet) is available at that moment; the extra render()
// once projects finish guarantees readiness/installment/projectName end
// up correct regardless of which of the two reads happens to finish
// first, without making the faster one wait for the slower one.
Promise.all([loadProjects(), loadListings()]).then(() => {
  document.getElementById('drmProject').value = state.projectId;
  render();
});
document.addEventListener('darwesh:langchange', render);
</script>
