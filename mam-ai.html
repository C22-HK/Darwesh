<!-- MAM AI Command Center -- Phase 1.
     The entity is the page: a living, state-driven particle body
     (js/mam-entity-3d.js) standing in for the compact orb, wired into the
     EXACT SAME conversation, voice and action machinery every other
     page's floating companion already uses (js/mam-presence.js,
     js/mam-chat-panel.js) -- nothing here is a second implementation. The
     compact companion keeps working, unchanged, on every other page: this
     is the expanded, full-page experience, not a replacement for it. -->
<main class="w-full max-w-7xl mx-auto px-4 md:px-8 py-6 md:py-10">
<div class="grid grid-cols-1 lg:grid-cols-[1.15fr_380px] gap-6 lg:gap-8 items-stretch">

<section id="mamAiStage" class="relative rounded-3xl overflow-hidden flex flex-col items-center justify-center gap-5 bg-surface-container-low/40 border border-outline-variant/40 px-6 py-10">

<button id="mamAiMicBtn" type="button" class="flex items-center justify-center w-14 h-14 rounded-full bg-secondary text-on-secondary hover:bg-secondary-container hover:text-on-secondary-container transition-colors" data-i18n-aria="mamai.askMam" aria-label="Ask MAM">
<span class="material-symbols-outlined" aria-hidden="true">mic</span>
</button>
</div>
<p class="font-body-md text-[12px] text-on-surface-variant/80 text-center max-w-sm" data-i18n="mam.disclaimer">MAM answers using Darwesh Group's real, current listings, projects and market data. Full conversational AI reasoning is not fully enabled yet -- confirm important details with an agent.</p>
</section>

<aside id="mamAiDockAnchor" class="relative rounded-3xl border border-outline-variant/40 bg-surface-container-low/25 min-h-[320px] lg:min-h-[640px]"></aside>

</div>
</main>

<script src="./js/i18n.js"></script>
<script type="module" src="./js/nav-auth.js"></script>
<script type="module" src="./js/notification-bell.js"></script>
<script type="module" src="./js/error-monitor.js"></script>

<script type="module">
  // One state machine, two renderers -- see js/mam-entity-3d.js's own
  // header comment. Nothing below re-implements the conversation, the
  // voice pipeline or the action registry: it composes the exact same
  // modules js/mam-companion-launcher.js already wires up on every other
  // page, with the particle entity standing in for the compact orb.
  import { createMamEntity3D } from './js/mam-entity-3d.js';
  import { mountMamChatPanel } from './js/mam-chat-panel.js';
  import { createPresence } from './js/mam-presence.js';

  function tr(key, fallback) { return (window.t && window.t(key)) || fallback; }
  function currentLang() { return localStorage.getItem('darwesh_lang') || 'en'; }

  const entityHost = document.getElementById('mamAiEntityHost');
  const dockAnchor = document.getElementById('mamAiDockAnchor');
  const statusLabel = document.getElementById('mamAiStatusLabel');
  const micBtn = document.getElementById('mamAiMicBtn');

  const entity = createMamEntity3D({ mountTarget: entityHost, getLanguage: currentLang, interactive: true });

  const panel = mountMamChatPanel({
    orbEl: entity.element,
    dockEl: dockAnchor,
    micEls: [micBtn],
    companion: entity,
    getLanguage: currentLang,
    pageContext: { page: 'home' }
  });

  if (panel) {
    const presence = createPresence({ companion: entity, panel, dockEl: null });
    panel.onVoiceState((next) => presence.adopt(next));

    // First interaction with the entity itself starts the voice greeting,
    // exactly like every other page's compact orb (js/mam-companion-
    // launcher.js) -- never on page load without a gesture, since both
    // speechSynthesis and an <audio> element for Kurdish TTS need one to
    // play reliably in every browser this has to work in.
    entity.element.addEventListener('click', (e) => {
      if (presence.hasAwakened) return;
      if (!window.speechSynthesis) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      presence.awaken();
    }, true);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && presence.hasAwakened) presence.minimize();
    });

    // This IS the dedicated conversation page -- the panel (transcript,
    // composer, its own internal mic) is open by default rather than
    // waiting for a second click, unlike the compact companion elsewhere.
    panel.open();

    // A short, compact status line under the entity (Part 9's "short
    // spoken progress, not long paragraphs" carried over into the on-
    // screen label). VOICE_STATES are js/mam-chat-panel.js's own internal
    // machine -- IDLE/WAKE_LISTENING/INTERRUPTED read as no active status.
    const LABEL_KEYS = {
      LISTENING: ['mamai.stateListening', 'Listening...'],
      PROCESSING: ['mamai.stateThinking', 'Thinking...'],
      SPEAKING: ['mamai.stateSpeaking', 'Speaking...'],
      ERROR: ['mamai.stateDone', 'Done']
    };
    panel.onVoiceState((next) => {
      const pair = LABEL_KEYS[next];
      statusLabel.textContent = pair ? tr(pair[0], pair[1]) : '';
    });

    window.DarweshMamPresence = presence;
  }
</script>
