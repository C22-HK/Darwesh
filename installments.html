<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://darwesh-backend-353477435585.me-central1.run.app https://overpass-api.de https://nominatim.openstreetmap.org https://www.google.com https://*.ingest.sentry.io; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script>(function(){var l=localStorage.getItem('darwesh_lang');document.documentElement.lang=l||'en';document.documentElement.dir=(l==='ku'||l==='ar')?'rtl':'ltr';})();</script>
<script src="./js/icon-fallback.js"></script>
<title>Darwesh Group - Installment Properties</title>
<link href="css/tailwind.css" rel="stylesheet"/>
<link href="css/profile-tokens.css" rel="stylesheet"/>
<link href="css/cinematic.css" rel="stylesheet"/>
<link href="css/mam-companion.css" rel="stylesheet"/>
<!-- This page is part of the service family and uses its toolbar/chip
     vocabulary (.svc-filter-chip), which lives here alongside
     service.html's and services.html's. Loading the shared sheet keeps
     one definition of that control instead of a second copy that would
     drift out of sync the first time the chip design changes. -->
<link href="css/service-universe.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  body { min-height: 100dvh; }
</style>
</head>
<body class="cine-scope bg-background text-on-surface font-body-md antialiased pt-16 pb-24 md:pb-0">

<div id="siteHeader" data-active=""></div>
<script src="./js/site-header.js"></script>
<div id="siteMobileNav" data-active=""></div>
<script src="./js/site-mobile-nav.js"></script>

<main class="ps-shell py-8">

  <header class="mb-7">
    <p class="font-label-caps text-label-caps text-secondary mb-2" data-i18n="inst.eyebrow">Darwesh Service</p>
    <h1 class="font-headline-md text-[26px] md:text-[32px] font-bold text-on-surface" data-i18n="inst.title">Installment Properties</h1>
    <p class="font-body-md text-[13.5px] text-on-surface-variant mt-2 max-w-2xl leading-relaxed" data-i18n="inst.subtitle">Properties offered on instalment plans. Every figure below is published by the developer — Darwesh does not estimate or calculate payment terms.</p>
  </header>

  <!-- Filters. Each one narrows the real published terms; none of them
       invent or derive a value. -->
  <section class="inst-filters mb-6" aria-label="Installment filters">
    <input id="fCity" class="ps-input inst-filter" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="inst.filterCity" placeholder="City or district"/>
    <input id="fMaxPrice" class="ps-input inst-filter" type="number" min="0" inputmode="numeric" data-i18n-placeholder="inst.filterMaxPrice" placeholder="Max total price"/>
    <input id="fMaxDown" class="ps-input inst-filter" type="number" min="0" max="100" inputmode="numeric" data-i18n-placeholder="inst.filterMaxDown" placeholder="Max down payment %"/>
    <input id="fMaxMonthly" class="ps-input inst-filter" type="number" min="0" inputmode="numeric" data-i18n-placeholder="inst.filterMaxMonthly" placeholder="Max monthly"/>
    <input id="fMaxMonths" class="ps-input inst-filter" type="number" min="0" inputmode="numeric" data-i18n-placeholder="inst.filterMaxMonths" placeholder="Max months"/>
    <button id="fVerified" type="button" class="svc-filter-chip" aria-pressed="false">
      <span class="material-symbols-outlined text-[15px]" aria-hidden="true">verified</span>
      <span data-i18n="inst.filterVerified">Verified only</span>
    </button>
    <button id="fReset" type="button" class="svc-filter-chip" data-i18n="inst.filterReset">Reset</button>
  </section>

  <p id="instCount" class="font-body-md text-[12.5px] text-on-surface-variant mb-4" role="status" aria-live="polite"></p>

  <div id="instLoading" aria-live="polite">
    <div class="ps-grid">
      <div class="ps-skeleton" style="height:230px;border-radius:16px;"></div>
      <div class="ps-skeleton" style="height:230px;border-radius:16px;"></div>
      <div class="ps-skeleton" style="height:230px;border-radius:16px;"></div>
    </div>
  </div>

  <div id="instGrid" class="ps-grid inst-grid"></div>
  <div id="instEmpty" class="ps-empty hidden"></div>

</main>

<div id="mamCompanionLauncher" data-page="home"></div>
<script type="module" src="./js/mam-companion-launcher.js"></script>
<script type="module" src="./js/i18n.js"></script>
<script type="module" src="./js/installments.js"></script>
</body></html>
