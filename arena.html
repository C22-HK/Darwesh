<meta name="description" content="Darwesh Arena: join real-estate Challenges, verify properties, close sales, earn points and rank up on Darwesh Group's competitive growth engine."/>
<meta property="og:title" content="Darwesh Group - Darwesh Arena"/>

<meta property="og:image" content="https://www.darweshgroup.com/images/brand/darwesh-logo-full.png"/>

<link href="css/tailwind.css" rel="stylesheet"/>
<link href="css/profile-tokens.css" rel="stylesheet"/>
<link href="css/cinematic.css" rel="stylesheet"/>
<link href="css/arena.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@600&amp;family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>

<body class="cine-scope arena-scope bg-background text-on-surface font-body-md antialiased pt-[76px] pb-24 md:pb-0">

<div id="siteHeader" data-active="arena"></div>
<script src="./js/site-header.js"></script>
<div id="siteMobileNav" data-active="arena"></div>
<script src="./js/site-mobile-nav.js"></script>

<section class="ar-hero">
  <div class="ar-container">
    <p class="ar-hero-eyebrow" data-i18n="arena.hero.eyebrow">Darwesh Group</p>
    <h1 class="ar-hero-title" data-i18n="arena.hero.title">Darwesh Arena</h1>
    <p class="ar-hero-sub" data-i18n="arena.hero.sub">Join real Challenges, bring genuine properties, close real sales — earn points, climb the rank ladder, and compete for real rewards.</p>
    <div class="ar-hero-stats">
      <div class="ar-hero-stat"><div class="ar-hero-stat-value" id="arHeroChallenges">—</div><div class="ar-hero-stat-label" data-i18n="arena.hero.statChallenges">Live Challenges</div></div>
      <div class="ar-hero-stat"><div class="ar-hero-stat-value" id="arHeroContributors">—</div><div class="ar-hero-stat-label" data-i18n="arena.hero.statContributors">Contributors Ranked</div></div>
    </div>
  </div>
</section>

<main class="ar-container" style="padding-block:20px 60px;">
  <div id="arTablist" class="ar-tablist"></div>

  <div id="arChallengesTab">
    <div id="arFilters"></div>
    <div id="arGrid" class="ar-grid"></div>
  </div>

  <div id="arLeaderboardTab" class="hidden">
    <div id="arLeaderboardWrap"></div>
  </div>

  <div id="arProgressTab" class="hidden">
    <div id="arProgressWrap"></div>
  </div>
</main>

<div id="siteFooter"></div>
<script type="module" src="./js/site-footer.js"></script>

<script type="module" src="./js/arena-hub.js"></script>
<script type="module">
  // Hero counters -- best-effort, purely decorative.
  import { listArenaChallenges, getArenaLeaderboard } from './js/backend-api.js';
  Promise.all([
    listArenaChallenges(null, 'live').catch(() => ({ challenges: [] })),
    getArenaLeaderboard(200).catch(() => ({ leaderboard: [] })),
  ]).then(([c, l]) => {
    const chEl = document.getElementById('arHeroChallenges');
    const coEl = document.getElementById('arHeroContributors');
    if (chEl) chEl.textContent = String((c.challenges || []).length);
    if (coEl) coEl.textContent = String((l.leaderboard || []).length);
  });
</script>

<script src="./js/i18n.js"></script>
<script type="module" src="./js/nav-auth.js"></script>
<script type="module" src="./js/error-monitor.js"></script>
</body></html>
